<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Credentials - CM Biz</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        zoho: {
                            sidebar: '#1a1f36',
                            active: '#2d334a',
                            blue: '#3b82f6',
                            yellow: '#f59e0b',
                            bgLight: '#f4f5f7',
                            cardBorder: '#e5e7eb'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Form Input Styling (Zoho Style) */
        .zoho-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #ffffff;
            transition: all 0.2s;
            outline: none;
        }
        .zoho-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .dark .zoho-input {
            background-color: #374151;
            border-color: #4b5563;
            color: #f3f4f6;
        }
        .dark .zoho-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        /* Readonly Fields */
        .zoho-input[readonly] {
            background-color: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }
        .dark .zoho-input[readonly] {
            background-color: #1f2937;
            color: #9ca3af;
            border-color: #374151;
        }

        .zoho-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }
        .dark .zoho-label { color: #9ca3af; }
    </style>
</head>
<body class="bg-zoho-bgLight dark:bg-gray-900 text-gray-800 dark:text-gray-200 overflow-hidden flex h-screen transition-colors duration-300">

    <aside class="bg-zoho-sidebar text-gray-300 w-64 flex-shrink-0 hidden lg:flex flex-col h-full shadow-xl z-50">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-white flex items-center justify-center text-zoho-sidebar font-bold text-lg">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg tracking-wide leading-tight">CM Biz</h1>
                    <span class="text-xs text-gray-400 font-medium">Version 1.0</span>
                </div>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-users w-5 text-center"></i> Clients
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-list-check w-5 text-center"></i> Task Manager
            </a>
            <a href="#" class="bg-zoho-active border-left border-l-4 border-zoho-blue text-white flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium">
                <i class="fa-solid fa-key w-5 text-center text-zoho-blue"></i> Credentials
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0 transition-colors">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-bars text-xl text-gray-500 lg:hidden cursor-pointer"></i>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white hidden sm:block">Portal Credentials</h2>
            </div>
            <div class="flex items-center gap-4 sm:gap-6">
                <button onclick="document.documentElement.classList.toggle('dark')" class="text-gray-500 hover:text-zoho-blue dark:text-gray-400 dark:hover:text-yellow-400 transition-colors h-8 w-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <div class="w-8 h-8 rounded-full bg-zoho-blue text-white flex items-center justify-center font-bold text-sm shadow-sm cursor-pointer">
                    H
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl mx-auto">
                
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Record Client Credentials</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Securely manage portal logins and filing frequencies.</p>
                    </div>
                    <div>
                        <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-md shadow-sm text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <i class="fa-solid fa-list mr-1"></i> View Vault
                        </button>
                    </div>
                </div>

                <form class="bg-white dark:bg-gray-800 rounded-lg border border-zoho-cardBorder dark:border-gray-700 shadow-sm overflow-hidden">
                    
                    <div class="p-6 border-b border-zoho-cardBorder dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                            
                            <div>
                                <label class="zoho-label">Row Number</label>
                                <input type="text" value="AUTO-GEN" readonly class="zoho-input font-mono text-center sm:text-left">
                            </div>

                            <div class="md:col-span-2">
                                <label class="zoho-label">Client Name <span class="text-red-500">*</span></label>
                                <div class="relative">
                                    <i class="fa-solid fa-building absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <select id="clientSelect" class="zoho-input pl-9 appearance-none font-medium" required onchange="autoFillClientId()">
                                        <option value="" disabled selected>Select Client...</option>
                                        <option value="CLT-1001">Hexa Supermarket</option>
                                        <option value="CLT-1002">TechNova Solutions</option>
                                        <option value="CLT-1003">M/s ALFA</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                                </div>
                            </div>

                            <div>
                                <label class="zoho-label">Client ID</label>
                                <input type="text" id="clientId" readonly class="zoho-input font-mono bg-gray-200 dark:bg-gray-900 border-transparent shadow-inner">
                            </div>

                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                        
                        <div>
                            <label class="zoho-label">Portal Name <span class="text-red-500">*</span></label>
                            <select id="portalName" required class="zoho-input appearance-none">
                                <option value="" disabled selected>Select Portal...</option>
                                <option value="GST Portal">GST Portal (gst.gov.in)</option>
                                <option value="Income Tax">Income Tax Portal</option>
                                <option value="MCA">MCA (Ministry of Corporate Affairs)</option>
                                <option value="EPFO">EPFO (Provident Fund)</option>
                                <option value="ESIC">ESIC Portal</option>
                                <option value="Traces">TRACES (TDS)</option>
                                <option value="Custom">Other (Specify in Notes)</option>
                            </select>
                        </div>

                        <div>
                            <label class="zoho-label">Running Service <span class="text-red-500">*</span></label>
                            <input type="text" id="runningService" placeholder="e.g. GSTR-1 & 3B Filing, TDS Return..." required class="zoho-input">
                        </div>

                        <div>
                            <label class="zoho-label">Username / Login ID <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="userName" placeholder="Enter Login ID" required class="zoho-input pl-9 font-mono text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Password <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="password" id="password" placeholder="Enter Password" required class="zoho-input pl-9 pr-10 font-mono text-sm">
                                <button type="button" onclick="togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none transition-colors rounded">
                                    <i class="fa-solid fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Return / Filing Frequency <span class="text-red-500">*</span></label>
                            <select id="returnFrequency" required class="zoho-input appearance-none">
                                <option value="" disabled selected>Select Frequency...</option>
                                <option value="Monthly">Monthly</option>
                                <option value="Quarterly">Quarterly</option>
                                <option value="Half-Yearly">Half-Yearly</option>
                                <option value="Annually">Annually</option>
                                <option value="One-Time">One-Time / As Needed</option>
                            </select>
                        </div>

                        <div>
                            <label class="zoho-label">Time Stamp</label>
                            <input type="text" id="timeStamp" readonly class="zoho-input font-mono text-xs">
                        </div>

                        <div class="md:col-span-2">
                            <label class="zoho-label">Notes / Remarks</label>
                            <textarea id="notes" rows="3" placeholder="Enter security questions, specific instructions, or contact person details..." class="zoho-input resize-none"></textarea>
                        </div>

                    </div>

                    <div class="px-6 py-4 border-t border-zoho-cardBorder dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex flex-col-reverse sm:flex-row justify-end gap-3">
                        <button type="button" class="px-5 py-2 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            Cancel
                        </button>
                        <button type="button" class="px-5 py-2 rounded-md border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition shadow-sm bg-white dark:bg-gray-800">
                            Save Draft
                        </button>
                        <button type="submit" class="px-6 py-2 rounded-md bg-zoho-blue text-white text-sm font-medium hover:bg-blue-600 transition shadow-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-shield-halved"></i> Save Credentials
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script>
        // Set today's date/time for timestamp
        document.addEventListener("DOMContentLoaded", () => {
            const now = new Date();
            const timestampStr = now.toLocaleString('en-IN', { 
                day: '2-digit', month: 'short', year: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
            document.getElementById('timeStamp').value = timestampStr;
        });

        // Auto-fill Client ID based on Dropdown Selection
        function autoFillClientId() {
            const clientSelect = document.getElementById('clientSelect');
            const clientIdField = document.getElementById('clientId');
            
            // The value of the option is set to the Client ID
            if(clientSelect.value) {
                clientIdField.value = clientSelect.value;
            } else {
                clientIdField.value = '';
            }
        }

        // Toggle Password Visibility
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.classList.add('text-zoho-blue'); // Highlight when visible
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.remove('text-zoho-blue');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
