<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheque Voucher - CM Biz</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        zoho: {
                            sidebar: '#1a1f36',
                            active: '#2d334a',
                            blue: '#3b82f6',
                            yellow: '#f59e0b',
                            bgLight: '#f4f5f7',
                            cardBorder: '#e5e7eb'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Form Input Styling (Zoho Style) */
        .zoho-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #ffffff;
            transition: all 0.2s;
            outline: none;
        }
        .zoho-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .dark .zoho-input {
            background-color: #374151;
            border-color: #4b5563;
            color: #f3f4f6;
        }
        .dark .zoho-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        /* Readonly Fields */
        .zoho-input[readonly] {
            background-color: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }
        .dark .zoho-input[readonly] {
            background-color: #1f2937;
            color: #9ca3af;
            border-color: #374151;
        }

        .zoho-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }
        .dark .zoho-label { color: #9ca3af; }
    </style>
</head>
<body class="bg-zoho-bgLight dark:bg-gray-900 text-gray-800 dark:text-gray-200 overflow-hidden flex h-screen transition-colors duration-300">

    <aside class="bg-zoho-sidebar text-gray-300 w-64 flex-shrink-0 hidden lg:flex flex-col h-full shadow-xl z-50">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-white flex items-center justify-center text-zoho-sidebar font-bold text-lg">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg tracking-wide leading-tight">CM Biz</h1>
                    <span class="text-xs text-gray-400 font-medium">Version 1.0</span>
                </div>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
            </a>
            <a href="#" class="bg-zoho-active border-left border-l-4 border-zoho-blue text-white flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium">
                <i class="fa-solid fa-money-check-dollar w-5 text-center text-zoho-blue"></i> Cheque Voucher
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-folder-open w-5 text-center"></i> Documents
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-bars text-xl text-gray-500 lg:hidden cursor-pointer"></i>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white hidden sm:block">New Cheque Voucher</h2>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="document.documentElement.classList.toggle('dark')" class="text-gray-500 hover:text-zoho-blue w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <div class="w-8 h-8 rounded-full bg-zoho-blue text-white flex items-center justify-center font-bold text-sm">H</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-5xl mx-auto">
                
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Record Cheque Payment</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Fill out the details below to issue a new cheque voucher.</p>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-md shadow-sm text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <i class="fa-solid fa-list mr-1"></i> View List
                        </button>
                    </div>
                </div>

                <form class="bg-white dark:bg-gray-800 rounded-lg border border-zoho-cardBorder dark:border-gray-700 shadow-sm overflow-hidden">
                    
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-6 border-b border-zoho-cardBorder dark:border-gray-700 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="zoho-label">Row Number</label>
                            <input type="text" value="AUTO-GEN" readonly class="zoho-input font-mono text-center sm:text-left sm:w-1/2">
                        </div>
                        <div>
                            <label class="zoho-label">Time Stamp</label>
                            <input type="text" id="timeStamp" readonly class="zoho-input font-mono sm:w-3/4">
                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-5">
                        
                        <div class="md:col-span-2">
                            <label class="zoho-label">Party Name <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" placeholder="Select or type payee name" required class="zoho-input pl-9">
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Amount <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-semibold">₹</span>
                                <input type="number" step="0.01" placeholder="0.00" required class="zoho-input pl-8 font-semibold text-gray-900 dark:text-white">
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Bank Name <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-building-columns absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <select required class="zoho-input pl-9 appearance-none">
                                    <option value="" disabled selected>Select Bank...</option>
                                    <option>HDFC Bank - A/C 1234</option>
                                    <option>SBI - A/C 5678</option>
                                    <option>ICICI Bank - A/C 9012</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Cheque No. <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-money-check absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" placeholder="e.g. 000123" required class="zoho-input pl-9 font-mono">
                            </div>
                        </div>

                        <div>
                            <label class="zoho-label">Cheque Status <span class="text-red-500">*</span></label>
                            <select required class="zoho-input appearance-none">
                                <option value="Issued" selected>Issued (Pending)</option>
                                <option value="Cleared">Cleared</option>
                                <option value="Bounced">Bounced</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>

                        <div>
                            <label class="zoho-label">Date of Issue <span class="text-red-500">*</span></label>
                            <input type="date" id="dateOfIssue" required class="zoho-input">
                        </div>

                        <div>
                            <label class="zoho-label">Cheque Date <span class="text-red-500">*</span></label>
                            <input type="date" required class="zoho-input">
                        </div>

                        <div class="md:col-span-2 lg:col-span-3">
                            <label class="zoho-label">Notes / Narration</label>
                            <textarea rows="2" placeholder="Enter purpose of payment or remarks..." class="zoho-input resize-none"></textarea>
                        </div>

                    </div>

                    <div class="bg-gray-50 dark:bg-gray-800/50 px-6 py-4 border-t border-zoho-cardBorder dark:border-gray-700 flex flex-col-reverse sm:flex-row justify-end gap-3">
                        <button type="button" class="px-5 py-2 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            Cancel
                        </button>
                        <button type="button" class="px-5 py-2 rounded-md border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition shadow-sm">
                            Save as Draft
                        </button>
                        <button type="submit" class="px-6 py-2 rounded-md bg-zoho-blue text-white text-sm font-medium hover:bg-blue-600 transition shadow-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> Post Voucher
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Timestamp Generation
            const now = new Date();
            const timestampStr = now.toLocaleString('en-IN', { 
                day: '2-digit', month: 'short', year: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
            document.getElementById('timeStamp').value = timestampStr;

            // Set current date as default for 'Date of Issue'
            const today = now.toISOString().split('T')[0];
            document.getElementById('dateOfIssue').value = today;
        });
    </script>
</body>
</html>
