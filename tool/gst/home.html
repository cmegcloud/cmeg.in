<div class="card text-center">
    <div class="row">
        <div class="col-sm-4 col-xs-12">
            <a data-ng-click="page('/gstr/dashboard')">
                <div class="hd">
                    <p class="inv">Upload new invoice/other data for return</p>
                </div>
            </a>
            <div class="ct">
                <div class="row">
                    <div class="col-xs-offset-3 col-xs-6">
                        <button class="btn btn-primary" data-ng-click="newreturn()" data-toggle="tooltip"
                            title="Upload new invoice/other data" data-placement="bottom">New</button>
                    </div>
                </div>
            </div>
        </div>

<script>
    var acc = document.getElementsByClassName("accordion");
    var index;

    for (index = 0; index < acc.length; index++) {
        acc[index].addEventListener("click", function () {
            this.classList.toggle("active");
            var panel = this.nextElementSibling;
            if (panel.style.maxHeight) {
                panel.style.maxHeight = null;
            } else {
                panel.style.maxHeight = panel.scrollHeight + "px";
            }
        });
    }
</script>
