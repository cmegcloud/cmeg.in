<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ledger Entry - CM Biz</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        zoho: {
                            sidebar: '#1a1f36',
                            active: '#2d334a',
                            blue: '#3b82f6',
                            yellow: '#f59e0b',
                            bgLight: '#f4f5f7',
                            cardBorder: '#e5e7eb'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Form Input Styling (Zoho Style) */
        .zoho-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #ffffff;
            transition: all 0.2s;
            outline: none;
        }
        .zoho-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .dark .zoho-input {
            background-color: #374151;
            border-color: #4b5563;
            color: #f3f4f6;
        }
        .dark .zoho-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        /* Readonly Fields */
        .zoho-input[readonly] {
            background-color: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }
        .dark .zoho-input[readonly] {
            background-color: #1f2937;
            color: #9ca3af;
            border-color: #374151;
        }

        .zoho-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }
        .dark .zoho-label { color: #9ca3af; }
    </style>
</head>
<body class="bg-zoho-bgLight dark:bg-gray-900 text-gray-800 dark:text-gray-200 overflow-hidden flex h-screen transition-colors duration-300">

    <aside class="bg-zoho-sidebar text-gray-300 w-64 flex-shrink-0 hidden lg:flex flex-col h-full shadow-xl z-50">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-white flex items-center justify-center text-zoho-sidebar font-bold text-lg">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg tracking-wide leading-tight">CM Biz</h1>
                    <span class="text-xs text-gray-400 font-medium">Version 1.0</span>
                </div>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
            </a>
            <a href="#" class="bg-zoho-active border-left border-l-4 border-zoho-blue text-white flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium">
                <i class="fa-solid fa-book-open w-5 text-center text-zoho-blue"></i> Chart of Accounts
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-receipt w-5 text-center"></i> Vouchers
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-white/5 transition-colors text-sm font-medium">
                <i class="fa-solid fa-users w-5 text-center"></i> Clients
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0 transition-colors">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-bars text-xl text-gray-500 lg:hidden cursor-pointer"></i>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white hidden sm:block">Ledger Master</h2>
            </div>
            <div class="flex items-center gap-4 sm:gap-6">
                <button onclick="document.documentElement.classList.toggle('dark')" class="text-gray-500 hover:text-zoho-blue dark:text-gray-400 dark:hover:text-yellow-400 transition-colors h-8 w-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <div class="w-8 h-8 rounded-full bg-zoho-blue text-white flex items-center justify-center font-bold text-sm shadow-sm cursor-pointer">
                    H
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl mx-auto">
                
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Create Ledger Account</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Add a new account to your Chart of Accounts.</p>
                    </div>
                    <div>
                        <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-md shadow-sm text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <i class="fa-solid fa-list-ul mr-1"></i> View Ledgers
                        </button>
                    </div>
                </div>

                <form class="bg-white dark:bg-gray-800 rounded-lg border border-zoho-cardBorder dark:border-gray-700 shadow-sm overflow-hidden">
                    
                    <div class="p-6 border-b border-zoho-cardBorder dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            <div>
                                <label class="zoho-label">Row Number</label>
                                <input type="text" value="AUTO-GEN" readonly class="zoho-input font-mono text-center sm:text-left sm:w-1/2">
                            </div>

                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                        
                        <div class="md:col-span-2">
                            <label class="zoho-label">Ledger Name <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-book absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="ledgerName" placeholder="e.g. Printing & Stationery, HDFC Bank, Ramesh Traders..." required class="zoho-input pl-9 font-bold text-gray-900 dark:text-white text-base">
                            </div>
                        </div>

                        <div class="md:col-span-2">
                            <label class="zoho-label">Ledger Category / Group <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <i class="fa-solid fa-folder-tree absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <select id="ledgerCategory" required class="zoho-input pl-9 appearance-none font-medium">
                                    <option value="" disabled selected>Select Category...</option>
                                    <optgroup label="Assets">
                                        <option value="Fixed Assets">Fixed Assets</option>
                                        <option value="Current Assets">Current Assets</option>
                                        <option value="Bank Accounts">Bank Accounts</option>
                                        <option value="Cash-in-Hand">Cash-in-Hand</option>
                                        <option value="Sundry Debtors">Sundry Debtors (Customers)</option>
                                    </optgroup>
                                    <optgroup label="Liabilities">
                                        <option value="Capital Account">Capital Account</option>
                                        <option value="Current Liabilities">Current Liabilities</option>
                                        <option value="Loans (Liability)">Loans (Liability)</option>
                                        <option value="Sundry Creditors">Sundry Creditors (Suppliers)</option>
                                    </optgroup>
                                    <optgroup label="Income">
                                        <option value="Direct Income">Direct Income (Sales)</option>
                                        <option value="Indirect Income">Indirect Income</option>
                                    </optgroup>
                                    <optgroup label="Expenses">
                                        <option value="Direct Expenses">Direct Expenses (Purchases)</option>
                                        <option value="Indirect Expenses">Indirect Expenses</option>
                                    </optgroup>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                            </div>
                        </div>

                    </div>

                    <div class="p-6 border-t border-zoho-cardBorder dark:border-gray-700 bg-gray-50 dark:bg-gray-800/30">
                        <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-scale-balanced text-zoho-blue"></i> Opening Balance Details
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="zoho-label">Opening Balance</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-semibold">₹</span>
                                    <input type="number" step="0.01" placeholder="0.00" class="zoho-input pl-8 font-semibold text-gray-900 dark:text-white">
                                </div>
                            </div>

                            <div>
                                <label class="zoho-label">Dr / Cr Indicator</label>
                                <div class="relative">
                                    <select id="drCr" class="zoho-input appearance-none font-medium">
                                        <option value="Dr" selected>Dr (Debit)</option>
                                        <option value="Cr">Cr (Credit)</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="px-6 py-4 border-t border-zoho-cardBorder dark:border-gray-700 bg-white dark:bg-gray-800 flex flex-col-reverse sm:flex-row justify-end gap-3">
                        <button type="button" class="px-5 py-2 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            Cancel
                        </button>
                        <button type="button" class="px-5 py-2 rounded-md border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition shadow-sm bg-gray-50 dark:bg-gray-800/50">
                            Save & Add Another
                        </button>
                        <button type="submit" class="px-6 py-2 rounded-md bg-zoho-blue text-white text-sm font-medium hover:bg-blue-600 transition shadow-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-save"></i> Save Ledger
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script>
        // Sidebar Toggle Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            sidebar.classList.toggle('-translate-x-full');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-0'), 10);
            }
        }

        // Dark Mode Toggle Logic
        function toggleTheme() {
            const htmlElement = document.documentElement;
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Theme from LocalStorage or System Preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // Auto-select Dr/Cr based on Category selection
        document.getElementById('ledgerCategory').addEventListener('change', function(e) {
            const category = e.target.value;
            const drCrSelect = document.getElementById('drCr');
            
            // Assets and Expenses default to Dr. Liabilities, Equity, and Income default to Cr.
            const debitCategories = ['Fixed Assets', 'Current Assets', 'Bank Accounts', 'Cash-in-Hand', 'Sundry Debtors', 'Direct Expenses', 'Indirect Expenses'];
            
            if(debitCategories.includes(category)) {
                drCrSelect.value = 'Dr';
            } else {
                drCrSelect.value = 'Cr';
            }
        });
    </script>
</body>
</html>
