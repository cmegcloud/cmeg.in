<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F5F1">
    <title>CMBooks - Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <style>
        /* (Keep ALL your previous CSS styles exactly as they were here) */
        :root {
            --primary: #CD5C48;
            --primary-light: #FCECE8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #222222;
            --text-muted: #777777;
            --border: #E8E5E1;
            --grey-light: #F4F4F4;
            --grey-med: #D9D9D9;
            --grey-dark: #666666;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --sidebar-width: 280px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; }
        .app-view { display: none; animation: fadeIn 0.3s ease; }
        .app-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); z-index: 1001; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); box-shadow: var(--shadow-md); }
        .sidebar.active { transform: translateX(0); }
        .sidebar-header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; }
        .sidebar-brand h2 { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .close-menu { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-nav::-webkit-scrollbar { display: none; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-main); text-decoration: none; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
        .nav-link span.material-symbols-rounded { color: var(--text-muted); font-size: 22px; transition: color 0.2s; }
        .nav-link:hover, .nav-link:active { background: var(--bg); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-link.active span.material-symbols-rounded { color: var(--primary); font-variation-settings: 'FILL' 1; }
        .menu-badge { margin-left: auto; background: var(--primary); color: white; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 100px; }
        .menu-badge.pending { background: var(--grey-dark); }
        .nav-divider { height: 1px; background: var(--border); margin: 12px 16px; }
        .main-content { flex: 1; width: 100%; padding: 0 16px calc(90px + env(safe-area-inset-bottom)) 16px; display: flex; flex-direction: column; align-items: center; transition: margin-left 0.3s ease; }
        .app-container { width: 100%; max-width: 1120px; }
        .header { width: 100%; position: sticky; top: 0; z-index: 900; background: rgba(248, 245, 241, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: max(16px, env(safe-area-inset-top)) 0 16px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .brand-info h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .brand-info small { color: var(--text-muted); font-size: 12px; font-weight: 500; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .icon-btn { position: relative; background: var(--surface); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; box-shadow: var(--shadow-sm); }
        .icon-btn .dot { position: absolute; top: 10px; right: 12px; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; border: 2px solid var(--surface); }
        .profile-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--grey-dark); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer; }
        .section-title { font-size: 18px; font-weight: 700; margin: 24px 0 16px 0; color: var(--text-main); }
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .stat-card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
        .stat-card.grey-theme { background: var(--grey-light); border: 1px solid var(--border); }
        .stat-card.grey-theme .stat-icon { background: var(--surface); color: var(--grey-dark); box-shadow: var(--shadow-sm); }
        .stat-header { display: flex; justify-content: space-between; align-items: center; }
        .stat-label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .stat-icon { background: var(--primary-light); color: var(--primary); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .stat-main-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .sub-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); }
        .stat-card.grey-theme .sub-stats-grid { border-top: 1px solid var(--grey-med); }
        .sub-stat { display: flex; flex-direction: column; gap: 4px; }
        .sub-stat .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .sub-stat .val { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        .form-card h4 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; }
        .form-input:focus { border-color: var(--primary); background: var(--surface); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.8; }
        .graph-container { width: 100%; height: 140px; margin-top: 8px; position: relative; }
        .x-axis-labels { display: flex; justify-content: space-between; margin-top: 12px; padding: 0 4px; color: var(--text-muted); font-size: 11px; font-weight: 500; }
        .table-container { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-header h4 { font-size: 16px; font-weight: 600; }
        .filter-btn { background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .saas-table { width: 100%; border-collapse: collapse; text-align: left; }
        .saas-table th { padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); }
        .saas-table td { padding: 16px 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); }
        .saas-table tr:last-child td { border-bottom: none; }
        .patient-info { display: flex; flex-direction: column; }
        .patient-info .pid { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .badge { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .badge.completed { background: var(--grey-light); color: var(--grey-dark); border: 1px solid var(--grey-med); }
        .badge.completed::before { background: var(--grey-dark); }
        .badge.scheduled { background: var(--primary-light); color: var(--primary); }
        .badge.scheduled::before { background: var(--primary); }
        .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 24px rgba(0,0,0,0.04); display: flex; justify-content: space-around; align-items: center; z-index: 950; }
        .bottom-item { text-align: center; color: var(--text-muted); padding: 12px 10px; cursor: pointer; flex: 1; border: none; background: transparent; }
        .bottom-item.active { color: var(--primary); }
        .bottom-item span { font-size: 24px; margin-bottom: 4px; display: block; }
        .bottom-item.active span { font-variation-settings: 'FILL' 1; }
        .bottom-item small { display: block; font-size: 10px; font-weight: 600; }
        @media (min-width: 768px) { .input-group { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1024px) { .sidebar { transform: translateX(0); box-shadow: none; } .close-menu { display: none; } .main-content { margin-left: var(--sidebar-width); padding-bottom: 40px; } .dashboard-grid { grid-template-columns: repeat(3, 1fr); } .bottom-nav { display: none; } .overlay { display: none !important; } .chart-widget { grid-column: 1 / -1; } }
        @media (max-width: 767px) { .saas-table thead { display: none; } .saas-table, .saas-table tbody, .saas-table tr, .saas-table td { display: block; width: 100%; } .saas-table tr { padding: 16px; border-bottom: 1px solid var(--border); } .saas-table td { padding: 4px 0; border: none; display: flex; justify-content: space-between; align-items: center; } .saas-table td::before { content: attr(data-label); font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; } .saas-table td:nth-child(1) { padding-bottom: 12px; } .saas-table td:nth-child(1)::before { display: none; } .saas-table td:nth-child(1) .patient-info { flex-direction: row; align-items: baseline; gap: 8px; } }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="sidebar" id="sidebar"></nav>

<div class="main-content">
    <div class="app-container">
        
        <header class="header">
            <div class="brand-info">
                <small id="header-subtitle">Overview</small>
                <h3 id="header-title">Dashboard</h3>
            </div>
            
            <div class="header-actions">
                <div class="icon-btn" title="Search">
                    <span class="material-symbols-rounded">search</span>
                </div>
                <div class="icon-btn" title="Notifications">
                    <span class="material-symbols-rounded">notifications</span>
                    <div class="dot"></div>
                </div>
                <div class="profile-avatar">CM</div>
            </div>
        </header>

        <div id="view-dashboard" class="app-view active">
            <h2 class="section-title">Overview Metrics</h2>
             <div class="dashboard-grid">
                 <div class="stat-card">
                     <div class="stat-header">
                         <span class="stat-label">Today's Appointments</span>
                         <div class="stat-icon"><span class="material-symbols-rounded">calendar_today</span></div>
                     </div>
                     <div class="stat-main-value" style="color: var(--primary);">45</div>
                     <div class="sub-stats-grid">
                         <div class="sub-stat"><span class="label">Completed</span><span class="val">28</span></div>
                         <div class="sub-stat"><span class="label">Rescheduled</span><span class="val">12</span></div>
                         <div class="sub-stat"><span class="label">Cancelled</span><span class="val">5</span></div>
                     </div>
                 </div>
             </div>
        </div>

        <div id="view-patients" class="app-view">
            <h2 class="section-title">Patient Management</h2>
             <div class="form-card"><p style="color: var(--text-muted);">Patient UI goes here.</p></div>
        </div>
        
        <div id="view-appointments" class="app-view">
            <h2 class="section-title">Appointments Directory</h2>
            <div class="form-card"><p style="color: var(--text-muted);">Appointments module UI goes here.</p></div>
        </div>

    </div>
</div>

<nav class="bottom-nav">
    <button class="bottom-item active" onclick="switchView('view-dashboard', this, true)">
        <span class="material-symbols-rounded">dashboard</span>
        <small>Home</small>
    </button>
    <button class="bottom-item" onclick="switchView('view-patients', this, true)">
        <span class="material-symbols-rounded">groups</span>
        <small>Patients</small>
    </button>
    <button class="bottom-item" onclick="switchView('view-appointments', this, true)">
        <span class="material-symbols-rounded">calendar_month</span>
        <small>Appts</small>
    </button>
    <button class="bottom-item" onclick="toggleMenu()">
        <span class="material-symbols-rounded">menu</span>
        <small>More</small>
    </button>
</nav>

<script>
    // --- 1. NEW: Fetch and Inject the Navigation Menu ---
    document.addEventListener("DOMContentLoaded", () => {
        fetch('nav.html')
            .then(response => {
                if (!response.ok) throw new Error("Could not load nav.html. Are you running a local server?");
                return response.text();
            })
            .then(data => {
                document.getElementById('sidebar').innerHTML = data;
            })
            .catch(error => {
                console.error(error);
                document.getElementById('sidebar').innerHTML = `<div style="padding: 20px; color: red;">Failed to load navigation. You must run this using a local web server to bypass CORS.</div>`;
            });
    });

    // --- 2. Existing SPA Routing Logic ---
    function switchView(targetId, clickedElement, isBottomNav = false) {
        const allViews = document.querySelectorAll('.app-view');
        allViews.forEach(view => view.style.display = 'none');
        document.getElementById(targetId).style.display = 'block';

        const headerTitle = document.getElementById('header-title');
        const headerSubtitle = document.getElementById('header-subtitle');
        if (targetId === 'view-dashboard') { headerTitle.innerText = "Dashboard"; headerSubtitle.innerText = "Overview"; } 
        else if (targetId === 'view-patients') { headerTitle.innerText = "Patient Data"; headerSubtitle.innerText = "Records"; } 
        else if (targetId === 'view-appointments') { headerTitle.innerText = "Appointments"; headerSubtitle.innerText = "Schedule"; }

        const sidebarLinks = document.querySelectorAll('.sidebar-nav .nav-link');
        sidebarLinks.forEach(link => link.classList.remove('active'));
        const bottomLinks = document.querySelectorAll('.bottom-nav .bottom-item');
        bottomLinks.forEach(link => link.classList.remove('active'));

        if (isBottomNav) {
            clickedElement.classList.add('active');
            const correspondingSidebar = document.querySelector(`.sidebar-nav .nav-link[data-target="${targetId}"]`);
            if(correspondingSidebar) correspondingSidebar.classList.add('active');
        } else {
            clickedElement.classList.add('active');
            if (targetId === 'view-dashboard') bottomLinks.classList.add('active');
            [cite_start]if (targetId === 'view-patients') bottomLinks[1].classList.add('active');
            [cite_start]if (targetId === 'view-appointments') bottomLinks[2].classList.add('active');
        }

        if(window.innerWidth < 1024 && document.getElementById('sidebar').classList.contains('active')) {
            toggleMenu();
        }
    }

    // --- 3. Existing Mobile Toggle Logic ---
    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    }
</script>

</body>
</html>
