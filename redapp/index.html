<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CMBooks - Corporate SaaS Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    
    <style>
        /* --- Global Variables --- */
        :root {
            --primary: #e16349;
            --primary-light: #FCECE8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #222222;
            --text-muted: #777777;
            --border: #E8E5E1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            
            /* Graph Theme Colors */
            --graph-base: #F0F0F0;
            --graph-accent: #444444; 
            --success: #34A853;
        }

        /* --- App Shell Layout --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            display: flex; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background: var(--bg); 
            color: var(--text-main); 
        }

        /* Sidebar Container */
        #sidebar-container {
            width: 260px;
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        /* Main Interface */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #header-container { flex-shrink: 0; }
        
        #bottomnav-container { display: none; flex-shrink: 0; }

        /* Dynamic Content Area */
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            -webkit-overflow-scrolling: touch;
        }

        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Dashboard Specific Styles (Ring Graphs & Progress Bars) --- */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .dash-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-title { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 16px; letter-spacing: 0.5px; }

        /* Progress Bar Logic */
        .progress-wrapper { margin-bottom: 16px; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .progress-track { width: 100%; height: 8px; background: var(--graph-base); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; }

        /* Ring Graph SVG Logic */
        .ring-graph-container { display: flex; align-items: center; justify-content: center; position: relative; width: 140px; height: 140px; margin: 0 auto; }
        .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-bg { fill: none; stroke: var(--graph-base); stroke-width: 12; }
        .ring-segment-1 { fill: none; stroke: var(--primary); stroke-width: 12; stroke-dasharray: 200 400; stroke-linecap: round; } /* 65% Booked */
        .ring-segment-2 { fill: none; stroke: var(--graph-accent); stroke-width: 12; stroke-dasharray: 80 400; stroke-dashoffset: -210; stroke-linecap: round; } /* 25% Completed */
        
        .ring-center-text { position: absolute; text-align: center; }
        .ring-total { font-size: 28px; font-weight: 800; color: var(--text-main); line-height: 1; }
        .ring-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

        .graph-legend { margin-top: 20px; display: flex; justify-content: space-around; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #sidebar-container { position: fixed; z-index: 1000; transform: translateX(-100%); width: 280px; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
            #sidebar-container.open { transform: translateX(0); }
            #bottomnav-container { display: block; }
            #main-content { padding: 16px; padding-bottom: 80px; /* Space for bottom nav */ }
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-wrapper">
        
        <div id="header-container"></div>

        <main id="main-content">
            
            <div id="view-dashboard" class="view-section active">
                <h2 style="font-size: 22px; margin-bottom: 24px; color: var(--primary); font-weight: 800;">Overview Dashboard</h2>
                
                <div class="dash-grid">
                    
                    <div class="dash-card">
                        <div class="card-title">Revenue & Receivables</div>
                        
                        <div class="progress-wrapper">
                            <div class="progress-labels">
                                <span style="color: var(--text-main);">Target Achieved</span>
                                <span style="color: var(--primary);">₹3,20,000 / ₹4,00,000</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: 80%; background: var(--primary);"></div>
                            </div>
                        </div>

                        <div class="progress-wrapper" style="margin-top: 24px;">
                            <div class="progress-labels">
                                <span style="color: var(--text-main);">Payments Received</span>
                                <span style="color: var(--graph-accent);">₹2,80,000 (87%)</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: 87%; background: var(--graph-accent);"></div>
                            </div>
                        </div>

                        <div class="progress-wrapper" style="margin-top: 24px;">
                            <div class="progress-labels">
                                <span style="color: var(--text-main);">Pending Dues</span>
                                <span style="color: #EA4335;">₹40,000 (13%)</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: 13%; background: #EA4335;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="dash-card">
                        <div class="card-title">Today's Appointments</div>
                        
                        <div class="ring-graph-container">
                            <svg class="ring-svg" viewBox="0 0 100 100">
                                <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
                                <circle class="ring-segment-1" cx="50" cy="50" r="40"></circle>
                                <circle class="ring-segment-2" cx="50" cy="50" r="40"></circle>
                            </svg>
                            <div class="ring-center-text">
                                <div class="ring-total">42</div>
                                <div class="ring-label">Total Slots</div>
                            </div>
                        </div>

                        <div class="graph-legend">
                            <div><span class="legend-dot" style="background: var(--primary);"></span> Booked (28)</div>
                            <div><span class="legend-dot" style="background: var(--graph-accent);"></span> Completed (10)</div>
                            <div><span class="legend-dot" style="background: var(--graph-base);"></span> Available (4)</div>
                        </div>
                    </div>

                </div>
            </div>

            <div id="view-patients" class="view-section"></div>
            <div id="view-appointments" class="view-section"></div>
            <div id="view-transactions" class="view-section"></div>
            <div id="view-billing" class="view-section"></div>
            <div id="view-branches" class="view-section"></div>
            <div id="view-therapists" class="view-section"></div>
            <div id="view-staffs" class="view-section"></div>
            <div id="view-attendance" class="view-section"></div>
            <div id="view-users" class="view-section"></div>
            <div id="view-clinic-details" class="view-section"></div>
            
        </main>

        <div id="bottomnav-container"></div>

    </div>

    <script>
        // 1. Map your UI View IDs exactly to the HTML files we built
        const fileMap = {
            'view-patients': 'patients.html',
            'view-appointments': 'appointments.html', // Fixed mapping
            'view-transactions': 'transaction.html',
            'view-billing': 'estimate.html', // Linking billing menu to the estimate template
            'view-branches': 'branches.html',
            'view-therapists': 'therapist.html',
            'view-staffs': 'staff.html',
            'view-attendance': 'attendance.html',
            'view-clinic-details': 'clinicdetails.html'
        };

        // 2. Load Core Layout Components on Startup
        window.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-container', 'header.html');
            loadComponent('sidebar-container', 'sidebar.html');
            loadComponent('bottomnav-container', 'bottomnav.html');
        });

        async function loadComponent(elementId, filename) {
            try {
                const response = await fetch(filename);
                if (response.ok) {
                    document.getElementById(elementId).innerHTML = await response.text();
                }
            } catch (error) {
                console.error(`Error loading ${filename}: Server environment required.`);
            }
        }

        // 3. The Core SPA Router Logic
        async function switchView(targetId, navElement) {
            
            // Highlight active nav item
            document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => el.classList.remove('active'));
            if(navElement) navElement.classList.add('active');

            // Hide all views
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
            });

            const targetDiv = document.getElementById(targetId);

            // Dashboard is hardcoded in this index.html file, so show it immediately
            if(targetId === 'view-dashboard') {
                targetDiv.classList.add('active');
                if(window.innerWidth <= 768) toggleSidebar(); // Auto-close sidebar on mobile
                return;
            }

            // For external files, fetch them dynamically if empty
            if(targetDiv.innerHTML.trim() === '') {
                targetDiv.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--primary);">Loading module securely...</div>';
                targetDiv.classList.add('active');

                try {
                    const response = await fetch(fileMap[targetId]);
                    if (!response.ok) throw new Error('File fetch failed');
                    
                    const htmlText = await response.text();
                    
                    // Parse the external HTML file to strip its <html><head> tags and grab only the content
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const moduleContent = doc.querySelector('.module-container') || doc.body;

                    targetDiv.innerHTML = ''; 
                    targetDiv.appendChild(moduleContent);

                    // Re-execute scripts from fetched files (like the edit toggles or attendance scripts)
                    const scripts = targetDiv.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                } catch (error) {
                    targetDiv.innerHTML = `<div style="text-align:center; padding: 40px; color: #EA4335;">
                        <b>Security Block (CORS):</b><br> To dynamically load <i>${fileMap[targetId]}</i>, you must run this project through a local web server (like VS Code Live Server).
                    </div>`;
                }
            } else {
                targetDiv.classList.add('active');
            }

            // Close sidebar automatically on mobile after clicking a link
            if(window.innerWidth <= 768 && document.getElementById('sidebar-container').classList.contains('open')) {
                toggleSidebar();
            }
        }

        // 4. Mobile Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            sidebar.classList.toggle('open');
        }
    </script>

</body>
</html>
