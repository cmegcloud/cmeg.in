<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Patient Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="patient-module">
    
    <style>
        /* --- Core Theme Variables --- */
        :root {
            --primary: #e16349;
            --primary-light: #fef5e8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #0a0a0a;
            --text-muted: #777777;
            --border: #E8E5E1;
            --grey-light: #F4F4F4;
            --grey-med: #D9D9D9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            --success: #10B981;
            --danger: #FB923C;
        }

        #patient-module { font-family: 'Inter', sans-serif; }
        
        /* --- UI Components --- */
        #patient-module .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        
        #patient-module .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        #patient-module .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        #patient-module .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { #patient-module .input-group { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1024px) { #patient-module .input-group.three-cols { grid-template-columns: 1fr 1fr 1fr; } }

        #patient-module .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        #patient-module .form-input:focus { border-color: var(--primary); background: var(--surface); }
        #patient-module .form-input:disabled { background: #F0F0F0; color: #999; cursor: not-allowed; }

        #patient-module .readonly-input { background: transparent; border: 1px dashed transparent; padding-left: 0; font-weight: 700; color: var(--text-main); pointer-events: none; }

        #patient-module .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        #patient-module .btn-primary:active { opacity: 0.8; }
        #patient-module .btn-primary:disabled { background: var(--grey-med); cursor: not-allowed; }
        
        #patient-module .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        #patient-module .btn-verify { background: var(--text-main); color: #fff; border: none; padding: 0 20px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 13px;}

        /* --- Validation Message --- */
        #patient-module .validation-msg { font-size: 12px; font-weight: 600; margin-top: 6px; display: none; }
        #patient-module .validation-msg.success { color: var(--success); display: block; }
        #patient-module .validation-msg.error { color: var(--danger); display: block; }

        /* --- Table Styling --- */
        #patient-module .table-container { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        #patient-module .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #patient-module .table-header h4 { font-size: 16px; font-weight: 600; margin: 0; }
        #patient-module .saas-table { width: 100%; border-collapse: collapse; text-align: left; }
        #patient-module .saas-table th { padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); }
        #patient-module .saas-table td { padding: 16px 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); }
        #patient-module .saas-table tr:last-child td { border-bottom: none; }
        #patient-module .patient-info { display: flex; flex-direction: column; }
        #patient-module .patient-info .pid { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-weight: 700; }

        /* Mobile Table Fix */
        @media (max-width: 767px) {
            #patient-module .saas-table thead { display: none; }
            #patient-module .saas-table, #patient-module .saas-table tbody, #patient-module .saas-table tr, #patient-module .saas-table td { display: block; width: 100%; }
            #patient-module .saas-table tr { padding: 16px; border-bottom: 1px solid var(--border); }
            #patient-module .saas-table td { padding: 4px 0; border: none; display: flex; justify-content: space-between; align-items: center; }
            #patient-module .saas-table td::before { content: attr(data-label); font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
            #patient-module .saas-table td:nth-child(1) { padding-bottom: 12px; }
            #patient-module .saas-table td:nth-child(1)::before { display: none; }
            #patient-module .saas-table td:nth-child(1) .patient-info { flex-direction: row; align-items: baseline; gap: 8px; }
        }
    </style>

    <div class="section-title">
        <h2 style="margin: 0;">Patient Management</h2>
    </div>

    <div class="form-card">
        <h4 style="color: var(--primary); margin: 0 0 16px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Register New Patient</h4>
        
        <form id="add-patient-form" onsubmit="event.preventDefault();">
            
            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Patient ID</label>
                    <input type="text" id="patientIdInput" class="form-input readonly-input" value="Auto-Generated" readonly tabindex="-1">
                </div>

                <div style="grid-column: span 2;">
                    <label class="form-label">Mobile Number (Search / Validate) *</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="mobileInput" class="form-input" placeholder="Enter 10-digit mobile number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required style="font-weight: 600; letter-spacing: 1px;">
                        <button type="button" class="btn-verify" id="verifyBtn" onclick="window.verifyMobile()">Verify</button>
                    </div>
                    <div id="mobileValidationMsg" class="validation-msg"></div>
                </div>
            </div>

            <fieldset id="patientDetailsFieldset" style="border: none; padding: 0; margin: 0;" disabled>
                <div class="input-group three-cols">
                    <div style="grid-column: span 2;">
                        <label class="form-label">Patient Name *</label>
                        <input type="text" id="patientName" class="form-input" placeholder="Full Name" required>
                    </div>
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" id="patientAge" class="form-input" placeholder="Years" min="1" max="120">
                    </div>
                </div>

                <div class="input-group">
                    <div>
                        <label class="form-label">Gender</label>
                        <select id="patientGender" class="form-input">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label class="form-label">Address</label>
                        <textarea id="patientAddress" class="form-input" rows="2" placeholder="Full residential address..."></textarea>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label class="form-label">Notes / Medical History</label>
                        <textarea id="patientNotes" class="form-input" rows="3" placeholder="Any specific notes or initial observations..."></textarea>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 16px;">
                    <button type="reset" class="btn-outline" style="margin-right: 12px;" onclick="window.resetForm()">Clear Form</button>
                    <button type="button" class="btn-primary" id="saveBtn" onclick="window.savePatient()">Save Patient</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h4>Patient Directory</h4>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="background: #FAFAFA; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                    <span class="material-symbols-rounded" style="font-size: 16px; color: var(--text-muted);">search</span>
                    <input type="text" placeholder="Search..." style="border: none; background: transparent; outline: none; font-size: 13px; width: 120px;">
                </div>
            </div>
        </div>
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Patient Name & ID</th>
                    <th>Mobile No.</th>
                    <th>Age/Gender</th>
                    <th>Address Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcO1L2Za7dzILxylmMkRTSx0FBVu_EEoM",
            authDomain: "cmf001stra.firebaseapp.com",
            projectId: "cmf001stra",
            storageBucket: "cmf001stra.firebasestorage.app",
            messagingSenderId: "763958641347",
            appId: "1:763958641347:web:316876bc2340b26bd21876",
            measurementId: "G-770FBR88LJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load existing patients
        window.loadPatients = async function() {
            const tableBody = document.getElementById('patientTableBody');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Loading patients from database...</td></tr>';

            try {
                const patientsRef = collection(db, "patients");
                const querySnapshot = await getDocs(patientsRef);
                
                tableBody.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-muted);">No patients found. Add one above!</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="Patient"><div class="patient-info"><strong>${data.name}</strong><span class="pid">${data.patientId}</span></div></td>
                        <td data-label="Mobile">${data.mobile}</td>
                        <td data-label="Demographics">${data.age || '--'} Yrs / ${data.gender || '--'}</td>
                        <td data-label="Address"><span style="color: var(--text-muted); font-size: 12px;">${data.address || '--'}</span></td>
                        <td data-label="Actions">
                            <span class="material-symbols-rounded" style="color: var(--primary); cursor: pointer; font-size: 20px;" title="View Notes">assignment</span>
                            <span class="material-symbols-rounded" style="color: var(--text-muted); cursor: pointer; font-size: 20px; margin-left: 8px;" title="Edit">edit</span>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                console.error("Firebase Read Error:", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--danger);">Error loading data.</td></tr>';
            }
        };

        window.loadPatients();

        // Verify mobile
        window.verifyMobile = async function() {
            const mobileInput = document.getElementById('mobileInput').value;
            const validationMsg = document.getElementById('mobileValidationMsg');
            const fieldset = document.getElementById('patientDetailsFieldset');
            const verifyBtn = document.getElementById('verifyBtn');
            
            validationMsg.className = 'validation-msg';

            if (mobileInput.length !== 10) {
                validationMsg.innerText = "Please enter a valid 10-digit mobile number.";
                validationMsg.classList.add('error');
                fieldset.disabled = true;
                return;
            }

            verifyBtn.innerText = "Checking...";
            verifyBtn.disabled = true;

            try {
                const patientsRef = collection(db, "patients");
                const q = query(patientsRef, where("mobile", "==", mobileInput));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    validationMsg.innerText = "Patient with this number already exists!";
                    validationMsg.classList.add('error');
                    fieldset.disabled = true;
                } else {
                    validationMsg.innerText = "Number is available. Please fill out the details.";
                    validationMsg.classList.add('success');
                    fieldset.disabled = false;
                    document.getElementById('patientName').focus();
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                validationMsg.innerText = "Error checking database.";
                validationMsg.classList.add('error');
            }

            verifyBtn.innerText = "Verify";
            verifyBtn.disabled = false;
        }

        // Save patient
        window.savePatient = async function() {
            const saveBtn = document.getElementById('saveBtn');
            
            const mobile = document.getElementById('mobileInput').value;
            const name = document.getElementById('patientName').value;
            const age = document.getElementById('patientAge').value;
            const gender = document.getElementById('patientGender').value;
            const address = document.getElementById('patientAddress').value;
            const notes = document.getElementById('patientNotes').value;

            if (!name || !mobile) {
                alert("Patient Name and Mobile Number are required!");
                return;
            }

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                const generatedId = "P" + Math.floor(Math.random() * 90000 + 10000);

                await addDoc(collection(db, "patients"), {
                    patientId: generatedId,
                    mobile: mobile,
                    name: name,
                    age: age,
                    gender: gender,
                    address: address,
                    notes: notes,
                    createdAt: new Date()
                });

                alert(`Success! Patient saved with ID: ${generatedId}`);
                document.getElementById('add-patient-form').reset();
                window.resetForm();
                window.loadPatients();

            } catch (error) {
                console.error("Firebase Save Error:", error);
                alert("Failed to save patient.");
            }

            saveBtn.innerText = "Save Patient";
            saveBtn.disabled = false;
        }

        window.resetForm = function() {
            document.getElementById('mobileValidationMsg').className = 'validation-msg';
            document.getElementById('patientDetailsFieldset').disabled = true;
        }
    </script>

</div> </body>
</html>
