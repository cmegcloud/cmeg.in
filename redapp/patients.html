<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Patient Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <style>
        /* --- Core Theme Variables --- */
        :root {
            --primary: #CD5C48;
            --primary-light: #FCECE8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #222222;
            --text-muted: #777777;
            --border: #E8E5E1;
            --grey-light: #F4F4F4;
            --grey-med: #D9D9D9;
            --grey-dark: #666666;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            --success: #34A853;
            --danger: #EA4335;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 24px; display: flex; justify-content: center; }
        .module-container { width: 100%; max-width: 1120px; }

        /* --- UI Components --- */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        
        .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { .input-group { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1024px) { .input-group.three-cols { grid-template-columns: 1fr 1fr 1fr; } }

        .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        .form-input:focus { border-color: var(--primary); background: var(--surface); }
        .form-input:disabled { background: #F0F0F0; color: #999; cursor: not-allowed; }

        .readonly-input { background: transparent; border: 1px dashed transparent; padding-left: 0; font-weight: 700; color: var(--text-main); pointer-events: none; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.8; }
        .btn-primary:disabled { background: var(--grey-med); cursor: not-allowed; }
        
        .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-verify { background: var(--text-main); color: #fff; border: none; padding: 0 20px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 13px;}

        /* --- Validation Message --- */
        .validation-msg { font-size: 12px; font-weight: 500; margin-top: 6px; display: none; }
        .validation-msg.success { color: var(--success); display: block; }
        .validation-msg.error { color: var(--danger); display: block; }

        /* --- Table Styling --- */
        .table-container { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-header h4 { font-size: 16px; font-weight: 600; }
        .saas-table { width: 100%; border-collapse: collapse; text-align: left; }
        .saas-table th { padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); }
        .saas-table td { padding: 16px 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); }
        .saas-table tr:last-child td { border-bottom: none; }
        .patient-info { display: flex; flex-direction: column; }
        .patient-info .pid { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Mobile Table Fix */
        @media (max-width: 767px) {
            .saas-table thead { display: none; }
            .saas-table, .saas-table tbody, .saas-table tr, .saas-table td { display: block; width: 100%; }
            .saas-table tr { padding: 16px; border-bottom: 1px solid var(--border); }
            .saas-table td { padding: 4px 0; border: none; display: flex; justify-content: space-between; align-items: center; }
            .saas-table td::before { content: attr(data-label); font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
            .saas-table td:nth-child(1) { padding-bottom: 12px; }
            .saas-table td:nth-child(1)::before { display: none; }
            .saas-table td:nth-child(1) .patient-info { flex-direction: row; align-items: baseline; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="module-container" id="patient-module">
    
    <div class="section-title">
        <h2>Patient Management</h2>
    </div>

    <div class="form-card">
        <h4 style="color: var(--primary); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Register New Patient</h4>
        <form id="add-patient-form">
            
            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Patient ID</label>
                    <input type="text" class="form-input readonly-input" value="P0001" readonly tabindex="-1">
                </div>

                <div style="grid-column: span 2;">
                    <label class="form-label">Mobile Number (Search / Validate) *</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="mobileInput" class="form-input" placeholder="Enter 10-digit mobile number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required style="font-weight: 600; letter-spacing: 1px;">
                        <button type="button" class="btn-verify" onclick="verifyMobile()">Verify</button>
                    </div>
                    <div id="mobileValidationMsg" class="validation-msg"></div>
                </div>
            </div>

            <fieldset id="patientDetailsFieldset" style="border: none; padding: 0; margin: 0;" disabled>
                <div class="input-group three-cols">
                    <div style="grid-column: span 2;">
                        <label class="form-label">Patient Name *</label>
                        <input type="text" class="form-input" placeholder="Full Name" required>
                    </div>
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" class="form-input" placeholder="Years" min="1" max="120">
                    </div>
                </div>

                <div class="input-group">
                    <div>
                        <label class="form-label">Gender</label>
                        <select class="form-input">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label class="form-label">Address</label>
                        <textarea class="form-input" rows="2" placeholder="Full residential address..."></textarea>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label class="form-label">Notes / Medical History</label>
                        <textarea class="form-input" rows="3" placeholder="Any specific notes or initial observations..."></textarea>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 16px;">
                    <button type="reset" class="btn-outline" style="margin-right: 12px;" onclick="resetForm()">Clear Form</button>
                    <button type="button" class="btn-primary" onclick="savePatient()">Save Patient</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h4>Patient Directory</h4>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="background: #FAFAFA; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                    <span class="material-symbols-rounded" style="font-size: 16px; color: var(--text-muted);">search</span>
                    <input type="text" placeholder="Search..." style="border: none; background: transparent; outline: none; font-size: 13px; width: 100px;">
                </div>
            </div>
        </div>
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Patient Name & ID</th>
                    <th>Mobile No.</th>
                    <th>Age/Gender</th>
                    <th>Address Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="Patient"><div class="patient-info"><strong>Sarah Jenkins</strong><span class="pid">P0002</span></div></td>
                    <td data-label="Mobile">9876543210</td>
                    <td data-label="Demographics">34 Yrs / F</td>
                    <td data-label="Address"><span style="color: var(--text-muted); font-size: 12px;">Mahe Clinic Area, Kerala</span></td>
                    <td data-label="Actions">
                        <span class="material-symbols-rounded" style="color: var(--primary); cursor: pointer; font-size: 20px;" title="View Notes">assignment</span>
                        <span class="material-symbols-rounded" style="color: var(--text-muted); cursor: pointer; font-size: 20px; margin-left: 8px;" title="Edit">edit</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // --- Mobile Verification Logic ---
    function verifyMobile() {
        const mobileInput = document.getElementById('mobileInput');
        const validationMsg = document.getElementById('mobileValidationMsg');
        const fieldset = document.getElementById('patientDetailsFieldset');
        
        // Remove previous validation classes
        validationMsg.className = 'validation-msg';

        if (mobileInput.value.length !== 10) {
            validationMsg.innerText = "Please enter a valid 10-digit mobile number.";
            validationMsg.classList.add('error');
            fieldset.disabled = true;
            return;
        }

        // Simulating checking a database for duplication
        // For testing, let's pretend "9999999999" is an existing patient
        if (mobileInput.value === "9999999999") {
            validationMsg.innerText = "Patient with this number already exists in the system!";
            validationMsg.classList.add('error');
            fieldset.disabled = true;
        } else {
            validationMsg.innerText = "Number is available. Please fill out the patient details.";
            validationMsg.classList.add('success');
            fieldset.disabled = false; // Enables the rest of the form
        }
    }

    function resetForm() {
        document.getElementById('mobileValidationMsg').className = 'validation-msg';
        document.getElementById('patientDetailsFieldset').disabled = true;
    }

    function savePatient() {
        alert('Patient P0001 saved successfully!');
        // Here you would clear the form, increment the Patient ID, and update the table
        document.getElementById('add-patient-form').reset();
        resetForm();
    }
</script>

</body>
</html>
