<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Appointments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="appointment-module">
    
    <style>
        :root {
            --primary: #e16349;
            --primary-light: #fef5e8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #0a0a0a;
            --text-muted: #777777;
            --border: #E8E5E1;
            --grey-med: #D9D9D9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            --success: #10B981;
            --danger: #FB923C;
            --secondary: #64748B;
        }

        #appointment-module { font-family: 'Inter', sans-serif; width: 100%; max-width: 1120px;}
        #appointment-module .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        #appointment-module .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        #appointment-module .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        #appointment-module .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { #appointment-module .input-group { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1024px) { #appointment-module .input-group.three-cols { grid-template-columns: 1fr 1fr 1fr; } }

        #appointment-module .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        #appointment-module .form-input:focus { border-color: var(--primary); background: var(--surface); }
        
        #appointment-module .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        #appointment-module .btn-primary:disabled { background: var(--grey-med); cursor: not-allowed; }
        #appointment-module .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        /* Table Styles */
        #appointment-module .table-container { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        #appointment-module .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #appointment-module .table-header h4 { font-size: 16px; font-weight: 600; margin: 0; }
        #appointment-module .saas-table { width: 100%; border-collapse: collapse; text-align: left; }
        #appointment-module .saas-table th { padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); }
        #appointment-module .saas-table td { padding: 16px 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; }
        .badge-pending { background: rgba(251, 146, 60, 0.1); color: var(--danger); }
        .badge-completed { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-rescheduled { background: rgba(100, 116, 139, 0.1); color: var(--secondary); }

        /* Conditional Reschedule Field */
        #reschedule-container { display: none; }
        #reschedule-container.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 767px) {
            #appointment-module .saas-table thead { display: none; }
            #appointment-module .saas-table, #appointment-module .saas-table tbody, #appointment-module .saas-table tr, #appointment-module .saas-table td { display: block; width: 100%; }
            #appointment-module .saas-table tr { padding: 16px; border-bottom: 1px solid var(--border); }
            #appointment-module .saas-table td { padding: 4px 0; border: none; display: flex; justify-content: space-between; align-items: center; }
            #appointment-module .saas-table td::before { content: attr(data-label); font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        }
    </style>

    <div class="section-title">
        <h2 style="margin: 0;">Appointments</h2>
    </div>

    <div class="form-card">
        <form id="add-appointment-form" onsubmit="event.preventDefault();">
            
            <h4 style="color: var(--primary); margin: 0 0 16px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">1. Patient & Booking Details</h4>
            
            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Patient Mobile *</label>
                    <input type="tel" id="aptMobile" class="form-input" placeholder="10-digit number" maxlength="10" required>
                </div>
                <div style="grid-column: span 2;">
                    <label class="form-label">Patient Name *</label>
                    <input type="text" id="aptName" class="form-input" placeholder="Full Name" required>
                </div>
            </div>

            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Branch *</label>
                    <select id="aptBranch" class="form-input" required>
                        <option value="">Select Branch</option>
                        <option value="Mahe">Mahe</option>
                        <option value="Chokli">Chokli</option>
                        <option value="Panoor">Panoor</option>
                        <option value="Koothuparamba">Koothuparamba</option>
                        <option value="Nadapuram">Nadapuram</option>
                        <option value="Home Care">Home Care</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Preferred Date *</label>
                    <input type="date" id="aptDate" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Preferred Time *</label>
                    <input type="time" id="aptTime" class="form-input" required>
                </div>
            </div>

            <h4 style="color: var(--primary); margin: 24px 0 16px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">2. Administration Processing</h4>

            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Therapist Assigned *</label>
                    <input type="text" id="aptTherapist" class="form-input" placeholder="e.g. Dr. Anjali V." required>
                </div>
                <div>
                    <label class="form-label">Appointment Status *</label>
                    <select id="aptStatus" class="form-input" onchange="window.toggleReschedule(this)" required>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                        <option value="Rescheduled">Rescheduled</option>
                    </select>
                </div>
                <div id="reschedule-container">
                    <label class="form-label" style="color: var(--danger);">Rescheduled Date</label>
                    <input type="date" id="aptRescheduleDate" class="form-input" style="border-color: var(--danger);">
                </div>
            </div>

            <div class="input-group three-cols" style="background: var(--bg); padding: 16px; border-radius: 12px; margin-top: 8px;">
                <div>
                    <label class="form-label">Total Fee (₹)</label>
                    <input type="number" id="aptFee" class="form-input" placeholder="0.00" oninput="window.calcBalance()">
                </div>
                <div>
                    <label class="form-label">Advance Paid (₹)</label>
                    <input type="number" id="aptAdvance" class="form-input" placeholder="0.00" oninput="window.calcBalance()">
                </div>
                <div>
                    <label class="form-label">Balance Pending (₹)</label>
                    <input type="number" id="aptBalance" class="form-input" placeholder="0.00" readonly style="font-weight: 700; color: var(--danger); background: transparent; border: none; padding-left: 0;">
                </div>
            </div>

            <div style="text-align: right; margin-top: 24px;">
                <button type="reset" class="btn-outline" style="margin-right: 12px;" onclick="window.resetAptForm()">Clear Form</button>
                <button type="button" class="btn-primary" id="saveAptBtn" onclick="window.saveAppointment()">Save Appointment</button>
            </div>
        </form>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h4>Schedule Directory</h4>
            <div style="background: #FAFAFA; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center;">
                <span class="material-symbols-rounded" style="font-size: 16px; color: var(--text-muted);">search</span>
                <input type="text" placeholder="Search..." style="border: none; background: transparent; outline: none; font-size: 13px; width: 120px; margin-left: 6px;">
            </div>
        </div>
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Patient</th>
                    <th>Branch / Therapist</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="aptTableBody">
                </tbody>
        </table>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 🔴 REPLACE THIS WITH YOUR BRAND NEW FIREBASE CONFIG 🔴
    const firebaseConfig = {
        apiKey: "YOUR_NEW_API_KEY",
        authDomain: "your-new-project.firebaseapp.com",
        projectId: "your-new-project",
        storageBucket: "your-new-project.firebasestorage.app",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:abcdef123456",
        measurementId: "G-NEW12345"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- UI Logic ---
    window.toggleReschedule = function(select) {
        const container = document.getElementById('reschedule-container');
        if (select.value === 'Rescheduled') {
            container.classList.add('active');
        } else {
            container.classList.remove('active');
            document.getElementById('aptRescheduleDate').value = '';
        }
    }

    window.calcBalance = function() {
        const fee = parseFloat(document.getElementById('aptFee').value) || 0;
        const advance = parseFloat(document.getElementById('aptAdvance').value) || 0;
        document.getElementById('aptBalance').value = (fee - advance).toFixed(2);
    }

    window.resetAptForm = function() {
        document.getElementById('reschedule-container').classList.remove('active');
    }

    // --- Firebase Logic ---
    window.loadAppointments = async function() {
        const tableBody = document.getElementById('aptTableBody');
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Loading appointments...</td></tr>';

        try {
            const aptRef = collection(db, "appointments");
            const q = query(aptRef, orderBy("date", "desc"));
            const querySnapshot = await getDocs(q);
            
            tableBody.innerHTML = ''; 
            
            if (querySnapshot.empty) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--text-muted);">No appointments booked yet.</td></tr>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                
                let statusBadge = '';
                if(data.status === 'Completed') statusBadge = '<span class="badge badge-completed">Completed</span>';
                else if(data.status === 'Rescheduled') statusBadge = `<span class="badge badge-rescheduled">Rescheduled (${data.rescheduleDate})</span>`;
                else statusBadge = '<span class="badge badge-pending">Pending</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="Date/Time"><strong>${data.date}</strong><br><span style="font-size:12px; color:var(--text-muted);">${data.time}</span></td>
                    <td data-label="Patient"><strong>${data.name}</strong><br><span style="font-size:12px; color:var(--text-muted);">${data.mobile}</span></td>
                    <td data-label="Details">${data.branch}<br><span style="font-size:12px; color:var(--text-muted);">${data.therapist}</span></td>
                    <td data-label="Status">${statusBadge}</td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (error) {
            console.error("Firebase Read Error:", error);
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--danger);">Error loading data. Check Firestore rules.</td></tr>';
        }
    };

    // Load instantly on opening module
    window.loadAppointments();

    window.saveAppointment = async function() {
        const saveBtn = document.getElementById('saveAptBtn');
        
        const mobile = document.getElementById('aptMobile').value;
        const name = document.getElementById('aptName').value;
        const branch = document.getElementById('aptBranch').value;
        const date = document.getElementById('aptDate').value;
        const time = document.getElementById('aptTime').value;
        const therapist = document.getElementById('aptTherapist').value;
        const status = document.getElementById('aptStatus').value;
        const rescheduleDate = document.getElementById('aptRescheduleDate').value;
        const fee = document.getElementById('aptFee').value;
        const advance = document.getElementById('aptAdvance').value;
        const balance = document.getElementById('aptBalance').value;

        if (!name || !mobile || !date || !branch) {
            alert("Please fill all required (*) fields!");
            return;
        }

        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        try {
            await addDoc(collection(db, "appointments"), {
                mobile: mobile,
                name: name,
                branch: branch,
                date: date,
                time: time,
                therapist: therapist,
                status: status,
                rescheduleDate: status === 'Rescheduled' ? rescheduleDate : '',
                fee: fee,
                advance: advance,
                balance: balance,
                createdAt: new Date()
            });

            alert(`Appointment saved successfully!`);
            document.getElementById('add-appointment-form').reset();
            window.resetAptForm();
            window.loadAppointments();

        } catch (error) {
            console.error("Firebase Save Error:", error);
            alert("Failed to save appointment. Check your database.");
        }

        saveBtn.innerText = "Save Appointment";
        saveBtn.disabled = false;
    }
</script>

</body>
</html>
