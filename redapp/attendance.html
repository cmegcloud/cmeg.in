<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CMBooks - Attendance Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <style>
        /* --- Core Theme Variables --- */
        :root {
            --primary: #e16349;
            --primary-light: #fef5e8;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #222222;
            --text-muted: #777777;
            --border: #E8E5E1;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            
            /* Attendance Colors */
            --present: #34A853;
            --present-bg: #E6F4EA;
            --absent: #EA4335;
            --absent-bg: #FCE8E6;
            --leave: #FBBC05;
            --leave-bg: #FEF7E0;
            --holiday: #9AA0A6;
            --holiday-bg: #F1F3F4;
            --locked: #F9F9F9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 24px; display: flex; justify-content: center; }
        .module-container { width: 100%; max-width: 1200px; position: relative; }

        /* --- UI Components --- */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        
        .form-card { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .form-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        .form-input:focus { border-color: var(--primary); background: var(--surface); }

        .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-outline:hover { background: #FAFAFA; border-color: #DDD; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-primary:active { opacity: 0.8; }
        .btn-primary:disabled { background: var(--grey-med); cursor: not-allowed; }

        /* --- Table Styling & Sticky Left Column --- */
        .table-container { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; }
        .table-header h4 { font-size: 15px; font-weight: 700; margin: 0; color: var(--primary); }
        
        .table-scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        .month-table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; }
        .month-table th { padding: 12px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); min-width: 44px; }
        .month-table td { padding: 8px 4px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); transition: 0.2s; }
        
        /* Sticky First Column */
        .month-table th:first-child, .month-table td:first-child { 
            position: sticky; left: 0; z-index: 2; background: #FAFAFA; text-align: left; min-width: 260px; padding: 12px 16px; box-shadow: 2px 0 5px rgba(0,0,0,0.04); border-right: 2px solid var(--border);
        }
        .month-table td:first-child { background: #FFFFFF; }
        .month-table tr:hover td:first-child { background: #FDFDFD; }

        /* --- Employee Inline Top Summaries --- */
        .emp-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .emp-role { font-size: 10px; color: var(--text-muted); font-weight: 500; display: block; margin-top: 2px; margin-bottom: 8px; }
        .emp-stats { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .stat-badge { padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; border: 1px solid var(--border); background: #FAFAFA; display: inline-flex; align-items: center; gap: 4px;}
        .stat-badge.today { background: var(--primary-light); color: var(--primary); border-color: var(--primary-light); }

        /* --- Cell Status & Lock UI --- */
        .cell-p { background: var(--present-bg) !important; color: var(--present) !important; }
        .cell-a { background: var(--absent-bg) !important; color: var(--absent) !important; }
        .cell-l { background: var(--leave-bg) !important; color: var(--leave) !important; }
        .cell-h { background: var(--holiday-bg) !important; color: var(--holiday) !important; }
        
        /* Highlight Today's Column */
        .col-today { background: var(--primary-light) !important; color: var(--primary) !important; border-bottom: 2px solid var(--primary) !important; }
        .editable-today { cursor: pointer; box-shadow: inset 0 0 0 2px var(--primary); }
        
        /* Locked Past Days */
        .locked-cell { cursor: pointer; position: relative; opacity: 0.8; }
        .locked-cell::after { content: 'lock'; font-family: 'Material Symbols Rounded'; font-size: 10px; position: absolute; top: 2px; right: 2px; color: rgba(0,0,0,0.2); }
        .unlocked-cell { cursor: pointer; box-shadow: inset 0 0 0 2px var(--leave); opacity: 1; }
        .future-cell { background: #F4F4F4 !important; color: #CCC !important; pointer-events: none; }

        /* --- Modal Popup Styling --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-card { background: var(--surface); width: 100%; max-width: 360px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; display: flex; align-items: center; gap: 8px;}
        .modal-body { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }

        /* --- Print & PDF Export Rules --- */
        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .form-card { display: none !important; }
            .table-container { border: none; box-shadow: none; margin: 0; padding: 0; }
            .table-scroll-wrapper { overflow: visible !important; width: 100%; }
            .month-table th:first-child, .month-table td:first-child { position: static; box-shadow: none; }
            .locked-cell::after { display: none; }
            .month-table { min-width: auto; width: 100%; font-size: 10pt; }
            .emp-stats { display: none; }
            .emp-role { margin-bottom: 0; }
        }

    </style>

    <div class="section-title">
        <h2>Attendance Tracker</h2>
        <div class="no-print" style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-outline" onclick="window.exportCSV()">
                <span class="material-symbols-rounded" style="font-size: 18px; color: #34A853;">description</span> Export CSV
            </button>
            <button class="btn-outline" onclick="window.exportPDF()">
                <span class="material-symbols-rounded" style="font-size: 18px; color: var(--danger);">picture_as_pdf</span> Export PDF
            </button>
            <button class="btn-primary" id="saveBtn" onclick="window.saveAttendance()">
                <span class="material-symbols-rounded" style="font-size: 18px;">cloud_sync</span> Save Updates
            </button>
        </div>
    </div>

    <div class="form-card no-print">
        <div class="input-group">
            <div>
                <label class="form-label">Select Month</label>
                <input type="month" id="monthFilter" class="form-input" onchange="window.loadAttendanceData()">
            </div>
            <div>
                <label class="form-label">Employee Type</label>
                <select id="typeFilter" class="form-input" onchange="window.renderTable()">
                    <option value="All">All (Staff & Therapists)</option>
                    <option value="Therapist">Therapist Only</option>
                    <option value="Staff">Staff Only</option>
                </select>
            </div>
            <div>
                <label class="form-label">Branch Filter</label>
                <select id="branchFilter" class="form-input" onchange="window.renderTable()">
                    <option value="All">All Branches</option>
                    </select>
            </div>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h4 id="registerTitle">Loading Register...</h4>
            <span class="no-print" style="font-size: 12px; color: var(--text-muted); font-weight: 500;">
                <span class="material-symbols-rounded" style="font-size: 14px; vertical-align: middle;">lock</span> Past days locked
            </span>
        </div>
        
        <div class="table-scroll-wrapper">
            <table class="month-table" id="attendanceTable">
                <thead>
                    </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="unlockModal">
    <div class="modal-card">
        <div class="modal-title">
            <span class="material-symbols-rounded" style="color: #FBBC05;">lock_open</span> Unlock Record?
        </div>
        <div class="modal-body">
            You are attempting to modify a saved attendance record for <strong id="modalDateTarget"></strong>. Do you want to unlock this day for editing?
        </div>
        <div class="modal-actions">
            <button class="btn-outline" onclick="window.closeModal()">Cancel</button>
            <button class="btn-primary" style="background: #FBBC05; color: #222;" onclick="window.confirmUnlock()">Unlock & Edit</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // CMF001STRA Config
    const firebaseConfig = {
        apiKey: "AIzaSyAcO1L2Za7dzILxylmMkRTSx0FBVu_EEoM",
        authDomain: "cmf001stra.firebaseapp.com",
        projectId: "cmf001stra",
        storageBucket: "cmf001stra.firebasestorage.app",
        messagingSenderId: "763958641347",
        appId: "1:763958641347:web:316876bc2340b26bd21876",
        measurementId: "G-770FBR88LJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- State Variables ---
    let employees = [];
    let attendanceData = {};
    let targetLockedCell = null;

    // Current Exact Date Engine
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1; // 1-12
    const currentDay = now.getDate();

    // Init Logic
    async function init() {
        const y = currentYear;
        const m = String(currentMonth).padStart(2, '0');
        document.getElementById('monthFilter').value = `${y}-${m}`;

        await loadBranches();
        await loadEmployees();
        await window.loadAttendanceData();
    }

    async function loadBranches() {
        const branchSelect = document.getElementById('branchFilter');
        try {
            const snap = await getDocs(query(collection(db, "branches"), orderBy("name")));
            branchSelect.innerHTML = '<option value="All">All Branches</option>';
            snap.forEach(doc => {
                const name = doc.data().name;
                branchSelect.innerHTML += `<option value="${name}">${name}</option>`;
            });
        } catch(e) { console.error(e); }
    }

    async function loadEmployees() {
        try {
            employees = [];
            const tSnap = await getDocs(collection(db, "therapists"));
            tSnap.forEach(doc => employees.push({ id: doc.id, type: 'Therapist', ...doc.data() }));

            const sSnap = await getDocs(collection(db, "staff"));
            sSnap.forEach(doc => employees.push({ id: doc.id, type: 'Staff', ...doc.data() }));
        } catch(e) { console.error(e); }
    }

    // --- Data Rendering ---
    window.loadAttendanceData = async function() {
        const monthInput = document.getElementById('monthFilter').value;
        if(!monthInput) return;
        
        document.querySelector('#attendanceTable tbody').innerHTML = `<tr><td style="padding:20px; text-align:center;">Syncing from Firebase...</td></tr>`;

        try {
            const q = query(collection(db, "attendance"), where("month", "==", monthInput));
            const snap = await getDocs(q);
            
            attendanceData = {};
            snap.forEach(doc => {
                const data = doc.data();
                attendanceData[data.empId] = data.days || {};
                attendanceData[data.empId]._docId = doc.id; // Store to update later
            });

            window.renderTable();
        } catch(e) { console.error(e); }
    }

    window.renderTable = function() {
        const monthInput = document.getElementById('monthFilter').value;
        const [year, month] = monthInput.split('-');
        const daysInMonth = new Date(year, month, 0).getDate();

        // Update Title
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('registerTitle').innerText = `${monthNames[parseInt(month)-1]} ${year} Register`;

        // Thead
        let theadHtml = '<tr><th>Employee Overview</th>';
        for(let d = 1; d <= daysInMonth; d++) {
            let isToday = (year == currentYear && month == currentMonth && d == currentDay);
            theadHtml += `<th class="${isToday ? 'col-today' : ''}">${d}${isToday ? '<br><span style="font-size:8px;">(Today)</span>' : ''}</th>`;
        }
        theadHtml += '</tr>';
        document.querySelector('#attendanceTable thead').innerHTML = theadHtml;

        // Tbody
        const typeFilter = document.getElementById('typeFilter').value;
        const branchFilter = document.getElementById('branchFilter').value;

        if(employees.length === 0) {
            document.querySelector('#attendanceTable tbody').innerHTML = `<tr><td colspan="${daysInMonth + 1}" style="text-align:center; padding:20px;">No employees found. Add Staff or Therapists first!</td></tr>`;
            return;
        }

        let tbodyHtml = '';
        let visibleCount = 0;

        employees.forEach(emp => {
            if(typeFilter !== 'All' && emp.type !== typeFilter) return;
            if(branchFilter !== 'All' && emp.branch !== branchFilter) return;

            visibleCount++;
            const empAtt = attendanceData[emp.id] || {};
            
            let totalP = 0, totalL = 0;
            Object.keys(empAtt).forEach(key => {
                if(key !== '_docId') {
                    if(empAtt[key] === 'P') totalP++;
                    if(empAtt[key] === 'L') totalL++;
                }
            });

            let todayStatus = empAtt[currentDay] || '-';

            let rowHtml = `<tr>
                <td>
                    <div class="emp-name">${emp.name || 'Unknown'}</div>
                    <div class="emp-role">${emp.type} • ${emp.branch || 'N/A'}</div>
                    <div class="emp-stats">
                        <span class="stat-badge" id="tot-p-${emp.id}">Total P: ${totalP}</span>
                        <span class="stat-badge" id="tot-l-${emp.id}">Total L: ${totalL}</span>
                        ${(year == currentYear && month == currentMonth) ? `<span class="stat-badge today" id="today-status-${emp.id}">Today: ${todayStatus}</span>` : ''}
                    </div>
                </td>`;

            for(let d = 1; d <= daysInMonth; d++) {
                let status = empAtt[d] || '-';
                let cellClass = 'day-cell';
                if(status==='P') cellClass += ' cell-p';
                if(status==='A') cellClass += ' cell-a';
                if(status==='L') cellClass += ' cell-l';
                if(status==='H') cellClass += ' cell-h';

                // Safety lock logic
                let lockClass = '';
                if (year < currentYear || (year == currentYear && month < currentMonth) || (year == currentYear && month == currentMonth && d < currentDay)) {
                    lockClass = 'locked-cell';
                } else if (year == currentYear && month == currentMonth && d == currentDay) {
                    lockClass = 'editable-today';
                } else {
                    lockClass = 'future-cell';
                }

                rowHtml += `<td class="${cellClass} ${lockClass}" data-emp="${emp.id}" data-date="${d}" data-month="${monthInput}">${status}</td>`;
            }
            rowHtml += `</tr>`;
            tbodyHtml += rowHtml;
        });

        if(visibleCount === 0) {
            tbodyHtml = `<tr><td colspan="${daysInMonth + 1}" style="text-align:center; padding:20px;">No employees match your filters.</td></tr>`;
        }

        document.querySelector('#attendanceTable tbody').innerHTML = tbodyHtml;
        attachCellListeners();
    }

    // --- Interactive Cell Engine ---
    function attachCellListeners() {
        document.querySelectorAll('.day-cell').forEach(cell => {
            if(cell.classList.contains('locked-cell')) {
                cell.addEventListener('click', function() {
                    if(this.classList.contains('unlocked-cell')) {
                        window.toggleStatus(this);
                    } else {
                        targetLockedCell = this;
                        document.getElementById('modalDateTarget').innerText = `${this.getAttribute('data-date')} / ${this.getAttribute('data-month')}`;
                        document.getElementById('unlockModal').style.display = 'flex';
                    }
                });
            } else if(cell.classList.contains('editable-today')) {
                cell.addEventListener('click', function() { window.toggleStatus(this); });
            }
        });
    }

    window.toggleStatus = function(cell) {
        const states = ['-', 'P', 'A', 'L', 'H'];
        const current = cell.innerText.trim();
        let nextIndex = states.indexOf(current) + 1;
        if(nextIndex >= states.length) nextIndex = 0;
        const next = states[nextIndex];

        cell.innerText = next;
        cell.className = cell.className.replace(/cell-[palh]/g, '').trim();
        if(next !== '-') cell.classList.add('cell-' + next.toLowerCase());

        const empId = cell.getAttribute('data-emp');
        const date = cell.getAttribute('data-date');
        
        if(!attendanceData[empId]) attendanceData[empId] = {};
        attendanceData[empId][date] = next;

        window.updateEmployeeStats(empId);
    }

    window.updateEmployeeStats = function(empId) {
        let totalP = 0, totalL = 0;
        let att = attendanceData[empId] || {};
        
        Object.keys(att).forEach(k => {
            if(k !== '_docId') {
                if(att[k] === 'P') totalP++;
                if(att[k] === 'L') totalL++;
            }
        });
        
        const pBadge = document.getElementById(`tot-p-${empId}`);
        const lBadge = document.getElementById(`tot-l-${empId}`);
        if(pBadge) pBadge.innerText = `Total P: ${totalP}`;
        if(lBadge) lBadge.innerText = `Total L: ${totalL}`;

        const monthInput = document.getElementById('monthFilter').value;
        const [year, month] = monthInput.split('-');
        if(year == currentYear && month == currentMonth) {
            let todayStatus = att[currentDay] || '-';
            const todayBadge = document.getElementById(`today-status-${empId}`);
            if(todayBadge) todayBadge.innerText = `Today: ${todayStatus}`;
        }
    }

    // --- Modal Controls ---
    window.closeModal = function() {
        document.getElementById('unlockModal').style.display = 'none';
        targetLockedCell = null;
    }

    window.confirmUnlock = function() {
        if (targetLockedCell) {
            targetLockedCell.classList.remove('locked-cell');
            targetLockedCell.classList.add('unlocked-cell');
            window.toggleStatus(targetLockedCell);
        }
        window.closeModal();
    }

    // --- Database Save Engine ---
    window.saveAttendance = async function() {
        const btn = document.getElementById('saveBtn');
        btn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 18px;">cloud_sync</span> Saving...';
        btn.disabled = true;

        const monthInput = document.getElementById('monthFilter').value;

        try {
            for(let empId in attendanceData) {
                let data = attendanceData[empId];
                let docId = data._docId;
                let days = { ...data };
                delete days._docId; // remove internal key

                if(Object.keys(days).length === 0) continue; // Skip if totally empty

                if(docId) {
                    await updateDoc(doc(db, "attendance", docId), { days: days, updatedAt: new Date() });
                } else {
                    let newDoc = await addDoc(collection(db, "attendance"), {
                        empId: empId,
                        month: monthInput,
                        days: days,
                        updatedAt: new Date()
                    });
                    attendanceData[empId]._docId = newDoc.id; // cache new ID
                }
            }
            alert('Attendance securely synced to Firebase!');
        } catch(e) {
            console.error(e);
            alert('Failed to sync data to database.');
        }

        btn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 18px;">cloud_sync</span> Save Updates';
        btn.disabled = false;
    }

    // --- File Export Actions ---
    window.exportCSV = function() {
        const table = document.getElementById("attendanceTable");
        let csvData = [];
        
        for (let i = 0; i < table.rows.length; i++) {
            let rowData = [];
            let cols = table.rows[i].querySelectorAll("td, th");
            
            for (let j = 0; j < cols.length; j++) {
                let text = "";
                if(j === 0 && i > 0) {
                    // Extract clean name and role without the status badges
                    let nameNode = cols[j].querySelector('.emp-name');
                    let roleNode = cols[j].querySelector('.emp-role');
                    if(nameNode) text = `${nameNode.innerText} (${roleNode.innerText})`;
                } else {
                    text = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").replace('(Today)', '').trim();
                }
                rowData.push('"' + text + '"');
            }
            csvData.push(rowData.join(","));
        }
        
        let csvContent = "data:text/csv;charset=utf-8," + csvData.join("\n");
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Attendance_${document.getElementById('monthFilter').value}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    window.exportPDF = function() {
        window.print();
    }

    // Ignite the module
    init();

</script>

</body>
</html>
