<header class="top-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #E8E5E1; position: sticky; top: 0; z-index: 100;">
    
    <button class="icon-action toggle-sidebar" onclick="toggleSidebar()" style="background: none; border: none; color: #222222; cursor: pointer; display: none;">
        <span class="material-symbols-rounded" style="font-size: 28px;">menu</span>
    </button>

    <div class="header-actions" style="display: flex; align-items: center; gap: 20px; margin-left: auto;">
        
        <button class="icon-action" title="Search" style="background: none; border: none; color: #777; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <span class="material-symbols-rounded" style="font-size: 24px;">search</span>
        </button>

        <div class="notification-wrapper" style="position: relative; cursor: pointer;">
            <span class="material-symbols-rounded" style="color: #777; font-size: 24px;">notifications</span>
            <span style="position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: #EA4335; border-radius: 50%; border: 2px solid #FFF;"></span>
        </div>

        <div class="profile-menu" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding-left: 20px; border-left: 1px solid #E8E5E1;">
            <div style="text-align: right; display: none;" class="desktop-profile-text">
                <div style="font-size: 13px; font-weight: 700; color: #222;">Admin User</div>
                <div style="font-size: 11px; color: #777;">STRA CARE</div>
            </div>
            <div style="width: 36px; height: 36px; background: #FCECE8; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #CD5C48; font-weight: 700; font-size: 14px;">
                A
            </div>
        </div>
        
    </div>
</header>
