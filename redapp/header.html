<header class="top-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #E8E5E1; position: sticky; top: 0; z-index: 100;">
    
    <div style="display: flex; align-items: center; gap: 16px;">
        <button class="icon-action toggle-sidebar" onclick="toggleSidebar()" style="background: none; border: none; color: #0a0a0a; cursor: pointer; display: none;">
            <span class="material-symbols-rounded" style="font-size: 28px;">menu</span>
        </button>
        <div id="live-clock" style="color: #777777; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; background: #F8F5F1; padding: 6px 12px; border-radius: 8px;">
            --:--
        </div>
    </div>

    <div class="header-actions" style="display: flex; align-items: center; gap: 16px; margin-left: auto;">
        
        <div class="search-bar" style="width: 192px; background: #FAFAFA; border: 1px solid #E8E5E1; border-radius: 8px; display: flex; align-items: center; padding: 8px 12px;">
            <span class="material-symbols-rounded" style="font-size: 18px; color: #777777;">search</span>
            <input type="text" placeholder="Search..." style="border: none; background: transparent; outline: none; width: 100%; font-size: 13px; margin-left: 8px; color: #0a0a0a;">
        </div>

        <div class="notification-wrapper" style="position: relative; cursor: pointer; display: flex; align-items: center;">
            <span class="material-symbols-rounded" style="color: #777777; font-size: 24px;">notifications</span>
            <span style="position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: #e16349; border-radius: 50%; border: 2px solid #FFF;"></span>
        </div>

        <div class="profile-menu" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding-left: 16px; border-left: 1px solid #E8E5E1;">
            <div style="width: 36px; height: 36px; background: #fef5e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #e16349; font-weight: 700; font-size: 14px;">
                A
            </div>
        </div>
        
    </div>
</header>
