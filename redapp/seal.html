<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRA CARE Official Seal</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#ffffff;
        font-family:"Times New Roman", serif;
    }

    /* OFFICIAL SEAL SIZE - 2.5" × 1" */
    .seal-box{
        width:63.5mm;
        height:25.4mm;
        border:2px solid #008C95;
        border-radius:4px;
        background:#ffffff;
        color:#008C95;
        position:relative;
        overflow:hidden;
    }

    /* COMPANY NAME */
    .seal-name{
        text-align:center;
        font-size:20px;
        font-weight:900;
        letter-spacing:1.8px;
        text-transform:uppercase;
        margin-top:2.5mm;
        line-height:1;
    }

    /* SIGNATURE SPACE */
    .signature-line{
        position:absolute;
        left:5mm;
        right:5mm;
        bottom:8mm;
        border-top:1.5px solid #008C95;
    }

    /* DESIGNATION */
    .seal-role{
        position:absolute;
        right:5mm;
        bottom:2.5mm;
        font-size:9px;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:0.8px;
        color:#008C95;
    }

    @media print{
        body{
            margin:0;
            padding:0;
        }

        .seal-box{
            -webkit-print-color-adjust:exact;
            print-color-adjust:exact;
        }
    }
</style>
</head>
<body>

    <div class="seal-box">

        <div class="seal-name">
            FOR STRA CARE
        </div>

        <!-- Signature Area -->
        <div class="signature-line"></div>

        <div class="seal-role">
            Managing Partner
        </div>

    </div>

</body>
</html>
