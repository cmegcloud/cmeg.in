<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Company Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <style>
        /* --- Core Theme Variables --- */
        :root {
            --primary: #CD5C48;
            --bg: #F8F5F1;
            --surface: #ffffff;
            --text-main: #222222;
            --text-muted: #777777;
            --border: #E8E5E1;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 24px; display: flex; justify-content: center; }
        .module-container { width: 100%; max-width: 800px; } /* Slightly narrower for form focus */

        /* --- UI Components --- */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: var(--surface); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
        
        .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { .input-group { grid-template-columns: 1fr 1fr; } }

        .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        
        /* --- Read-Only vs Editable States --- */
        .readonly-input { background: transparent; border: 1px dashed transparent; padding-left: 0; font-weight: 600; color: var(--text-main); pointer-events: none; transition: all 0.3s ease; }
        .readonly-input.editable { background: #FAFAFA; border: 1px solid var(--border); padding-left: 16px; pointer-events: auto; font-weight: 500;}
        .readonly-input.editable:focus { border-color: var(--primary); background: var(--surface); }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.8; }
        .section-header { color: var(--primary); margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 14px; font-weight: 700; text-transform: uppercase;}
    </style>
</head>
<body>

<div class="module-container" id="company-module">
    
    <div class="section-title">
        <h2>Company Overview</h2>
        <button type="button" class="icon-btn" onclick="toggleEditMode()" title="Edit Details">
            <span class="material-symbols-rounded" style="font-size: 18px;">edit</span>
        </button>
    </div>

    <div class="form-card">
        <form id="company-overview-form">
            <div class="section-header" style="margin-top: 0;">General Information</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-input readonly-input" value="STRA CARE" readonly>
                </div>
                <div>
                    <label class="form-label">Tagline</label>
                    <input type="text" class="form-input readonly-input" value="Rebuild Your Health" readonly>
                </div>
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Address</label>
                    <textarea class="form-input readonly-input" rows="2" readonly placeholder="Enter full registered address..."></textarea>
                </div>
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Branches</label>
                    <input type="text" class="form-input readonly-input" value="Mahe | Chokli | Panoor | Koothuparamba | Nadapuram | Home Care" readonly>
                </div>
            </div>

            <div class="section-header">Contact Details</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Primary Contact No</label>
                    <input type="tel" class="form-input readonly-input" value="+91 97449 02555" readonly>
                </div>
                <div>
                    <label class="form-label">Secondary Contact No</label>
                    <input type="tel" class="form-input readonly-input" value="+91 90612 07871" readonly>
                </div>
                <div>
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input readonly-input" value="info@stracares.in" readonly>
                </div>
                <div>
                    <label class="form-label">Website</label>
                    <input type="text" class="form-input readonly-input" value="www.stracares.in" readonly>
                </div>
            </div>

            <div class="section-header">Bank Details</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Account Name</label>
                    <input type="text" class="form-input readonly-input" value="STRA CARE" readonly>
                </div>
                <div>
                    <label class="form-label">Account Number</label>
                    <input type="text" class="form-input readonly-input" value="50200120597389" readonly>
                </div>
                <div>
                    <label class="form-label">IFSC Code</label>
                    <input type="text" class="form-input readonly-input" value="HDFC0000465" readonly>
                </div>
                <div>
                    <label class="form-label">UPI / Mobile</label>
                    <input type="text" class="form-input readonly-input" value="9744902555@hdfc" readonly>
                </div>
            </div>

            <div id="save-actions" style="display: none; margin-top: 32px; text-align: right;">
                <button type="button" class="btn-primary" onclick="saveCompanyDetails()">Save Changes</button>
            </div>
        </form>
    </div>

</div>

<script>
    // Toggle Edit Mode for Clinic Details
    function toggleEditMode() {
        const inputs = document.querySelectorAll('#company-overview-form .readonly-input');
        const saveActions = document.getElementById('save-actions');
        
        let isEditing = false;
        
        // Loop through inputs, add/remove 'editable' class and 'readonly' attribute
        inputs.forEach(input => {
            input.classList.toggle('editable');
            if (input.hasAttribute('readonly')) {
                input.removeAttribute('readonly');
                isEditing = true;
            } else {
                input.setAttribute('readonly', true);
            }
        });

        // Show save button only when editing
        saveActions.style.display = isEditing ? 'block' : 'none';
    }

    // Save Data Simulation
    function saveCompanyDetails() {
        alert("Company details updated successfully!");
        toggleEditMode(); // Revert back to read-only mode after saving
    }
</script>

</body>
</html>
