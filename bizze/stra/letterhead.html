<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterhead - Bizze</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Specific A4 simulation styles for the web preview */
        .a4-container {
            width: 100%;
            max-width: 794px; /* A4 width at 96 DPI */
            min-height: 1123px; /* A4 height at 96 DPI */
            background: white;
            margin: 0 auto;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        
        .editable-content {
            flex-grow: 1;
            margin: 40px 0;
            padding: 20px;
            border: 1px dashed #edf1f7; /* Guide for users, can be removed before print */
            min-height: 500px;
        }
    </style>
</head>

        <header class="top-nav" data-html2canvas-ignore="true" style="max-width: 800px; margin: 0 auto 20px auto;">
            <button class="icon-btn back-btn" onclick="history.back()">←</button>
            <h2 class="main-heading" style="margin: 0; font-size: 20px;">Letterhead Generator</h2>
            <button class="btn-primary-ghost" id="download-letterhead-btn">Download PDF</button>
        </header>
