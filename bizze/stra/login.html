<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bizze</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="align-items: center;">
    <div class="app-container" style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 40px 20px;">
        
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 class="main-heading" style="font-size: 32px; color: var(--primary-blue);">Bizze</h1>
            <p class="sub-text">Clinic Management System</p>
        </div>

        <div class="login-form">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 12px; color: var(--text-light); margin-bottom: 8px; display: block;">Email Address</label>
                <input type="email" id="login-email" placeholder="admin@cmfilings.com" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #edf1f7;">
            </div>

            <div class="form-group" style="margin-bottom: 30px;">
                <label style="font-size: 12px; color: var(--text-light); margin-bottom: 8px; display: block;">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #edf1f7;">
            </div>

            <button class="btn-primary-large" id="login-btn" style="width: 100%; padding: 15px;">Secure Login</button>
        </div>
        
        <div id="error-message" style="color: #ff4d4f; text-align: center; margin-top: 15px; font-size: 13px; display: none;"></div>
    </div>
    
    <script type="module" src="login.js"></script>
</body>
</html>
