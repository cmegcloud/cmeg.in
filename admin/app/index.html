<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG Admin</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#A67C52">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-slate-900 text-gray-200 min-h-screen p-5">

<h1 class="text-xl font-bold mb-4">
CMEG Client Master
</h1>

<select
id="clientSelect"
class="w-full p-3 bg-slate-800 rounded mb-4"
onchange="loadClient()">

<option value="">Select Client</option>

</select>

<div id="clientInfo" class="bg-slate-800 p-4 rounded space-y-2">

<p>GST: -</p>
<p>PAN: -</p>
<p>Mobile: -</p>
<p>Email: -</p>

</div>

<div id="complianceList"
class="bg-slate-800 p-4 rounded mt-4">
Compliance list
</div>

<div id="credentialsBox"
class="bg-slate-800 p-4 rounded mt-4">
Credentials
</div>

<script src="js/app.js"></script>

</body>
</html>
