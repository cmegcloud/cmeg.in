<!DOCTYPE html>
<html lang="en" class="dark">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG Admin</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A67C52">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
darkMode: 'class',
theme:{
extend:{
colors:{
brand:{
primary:'#A67C52',
dark:'#856341'
}
}
}
}
}
</script>

<style>
*{font-family:'Plus Jakarta Sans',sans-serif}
</style>

</head>

<body class="bg-slate-900 text-gray-200 min-h-screen">

<!-- LOGIN SCREEN -->

<div id="loginScreen" class="flex items-center justify-center min-h-screen">

<div class="bg-slate-800 p-8 rounded-xl w-80 text-center shadow-lg">

<img src="https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/logocmeg.png"
class="w-16 mx-auto mb-4">

<h2 class="text-xl font-bold mb-2">CMEG Admin</h2>

<p class="text-sm text-gray-400 mb-5">
Enter PIN to continue
</p>

<input
id="pinInput"
type="password"
inputmode="numeric"
pattern="[0-9]*"
maxlength="4"
class="w-full text-center text-2xl tracking-widest p-3 rounded bg-slate-900 border border-slate-700 mb-4">

<button onclick="checkPin()"
class="bg-[#A67C52] hover:bg-[#856341] w-full py-3 rounded font-semibold">

Unlock

</button>

<p id="errorMsg" class="text-red-400 text-sm mt-3 hidden">
Wrong PIN
</p>

</div>

</div>

<!-- MAIN APP -->

<div id="app" class="hidden">

<!-- HEADER -->

<header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center">

<div class="flex items-center gap-3">

<img src="https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/logocmeg.png"
class="w-9">

<div>

<h1 class="font-bold text-lg">
CMEG Admin
</h1>

<p class="text-xs text-gray-400">
Personal Business App
</p>

</div>

</div>

<button onclick="toggleTheme()"
class="text-sm px-3 py-1 bg-slate-700 rounded">

🌙 / ☀

</button>

</header>

<!-- DASHBOARD -->

<div class="p-5">

<h2 class="text-lg font-semibold mb-4">
Main Dashboard
</h2>

<!-- COMPLIANCE SUMMARY -->

<div class="bg-slate-800 p-4 rounded-xl mb-5">

<h3 class="font-semibold mb-2">
Pending Compliance
</h3>

<p class="text-sm text-gray-400">
No pending items
</p>

</div>

<!-- GRID -->

<div class="grid grid-cols-2 gap-4">

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">👥</div>

Client Master

</a>

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">📅</div>

Compliance / Tasks

</a>

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">🧾</div>

Estimate

</a>

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">💰</div>

Proforma Invoice

</a>

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">🔑</div>

Client Credentials

</a>

<a href="#"
class="bg-slate-800 p-5 rounded-xl hover:bg-slate-700">

<div class="text-3xl mb-2">⚙</div>

ERP

</a>

</div>

</div>

</div>

<script>

const PIN="3655"

function checkPin(){

const input=document.getElementById("pinInput").value

if(input===PIN){

document.getElementById("loginScreen").style.display="none"

document.getElementById("app").style.display="block"

}else{

document.getElementById("errorMsg").classList.remove("hidden")

}

}

function toggleTheme(){

document.documentElement.classList.toggle("dark")

}

</script>

</body>
</html>
