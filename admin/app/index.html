<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG Admin</title>

<link rel="manifest" href="/admin/app/manifest.json">

<meta name="theme-color" content="#A67C52">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-[#0b1220] text-gray-200 min-h-screen">

<div class="max-w-md mx-auto p-5">

<!-- HEADER -->
<div class="flex items-center gap-3 mb-6">


<img src="/logocmeg.png" class="w-12 h-12">
  
<h1 class="text-xl font-bold text-[#D4AF37]">
CMEG Admin
</h1>

</div>

<!-- SEARCH -->
<input
id="clientSearch"
type="text"
placeholder="Search client..."
class="w-full p-4 bg-[#1e293b] rounded-xl border border-slate-700 focus:border-[#D4AF37] outline-none mb-4"
oninput="searchClient()"
/>

<!-- SELECTED CLIENT -->
<div id="selectedClient" class="text-lg font-semibold mb-3 text-white"></div>

<!-- SEARCH RESULTS -->
<div
id="clientResults"
class="bg-[#1e293b] rounded-xl mb-6 overflow-hidden">
</div>

<!-- CLIENT INFO -->
<div id="clientInfo"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Client Info
</h3>

<p><span class="text-gray-400">GST</span><br>-</p>
<p><span class="text-gray-400">PAN</span><br>-</p>
<p><span class="text-gray-400">Mobile</span><br>-</p>
<p><span class="text-gray-400">Email</span><br>-</p>

</div>

<!-- COMPLIANCE -->
<div id="complianceList"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Compliance
</h3>

</div>

<!-- CREDENTIALS -->
<div id="credentialsBox"
class="bg-[#1e293b] p-5 rounded-xl shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Credentials
</h3>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
