<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG Admin</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#A67C52">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

</head>


  <script>

let clients=[];

/* LOAD CLIENT DATA */

fetch("data/clients.json")
.then(res=>res.json())
.then(data=>{

clients=data;

showAllClients();

})
.catch(err=>console.log(err));


/* SHOW CLIENT LIST */

function showAllClients(){

const container=document.getElementById("clientResults");

container.innerHTML="";

clients.forEach(c=>{

let div=document.createElement("div");

div.className="p-4 border-b border-slate-700 cursor-pointer hover:bg-[#334155]";

div.innerText=c.name;

div.onclick=()=>loadClient(c.id);

container.appendChild(div);

});

}


/* SEARCH CLIENT */

function searchClient(){

const keyword=document
.getElementById("clientSearch")
.value
.toLowerCase();

const container=document.getElementById("clientResults");

container.innerHTML="";

clients
.filter(c=>c.name.toLowerCase().includes(keyword))
.forEach(c=>{

let div=document.createElement("div");

div.className="p-4 border-b border-slate-700 cursor-pointer hover:bg-[#334155]";

div.innerText=c.name;

div.onclick=()=>loadClient(c.id);

container.appendChild(div);

});

}


/* LOAD CLIENT DETAILS */

function loadClient(id){

const client=clients.find(c=>c.id===id);

if(!client)return;


document.getElementById("clientInfo").innerHTML=`

<h3 class="text-[#D4AF37] font-semibold mb-3">
Client Info
</h3>

<p class="text-gray-400">Loading client data...</p>
<p><span class="text-gray-400">PAN</span><br>${client.pan}</p>
<p><span class="text-gray-400">Mobile</span><br>${client.mobile}</p>
<p><span class="text-gray-400">Email</span><br>${client.email}</p>

`;


let complianceHTML=`
<h3 class="text-[#D4AF37] font-semibold mb-3">
Compliance
</h3>
`;

client.compliance.forEach(c=>{

let color=c.status==="Pending"
?"text-red-400"
:"text-green-400";

complianceHTML+=`

<p class="mb-2">
${c.type} (${c.period})<br>
Due: ${c.due_date}<br>
<span class="${color}">${c.status}</span>
</p>

`;

});

document.getElementById("complianceList").innerHTML=complianceHTML;


document.getElementById("credentialsBox").innerHTML=`

<h3 class="text-[#D4AF37] font-semibold mb-3">
Credentials
</h3>

<p>GST Portal: ${client.credentials.gst_portal_user}</p>
<p>Income Tax: ${client.credentials.income_tax_user}</p>
<p>MCA: ${client.credentials.mca_user}</p>

`;

}

</script>
  
<body class="bg-[#0b1220] text-gray-200 min-h-screen">

<div class="max-w-md mx-auto p-5">

<!-- HEADER -->
<div class="flex items-center gap-3 mb-6">

<img 
src="https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/assets/logocmeg.png"
class="w-10 h-10">

<h1 class="text-xl font-bold text-[#D4AF37]">
CMEG Admin
</h1>

</div>

<!-- SEARCH -->
<input
id="clientSearch"
type="text"
placeholder="Search client..."
class="w-full p-4 bg-[#1e293b] rounded-xl border border-slate-700 focus:border-[#D4AF37] outline-none mb-4"
oninput="searchClient()"
/>

<!-- SEARCH RESULTS -->
<div
id="clientResults"
class="bg-[#1e293b] rounded-xl mb-6 overflow-hidden">
</div>

<!-- CLIENT INFO -->
<div id="clientInfo"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Client Info
</h3>

<p><span class="text-gray-400">GST</span><br>-</p>
<p><span class="text-gray-400">PAN</span><br>-</p>
<p><span class="text-gray-400">Mobile</span><br>-</p>
<p><span class="text-gray-400">Email</span><br>-</p>

</div>

<!-- COMPLIANCE -->
<div id="complianceList"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Compliance
</h3>

</div>

<!-- CREDENTIALS -->
<div id="credentialsBox"
class="bg-[#1e293b] p-5 rounded-xl shadow-lg">

<h3 class="text-[#D4AF37] font-semibold mb-3">
Credentials
</h3>

</div>

</div>

</body>
</html>
