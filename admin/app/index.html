<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG Admin</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#A67C52">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-gradient-to-b from-[#0f172a] to-[#020617] text-gray-200 min-h-screen">

<div class="max-w-xl mx-auto p-5">

<h1 class="text-2xl font-bold text-[#ED6EBB] mb-6">
CMEG Client Master
</h1>

<input
id="clientSearch"
type="text"
placeholder="Search client..."
class="w-full p-4 bg-[#1e293b] rounded-xl border border-gray-700 focus:border-[#ED6EBB] outline-none mb-4"
oninput="searchClient()"
/>

<div
id="clientResults"
class="bg-[#1e293b] rounded-xl mb-5 overflow-hidden">
</div>

<div id="clientInfo"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<p><span class="text-gray-400">GST</span><br>-</p>
<p><span class="text-gray-400">PAN</span><br>-</p>
<p><span class="text-gray-400">Mobile</span><br>-</p>
<p><span class="text-gray-400">Email</span><br>-</p>

</div>

<div id="complianceList"
class="bg-[#1e293b] p-5 rounded-xl mb-4 shadow-lg">

<h3 class="text-[#ED6EBB] font-semibold mb-2">
Compliance
</h3>

</div>

<div id="credentialsBox"
class="bg-[#1e293b] p-5 rounded-xl shadow-lg">

<h3 class="text-[#ED6EBB] font-semibold mb-2">
Credentials
</h3>

</div>

</div>

</body>
</html>
