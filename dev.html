<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Playground</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .editor-area {
      font-family: 'JetBrains Mono', monospace;
      resize: none;
      tab-size: 2;
      line-height: 1.6;
    }
    .editor-area:focus { outline: none; }
    .tab-btn { transition: all 0.2s ease; }
    .tab-btn.active { border-bottom: 2px solid; }
    .toast-msg {
      animation: slideUp 0.3s ease, fadeOut 0.3s ease 1.7s forwards;
    }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .split-handle { cursor: col-resize; user-select: none; }
    .split-handle:hover, .split-handle.dragging { background: var(--accent) !important; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-hidden">
  <div id="app" class="h-full w-full flex flex-col" style="background:#0f1117; color:#c9d1d9; font-family:'Outfit',sans-serif;"><!-- Header -->
   <header class="flex items-center justify-between px-4 py-2 border-b" style="border-color:#21262d; background:#161b22;">
    <div class="flex items-center gap-2">
     <div class="w-7 h-7 rounded-md flex items-center justify-center" style="background:#58a6ff;"><i data-lucide="code-2" style="width:16px;height:16px;color:#0f1117;"></i>
     </div>
     <h1 id="appTitle" class="text-sm font-semibold" style="color:#e6edf3;">HTML Playground</h1>
    </div>
    <div class="flex items-center gap-1"><button id="btnNew" class="tab-btn flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium" style="background:#238636;color:#fff;" title="New blank file"> <i data-lucide="file-plus" style="width:14px;height:14px;"></i> New </button> <button id="btnTemplate" class="tab-btn flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium" style="background:#21262d;color:#c9d1d9;" title="Starter template"> <i data-lucide="layout-template" style="width:14px;height:14px;"></i> Template </button> <button id="btnCopy" class="tab-btn flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium" style="background:#21262d;color:#c9d1d9;" title="Copy code"> <i data-lucide="copy" style="width:14px;height:14px;"></i> Copy </button> <button id="btnRun" class="tab-btn flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium" style="background:#58a6ff;color:#0f1117;" title="Run code"> <i data-lucide="play" style="width:14px;height:14px;"></i> Run </button>
    </div>
   </header><!-- Main -->
   <div id="mainArea" class="flex flex-1 overflow-hidden" style="min-height:0;"><!-- Editor Panel -->
    <div id="editorPanel" class="flex flex-col overflow-hidden" style="width:50%;min-width:200px;">
     <div class="flex items-center px-3 py-1.5 text-xs gap-3" style="background:#161b22;border-bottom:1px solid #21262d;color:#8b949e;"><span class="flex items-center gap-1"><i data-lucide="file-code" style="width:12px;height:12px;"></i> index.html</span> <span id="charCount" class="ml-auto">0 chars</span>
     </div>
     <div class="flex-1 overflow-hidden relative"><textarea id="codeEditor" class="editor-area w-full h-full p-4 text-sm" style="background:#0d1117;color:#e6edf3;border:none;" spellcheck="false" placeholder="Paste or type your HTML here..."></textarea>
     </div>
    </div><!-- Splitter -->
    <div id="splitter" class="split-handle flex-shrink-0" style="width:5px;background:#21262d;"></div><!-- Preview Panel -->
    <div id="previewPanel" class="flex flex-col overflow-hidden" style="flex:1;min-width:200px;">
     <div class="flex items-center px-3 py-1.5 text-xs" style="background:#161b22;border-bottom:1px solid #21262d;color:#8b949e;"><span class="flex items-center gap-1"><i data-lucide="eye" style="width:12px;height:12px;"></i> Preview</span> <label class="ml-auto flex items-center gap-1 cursor-pointer"> <input type="checkbox" id="autoRun" checked class="accent-blue-500"> Auto-run </label>
     </div>
     <div class="flex-1 overflow-hidden" style="background:#fff;"><iframe id="previewFrame" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin"></iframe>
     </div>
    </div>
   </div><!-- Toast container -->
   <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 z-50 pointer-events-none"></div>
  </div>
  <script>
    // --- Config & SDK ---
    const defaultConfig = {
      app_title: 'HTML Playground',
      background_color: '#0f1117',
      surface_color: '#161b22',
      text_color: '#c9d1d9',
      primary_action_color: '#58a6ff',
      secondary_action_color: '#238636',
      font_family: 'Outfit',
      font_size: 14
    };

    function applyConfig(c) {
      const app = document.getElementById('app');
      app.style.background = c.background_color || defaultConfig.background_color;
      app.style.color = c.text_color || defaultConfig.text_color;
      app.style.fontFamily = `${c.font_family || defaultConfig.font_family}, sans-serif`;

      document.getElementById('appTitle').textContent = c.app_title || defaultConfig.app_title;

      document.querySelectorAll('header, [data-surface]').forEach(el => {
        el.style.background = c.surface_color || defaultConfig.surface_color;
      });
      const header = document.querySelector('header');
      if (header) header.style.background = c.surface_color || defaultConfig.surface_color;

      const btnRun = document.getElementById('btnRun');
      btnRun.style.background = c.primary_action_color || defaultConfig.primary_action_color;

      const btnNew = document.getElementById('btnNew');
      btnNew.style.background = c.secondary_action_color || defaultConfig.secondary_action_color;

      const baseSize = c.font_size || defaultConfig.font_size;
      document.getElementById('codeEditor').style.fontSize = `${baseSize}px`;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: v => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: v => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: v => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } },
            { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: v => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); } }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: v => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: v => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['app_title', config.app_title || defaultConfig.app_title]
        ])
      });
    }

    // --- Toast ---
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = 'toast-msg px-4 py-2 rounded-lg text-xs font-medium';
      t.style.cssText = 'background:#238636;color:#fff;';
      t.textContent = msg;
      container.appendChild(t);
      setTimeout(() => t.remove(), 2100);
    }

    // --- Editor Logic ---
    const editor = document.getElementById('codeEditor');
    const previewFrame = document.getElementById('previewFrame');
    const charCount = document.getElementById('charCount');
    const autoRunCb = document.getElementById('autoRun');
    let debounceTimer;

    const starterTemplate = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
      color: #1a202c;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; }
    p { color: #718096; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World 👋</h1>
    <p>Start editing to see your changes live!</p>
  </div>
</body>
</html>`;

    function runCode() {
      const code = editor.value;
      const doc = previewFrame.contentDocument;
      doc.open();
      doc.write(code);
      doc.close();
    }

    function updateCharCount() {
      charCount.textContent = `${editor.value.length} chars`;
    }

    // Tab key support
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        handleInput();
      }
    });

    function handleInput() {
      updateCharCount();
      if (autoRunCb.checked) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runCode, 400);
      }
    }

    editor.addEventListener('input', handleInput);

    document.getElementById('btnRun').addEventListener('click', () => { runCode(); showToast('Running!'); });

    document.getElementById('btnNew').addEventListener('click', () => {
      editor.value = '';
      updateCharCount();
      const doc = previewFrame.contentDocument;
      doc.open(); doc.write(''); doc.close();
      showToast('New file created');
      editor.focus();
    });

    document.getElementById('btnTemplate').addEventListener('click', () => {
      editor.value = starterTemplate;
      updateCharCount();
      runCode();
      showToast('Template loaded');
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      if (!editor.value) return;
      navigator.clipboard.writeText(editor.value).then(() => showToast('Copied!')).catch(() => {
        // fallback
        editor.select();
        document.execCommand('copy');
        showToast('Copied!');
      });
    });

    // --- Drag Splitter ---
    const splitter = document.getElementById('splitter');
    const editorPanel = document.getElementById('editorPanel');
    const mainArea = document.getElementById('mainArea');
    let dragging = false;

    splitter.addEventListener('mousedown', (e) => {
      dragging = true;
      splitter.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const rect = mainArea.getBoundingClientRect();
      const pct = ((e.clientX - rect.left) / rect.width) * 100;
      const clamped = Math.max(20, Math.min(80, pct));
      editorPanel.style.width = clamped + '%';
    });

    document.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        splitter.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // Init
    lucide.createIcons();
    updateCharCount();
  </script>
