<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO DEV - Web App Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #0f172a; --bg-panel: #1e293b; --primary: #3b82f6; --danger: #ef4444; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Layout */
    .sidebar { width: 450px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .preview-container { flex: 1; padding: 20px; display: flex; flex-direction: column; background: #020617; }
    iframe { flex: 1; border: none; border-radius: 12px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    
    /* Header & Tabs */
    .header { padding: 20px; border-bottom: 1px solid var(--border); }
    .header h2 { margin: 0; font-size: 18px; display: flex; align-items: center; justify-content: space-between; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 13px; text-transform: uppercase; transition: 0.2s; }
    .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); background: rgba(59, 130, 246, 0.1); }
    .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.05); }

    /* Content Areas */
    .tab-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
    .tab-content.active { display: block; }
    
    /* Form Elements */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input[type="text"], input[type="url"], select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-family: inherit; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    textarea { height: 150px; resize: vertical; font-family: monospace; color: #34d399; }
    
    /* Buttons */
    .btn { background: var(--border); color: var(--text); border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: #475569; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-block { width: 100%; margin-top: 10px; }

    /* Menu Item Builder */
    .menu-item-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; cursor: pointer; }
    .menu-body { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal { background: var(--bg-panel); width: 100%; max-width: 800px; border-radius: 12px; display: flex; flex-direction: column; max-height: 90vh; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; }
  </style>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="sidebar">
    <div class="header">
      <h2>🛠️ Dev Studio <button class="btn btn-primary" style="font-size: 12px; padding: 6px 10px;" onclick="openExportModal()">Export Code</button></h2>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('settings')">Settings</button>
      <button class="tab" onclick="switchTab('menus')">Menus</button>
      <button class="tab" onclick="switchTab('import')">Import</button>
    </div>

    <div id="tab-settings" class="tab-content active">
      <div class="form-group">
        <label>App Name</label>
        <input type="text" id="appName" oninput="updateState('appName', this.value)">
      </div>
      <div class="form-group">
        <label>Company Tagline</label>
        <input type="text" id="tagline" oninput="updateState('tagline', this.value)">
      </div>
      <div class="form-group">
        <label>Logo URL (Optional)</label>
        <input type="url" id="logoUrl" placeholder="https://example.com/logo.png" oninput="updateState('logoUrl', this.value)">
      </div>
      <div class="form-group">
        <label>GAS Script Link (Backend URL)</label>
        <input type="url" id="scriptLink" placeholder="https://script.google.com/macros/s/..." oninput="updateState('scriptLink', this.value)">
      </div>
      <div class="form-group">
        <label>Theme Color</label>
        <input type="color" id="themeColor" style="height:40px; padding:2px;" oninput="updateState('themeColor', this.value)">
      </div>
    </div>

    <div id="tab-menus" class="tab-content">
      <div id="menuList"></div>
      <button class="btn btn-block" onclick="addMenu()"><i class="ph ph-plus"></i> Add New Menu Item</button>
    </div>

    <div id="tab-import" class="tab-content">
      <div class="form-group">
        <label>Paste State JSON to Edit Existing App</label>
        <textarea id="importData" placeholder='{"appName": "...", "menus": [...]}'></textarea>
      </div>
      <button class="btn btn-primary btn-block" onclick="importState()">Import & Render</button>
      <div style="margin-top: 20px; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
        <strong>Pro Tip:</strong> To edit an existing layout safely, you import the JSON Data State, not raw HTML. When you export from this tool, it generates both the Code and the JSON State so you can reload it here later.
      </div>
    </div>
  </div>

  <div class="preview-container">
    <iframe id="previewFrame"></iframe>
  </div>

  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <h3 style="margin:0;">Export Application</h3>
        <button class="btn btn-danger" style="padding: 5px 10px;" onclick="closeModal('exportModal')">Close</button>
      </div>
      <div class="modal-body">
        <label>1. Index.html (Frontend)</label>
        <textarea id="outHtml" readonly style="height: 200px; margin-bottom: 15px;"></textarea>
        
        <label>2. Code.gs (Google Apps Script Backend)</label>
        <textarea id="outGs" readonly style="height: 150px; margin-bottom: 15px;"></textarea>
        
        <label>3. Project State Data (Save this to import and edit later!)</label>
        <textarea id="outState" readonly style="height: 100px; color: #a78bfa;"></textarea>
      </div>
    </div>
  </div>

  <script>
    // 1. CORE STATE MANAGEMENT
    // Initialized with your contextual data defaults
    let appState = {
      appName: "CM Biz",
      tagline: "Count, Connect, Grow",
      logoUrl: "",
      scriptLink: "",
      themeColor: "#2563eb",
      menus: [
        { id: generateId(), name: "Dashboard", icon: "ph-squares-four", actionType: "link", actionValue: "?page=dashboard" },
        { id: generateId(), name: "Ledgers", icon: "ph-book-bookmark", actionType: "script", actionValue: "loadLedgers()" },
        { id: generateId(), name: "Vouchers", icon: "ph-receipt", actionType: "link", actionValue: "?page=vouchers" }
      ]
    };

    const iconOptions = [
      { val: "ph-squares-four", label: "Dashboard" },
      { val: "ph-receipt", label: "Voucher/Receipt" },
      { val: "ph-book-bookmark", label: "Ledger/Book" },
      { val: "ph-users", label: "Users/Team" },
      { val: "ph-chart-pie-slice", label: "Chart/Data" },
      { val: "ph-gear", label: "Settings" }
    ];

    function generateId() { return Math.random().toString(36).substr(2, 9); }

    // 2. UI CONTROLLERS
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function initSettingsUI() {
      document.getElementById('appName').value = appState.appName;
      document.getElementById('tagline').value = appState.tagline;
      document.getElementById('logoUrl').value = appState.logoUrl;
      document.getElementById('scriptLink').value = appState.scriptLink;
      document.getElementById('themeColor').value = appState.themeColor;
    }

    function updateState(key, value) {
      appState[key] = value;
      updatePreview();
    }

    // 3. MENU BUILDER LOGIC
    function renderMenuBuilder() {
      const container = document.getElementById('menuList');
      container.innerHTML = '';
      
      appState.menus.forEach((menu, index) => {
        const iconSelectOptions = iconOptions.map(ico => 
          `<option value="${ico.val}" ${menu.icon === ico.val ? 'selected' : ''}>${ico.label}</option>`
        ).join('');

        container.innerHTML += `
          <div class="menu-item-card">
            <div class="menu-header">
              <span><i class="ph ${menu.icon}"></i> ${menu.name}</span>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size:12px;" onclick="deleteMenu(${index})"><i class="ph ph-trash"></i></button>
            </div>
            <div class="menu-body">
              <div class="form-group" style="margin:0;">
                <label>Menu Name</label>
                <input type="text" value="${menu.name}" oninput="updateMenu(${index}, 'name', this.value)">
              </div>
              <div class="row">
                <div class="form-group" style="margin:0;">
                  <label>Icon</label>
                  <select onchange="updateMenu(${index}, 'icon', this.value)">${iconSelectOptions}</select>
                </div>
                <div class="form-group" style="margin:0;">
                  <label>Action Type</label>
                  <select onchange="updateMenu(${index}, 'actionType', this.value)">
                    <option value="link" ${menu.actionType === 'link' ? 'selected' : ''}>URL Link</option>
                    <option value="script" ${menu.actionType === 'script' ? 'selected' : ''}>JS Function</option>
                  </select>
                </div>
              </div>
              <div class="form-group" style="margin:0;">
                <label>Action Value (URL or Function Name)</label>
                <input type="text" value="${menu.actionValue}" oninput="updateMenu(${index}, 'actionValue', this.value)">
              </div>
            </div>
          </div>
        `;
      });
    }

    function addMenu() {
      appState.menus.push({ id: generateId(), name: "New Menu", icon: "ph-squares-four", actionType: "link", actionValue: "#" });
      renderMenuBuilder();
      updatePreview();
    }

    function updateMenu(index, key, value) {
      appState.menus[index][key] = value;
      if(key === 'name' || key === 'icon') renderMenuBuilder(); // Re-render to update header text/icon
      updatePreview();
    }

    function deleteMenu(index) {
      appState.menus.splice(index, 1);
      renderMenuBuilder();
      updatePreview();
    }

    // 4. ENGINE: HTML TEMPLATE GENERATOR
    function generateHTML() {
      // Build the menu HTML dynamically based on settings
      const menuHTML = appState.menus.map(m => {
        const actionAttr = m.actionType === 'link' 
          ? `href="${m.actionValue}"` 
          : `href="#" onclick="${m.actionValue}"`;
        return `<a class="nav-item" ${actionAttr}><i class="ph ${m.icon}"></i> ${m.name}</a>`;
      }).join('\n          ');

      const logoHTML = appState.logoUrl 
        ? `<img src="${appState.logoUrl}" alt="Logo" style="max-height: 40px; border-radius: 8px;">`
        : `<div class="brand-text">${appState.appName}</div>`;

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${appState.appName}</title>
  <script src="https://unpkg.com/@phosphor-icons/web"><\/script>
  <style>
    :root { --primary: ${appState.themeColor}; --bg: #f8fafc; --sidebar: #0f172a; --text: #1e293b; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: var(--sidebar); color: #fff; display: flex; flex-direction: column; }
    .brand { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 5px; }
    .brand-text { font-size: 22px; font-weight: 800; }
    .tagline { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Navigation */
    .nav { padding: 15px 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
    .nav-item { padding: 12px 15px; color: #cbd5e1; text-decoration: none; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: 0.2s; }
    .nav-item i { font-size: 20px; }
    .nav-item:hover { background: var(--primary); color: #fff; }
    
    /* Main Content */
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .header-bar { background: #fff; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      ${logoHTML}
      <span class="tagline">${appState.tagline}</span>
    </div>
    <nav class="nav">
      ${menuHTML}
    </nav>
  </div>
  <div class="main">
    <div class="header-bar">
      <h2 style="margin:0;">Dashboard View</h2>
      <div style="font-family:monospace; color:#64748b;">${new Date().toLocaleDateString()}</div>
    </div>
    <div style="background:#fff; padding:30px; border-radius:12px; border: 1px dashed #cbd5e1; text-align:center; color:#64748b;">
      <i class="ph ph-wrench" style="font-size: 40px; margin-bottom:10px;"></i>
      <h3>Main Content Area</h3>
      <p>App connected to: ${appState.scriptLink || 'No Backend Linked'}</p>
    </div>
  </div>
  <script>
    // Custom functions generated by builder
    function loadLedgers() { alert("Executing loadLedgers() via Action Binding!"); }
  <\/script>
</body>
</html>`;
    }

    // 5. IMPORT / EXPORT LOGIC
    function updatePreview() {
      document.getElementById('previewFrame').srcdoc = generateHTML();
    }

    function openExportModal() {
      document.getElementById('outHtml').value = generateHTML();
      
      const gsCode = `// Backend Code.gs for ${appState.appName}
function doGet(e) {
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('${appState.appName}')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}`;
      document.getElementById('outGs').value = gsCode;
      
      // Export the raw JSON state so the user can import it later
      document.getElementById('outState').value = JSON.stringify(appState, null, 2);
      
      document.getElementById('exportModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function importState() {
      try {
        const inputData = document.getElementById('importData').value;
        const parsedState = JSON.parse(inputData);
        if(parsedState.appName && parsedState.menus) {
          appState = parsedState;
          initSettingsUI();
          renderMenuBuilder();
          updatePreview();
          alert("State Imported Successfully!");
          switchTab('settings');
        } else {
          alert("Invalid State Data: Missing required fields.");
        }
      } catch (e) {
        alert("JSON Parsing Error. Make sure you are pasting the Project State Data exactly as exported.");
      }
    }

    // INITIALIZE APP
    initSettingsUI();
    renderMenuBuilder();
    updatePreview();
  </script>
</body>
</html>
