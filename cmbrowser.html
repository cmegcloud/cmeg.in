  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    .browser-tab {
      transition: all 0.2s ease;
    }
    .browser-tab.active {
      background: var(--surface-color);
      border-bottom: 2px solid var(--accent-color);
    }
    .browser-tab:not(.active):hover {
      background: rgba(255,255,255,0.05);
    }

    .url-bar {
      transition: all 0.25s ease;
    }
    .url-bar:focus-within {
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    .speed-dial-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .speed-dial-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .speed-dial-card:active {
      transform: scale(0.97);
    }

    .nav-btn {
      transition: all 0.15s ease;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.1); }
    .nav-btn:active { transform: scale(0.9); }
    .nav-btn.disabled { opacity: 0.3; pointer-events: none; }

    .menu-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .menu-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .menu-panel {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .menu-overlay.show .menu-panel {
      transform: translateY(0);
    }

    .menu-item {
      transition: background 0.15s;
    }
    .menu-item:hover { background: rgba(255,255,255,0.08); }
    .menu-item:active { background: rgba(255,255,255,0.12); }

    .toast-msg {
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    }
    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .tab-panel {
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo-pulse {
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(14,165,233,0.3)); }
      50% { filter: drop-shadow(0 0 16px rgba(14,165,233,0.6)); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .incognito-badge {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }

    // ===== STATE =====
    let tabs = [];

    let isIncognito = false;
    let desktopMode = false;
    let darkMode = true;
    let tabIdCounter = 0;
    let autoFillCredentials = { username: '', password: '', enabled: false };

    const speedDialSites = [
      { name: 'GST', icon: 'file-text', color: '#d97706', url: 'https://www.gst.gov.in' },
      { name: 'Income Tax', icon: 'calculator', color: '#ea580c', url: 'https://www.incometaxindiaefiling.gov.in' },
      { name: 'EPF', icon: 'briefcase', color: '#b45309', url: 'https://www.epfindia.gov.in' },
      { name: 'ESI', icon: 'shield', color: '#92400e', url: 'https://www.esic.nic.in' },
      { name: 'Udhyam', icon: 'trending-up', color: '#d97706', url: 'https://udyamregistration.gov.in' },
      { name: 'MCA', icon: 'building-2', color: '#ea580c', url: 'https://www.mca.gov.in' },
      { name: 'TDSRC', icon: 'file-check', color: '#b45309', url: 'https://www.tdscircle.gov.in' },
      { name: 'Pan-TAN', icon: 'credit-card', color: '#92400e', url: 'https://www.incometaxindiaefiling.gov.in' },
    ];

    // ===== DOM REFS =====
    const $tabsContainer = document.getElementById('tabs-container');
    const $urlInput = document.getElementById('url-input');
    const $homePage = document.getElementById('home-page');
    const $browsePage = document.getElementById('browse-page');
    const $pageLoading = document.getElementById('page-loading');
    const $pageContent = document.getElementById('page-content');
    const $menuOverlay = document.getElementById('menu-overlay');
    const $tabOverview = document.getElementById('tab-overview');
    const $tabGrid = document.getElementById('tab-grid');
    const $tabCount = document.getElementById('tab-count');
    const $homeSearch = document.getElementById('home-search');
    const $speedDial = document.getElementById('speed-dial');
    const $bookmarksPanel = document.getElementById('bookmarks-panel');
    const $historyPanel = document.getElementById('history-panel');
    const $downloadsPanel = document.getElementById('downloads-panel');
    const $bookmarksList = document.getElementById('bookmarks-list');
    const $historyList = document.getElementById('history-list');

    // ===== TAB MANAGEMENT =====
    function createTab(url = '', title = 'New Tab') {
      const id = ++tabIdCounter;
      const tab = { id, url, title, isHome: !url, navHistory: [], navIndex: -1 };
      tabs.push(tab);
      switchToTab(id);
      renderTabs();
      return tab;
    }

    function switchToTab(id) {
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (!tab) return;
      if (tab.isHome) {
        showHome();
        $urlInput.value = '';
      } else {
        showBrowse(tab);
        $urlInput.value = tab.url;
      }
      renderTabs();
      updateNavButtons();
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      tabs.splice(idx, 1);
      if (tabs.length === 0) {
        createTab();
      } else if (activeTabId === id) {
        switchToTab(tabs[Math.min(idx, tabs.length - 1)].id);
      }
      renderTabs();
    }

    function renderTabs() {
      $tabsContainer.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = `browser-tab flex items-center gap-1.5 px-3 py-1.5 rounded-t-lg cursor-pointer text-xs max-w-[140px] min-w-[60px] ${tab.id === activeTabId ? 'active' : ''}`;
        el.style.color = 'var(--text-color, #e2e8f0)';
        el.innerHTML = `
          <span class="truncate flex-1">${tab.title}</span>
          <button class="flex-shrink-0 hover:opacity-70" data-close="${tab.id}"><i data-lucide="x" style="width:12px;height:12px;"></i></button>
        `;
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-close]')) {
            closeTab(tab.id);
          } else {
            switchToTab(tab.id);
          }
        });
        $tabsContainer.appendChild(el);
      });
      $tabCount.textContent = tabs.length;
      lucide.createIcons();
    }

    // ===== NAVIGATION =====
    function navigate(url) {
      if (!url) return;
      // Normalize URL
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
      }

      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;

      tab.url = url;
      tab.isHome = false;

      // Extract title from URL
      try {
        const hostname = new URL(url).hostname.replace('www.', '');
        tab.title = hostname.charAt(0).toUpperCase() + hostname.slice(1);
      } catch {
        tab.title = url.substring(0, 30);
      }

      // Nav history
      tab.navHistory = tab.navHistory.slice(0, tab.navIndex + 1);
      tab.navHistory.push(url);
      tab.navIndex = tab.navHistory.length - 1;

      // Add to history
      if (!isIncognito) {
        history.unshift({ url, title: tab.title, time: new Date().toLocaleTimeString() });
        if (history.length > 50) history.pop();
      }

      $urlInput.value = url;
      showBrowse(tab);
      renderTabs();
      updateNavButtons();
    }

    function goBack() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab || tab.navIndex <= 0) return;
      tab.navIndex--;
      const url = tab.navHistory[tab.navIndex];
      tab.url = url;
      $urlInput.value = url;
      showBrowse(tab);
      updateNavButtons();
    }

    function goForward() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab || tab.navIndex >= tab.navHistory.length - 1) return;
      tab.navIndex++;
      const url = tab.navHistory[tab.navIndex];
      tab.url = url;
      $urlInput.value = url;
      showBrowse(tab);
      updateNavButtons();
    }

    function updateNavButtons() {
      const tab = tabs.find(t => t.id === activeTabId);
      const backBtn = document.getElementById('btn-back');
      const fwdBtn = document.getElementById('btn-forward');
      backBtn.classList.toggle('disabled', !tab || tab.navIndex <= 0);
      fwdBtn.classList.toggle('disabled', !tab || tab.navIndex >= tab.navHistory.length - 1);
    }

    // ===== VIEW MANAGEMENT =====
    function hideAllPanels() {
      $homePage.classList.add('hidden');
      $browsePage.classList.add('hidden');
      $bookmarksPanel.classList.add('hidden');
      $historyPanel.classList.add('hidden');
      $downloadsPanel.classList.add('hidden');
    }

    function showHome() {
      hideAllPanels();
      $homePage.classList.remove('hidden');
      $urlInput.value = '';
    }

    function showBrowse(tab) {
      hideAllPanels();
      $browsePage.classList.remove('hidden');
      $pageContent.classList.add('hidden');
      $pageLoading.classList.remove('hidden');

      setTimeout(() => {
        $pageLoading.classList.add('hidden');
        $pageContent.classList.remove('hidden');
        renderPageContent(tab);
      }, 800 + Math.random() * 600);
    }

    function renderPageContent(tab) {
      let hostname = '';
      try { hostname = new URL(tab.url).hostname; } catch { hostname = tab.url; }

      $pageContent.innerHTML = `
        <div class="rounded-xl p-5 mb-4" style="background: var(--surface-color, #1e293b);">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold" style="background: var(--accent-color, #0ea5e9); color: #fff;">
              ${hostname.charAt(0).toUpperCase()}
            </div>
            <div>
              <p class="text-sm font-medium" style="color: var(--text-color, #e2e8f0);">${tab.title}</p>
              <p class="text-xs truncate max-w-[250px]" style="color: var(--secondary-action-color, #64748b);">${tab.url}</p>
            </div>
          </div>
          <div class="rounded-lg p-4 text-center" style="background: var(--bg-color, #0f172a);">
            <i data-lucide="globe" style="width:48px;height:48px;color:var(--accent-color, #0ea5e9);margin:0 auto 8px;display:block;"></i>
            <p class="text-sm mb-1" style="color: var(--text-color, #e2e8f0);">Page Preview</p>
            <p class="text-xs mb-3" style="color: var(--secondary-action-color, #64748b);">For security, pages are shown as previews in this demo</p>
            <a href="${tab.url}" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-white"
              style="background: var(--accent-color, #0ea5e9);">
              <i data-lucide="external-link" style="width:14px;height:14px;"></i>
              Open in New Tab
            </a>
          </div>
        </div>
        <div class="text-center py-4">
          <p class="text-xs" style="color: var(--secondary-action-color, #64748b);">
            ${isIncognito ? '🔒 Private browsing — no history saved' : ''}
          </p>
        </div>
      `;
      lucide.createIcons();
    }

    // ===== SPEED DIAL =====
    function renderSpeedDial() {
      $speedDial.innerHTML = '';
      speedDialSites.forEach(site => {
        const card = document.createElement('button');
        card.className = 'speed-dial-card flex flex-col items-center gap-2 p-3 rounded-xl';
        card.style.background = 'var(--surface-color, #1e293b)';
        card.innerHTML = `
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${site.color}22;">
            <i data-lucide="${site.icon}" style="width:20px;height:20px;color:${site.color};"></i>
          </div>
          <span class="text-[10px] font-medium truncate w-full text-center" style="color: var(--text-color, #e2e8f0);">${site.name}</span>
        `;
        card.addEventListener('click', () => navigate(site.url));
        $speedDial.appendChild(card);
      });
      lucide.createIcons();
    }

    // ===== BOOKMARKS =====
    function addBookmark() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab || tab.isHome) {
        showToast('Navigate to a page first');
        return;
      }
      if (bookmarks.some(b => b.url === tab.url)) {
        showToast('Already bookmarked');
        return;
      }
      bookmarks.push({ url: tab.url, title: tab.title });
      showToast('Bookmark added ✓');
    }

    function renderBookmarks() {
      hideAllPanels();
      $bookmarksPanel.classList.remove('hidden');
      const empty = document.getElementById('bookmarks-empty');
      if (bookmarks.length === 0) {
        $bookmarksList.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      $bookmarksList.innerHTML = '';
      bookmarks.forEach((b, i) => {
        const el = document.createElement('div');
        el.className = 'flex items-center gap-3 p-3 rounded-xl cursor-pointer';
        el.style.background = 'var(--surface-color, #1e293b)';
        el.innerHTML = `
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold" style="background: #fb923c22; color: #fb923c;">${b.title.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium truncate" style="color: var(--text-color, #e2e8f0);">${b.title}</p>
            <p class="text-xs truncate" style="color: var(--secondary-action-color, #64748b);">${b.url}</p>
          </div>
          <button class="nav-btn flex-shrink-0" data-del-bm="${i}" style="color: var(--secondary-action-color, #64748b);"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button>
        `;
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-del-bm]')) {
            bookmarks.splice(i, 1);
            renderBookmarks();
            return;
          }
          navigate(b.url);
        });
        $bookmarksList.appendChild(el);
      });
      lucide.createIcons();
    }

    // ===== HISTORY =====
    function renderHistory() {
      hideAllPanels();
      $historyPanel.classList.remove('hidden');
      const empty = document.getElementById('history-empty');
      if (history.length === 0) {
        $historyList.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      $historyList.innerHTML = '';
      history.forEach(h => {
        const el = document.createElement('div');
        el.className = 'flex items-center gap-3 p-3 rounded-xl cursor-pointer';
        el.style.background = 'var(--surface-color, #1e293b)';
        el.innerHTML = `
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold" style="background: #4ade8022; color: #4ade80;">${h.title.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium truncate" style="color: var(--text-color, #e2e8f0);">${h.title}</p>
            <p class="text-xs truncate" style="color: var(--secondary-action-color, #64748b);">${h.time} — ${h.url}</p>
          </div>
        `;
        el.addEventListener('click', () => navigate(h.url));
        $historyList.appendChild(el);
      });
      lucide.createIcons();
    }

    // ===== TAB OVERVIEW =====
    function showTabOverview() {
      $tabOverview.classList.remove('hidden');
      $tabGrid.innerHTML = '';
      tabs.forEach(tab => {
        const card = document.createElement('div');
        card.className = 'rounded-xl overflow-hidden cursor-pointer relative';
        card.style.background = 'var(--surface-color, #1e293b)';
        card.innerHTML = `
          <div class="flex items-center justify-between px-3 py-2">
            <span class="text-xs font-medium truncate flex-1" style="color: var(--text-color, #e2e8f0);">${tab.title}</span>
            <button class="ml-1 flex-shrink-0" data-close-tab="${tab.id}" style="color: var(--secondary-action-color, #64748b);"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
          </div>
          <div class="h-28 flex items-center justify-center" style="background: var(--bg-color, #0f172a);">
            ${tab.isHome
              ? '<i data-lucide="home" style="width:32px;height:32px;color:var(--accent-color, #0ea5e9);"></i>'
              : `<span class="text-2xl font-bold" style="color:var(--accent-color, #0ea5e9);">${tab.title.charAt(0)}</span>`
            }
          </div>
          ${tab.id === activeTabId ? `<div class="absolute top-0 left-0 right-0 h-0.5" style="background: var(--accent-color, #0ea5e9);"></div>` : ''}
        `;
        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-close-tab]')) {
            closeTab(tab.id);
            if (tabs.length > 0) showTabOverview();
            else $tabOverview.classList.add('hidden');
            return;
          }
          $tabOverview.classList.add('hidden');
          switchToTab(tab.id);
        });
        $tabGrid.appendChild(card);
      });
      lucide.createIcons();
    }

    // ===== TOAST =====
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-msg px-4 py-2 rounded-xl text-sm font-medium mb-2 text-center';
      toast.style.background = 'var(--surface-color, #1e293b)';
      toast.style.color = 'var(--text-color, #e2e8f0)';
      toast.style.boxShadow = '0 4px 16px rgba(0,0,0,0.4)';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    // ===== EVENT LISTENERS =====
    // URL bar submit
    $urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        navigate($urlInput.value.trim());
        $urlInput.blur();
      }
    });
    document.getElementById('go-btn').addEventListener('click', () => {
      navigate($urlInput.value.trim());
      $urlInput.blur();
    });

    // Home search
    $homeSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = $homeSearch.value.trim();
        if (q) navigate(q);
        $homeSearch.value = '';
      }
    });

    // Bottom nav
    document.getElementById('btn-back').addEventListener('click', goBack);
    document.getElementById('btn-forward').addEventListener('click', goForward);
    document.getElementById('btn-home').addEventListener('click', () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.isHome = true;
        tab.title = 'New Tab';
        tab.url = '';
      }
      showHome();
      renderTabs();
      updateNavButtons();
    });
    document.getElementById('btn-tabs').addEventListener('click', showTabOverview);
    document.getElementById('btn-menu').addEventListener('click', () => $menuOverlay.classList.add('show'));

    // Tab overview buttons
    document.getElementById('close-tab-overview').addEventListener('click', () => $tabOverview.classList.add('hidden'));
    document.getElementById('new-tab-overview').addEventListener('click', () => {
      $tabOverview.classList.add('hidden');
      createTab();
    });
    document.getElementById('new-tab-btn').addEventListener('click', () => createTab());

    // Menu overlay close
    $menuOverlay.addEventListener('click', (e) => {
      if (e.target === $menuOverlay) $menuOverlay.classList.remove('show');
    });

    // Menu actions
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        $menuOverlay.classList.remove('show');
        switch (action) {
          case 'add-bookmark': addBookmark(); break;
          case 'share':
            showToast('Link copied to clipboard ✓');
            break;
          case 'find': $urlInput.focus(); $urlInput.select(); break;
          case 'incognito':
            isIncognito = !isIncognito;
            showToast(isIncognito ? '🔒 Private mode on' : 'Private mode off');
            break;
          case 'autofill':
            document.getElementById('autofill-modal').classList.remove('hidden');
            document.getElementById('autofill-username').value = autoFillCredentials.username || '';
            document.getElementById('autofill-password').value = autoFillCredentials.password || '';
            document.getElementById('autofill-toggle').checked = autoFillCredentials.enabled || false;
            break;
          case 'desktop-mode':
            desktopMode = !desktopMode;
            const dt = document.getElementById('desktop-toggle');
            dt.style.background = desktopMode ? 'var(--accent-color, #0ea5e9)' : 'var(--secondary-action-color, #64748b)';
            dt.querySelector('div').style.left = desktopMode ? 'auto' : '2px';
            dt.querySelector('div').style.right = desktopMode ? '2px' : 'auto';
            showToast(desktopMode ? 'Desktop mode on' : 'Mobile mode');
            break;
          case 'dark-mode':
            darkMode = !darkMode;
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            config.theme = darkMode ? 'dark' : 'light';
            if (window.elementSdk) window.elementSdk.setConfig({ theme: config.theme });
            applyConfig(config);
            showToast(darkMode ? '🌙 Dark mode on' : '☀️ Light mode on');
            break;
          case 'text-size': showToast('Text size: Normal'); break;
          case 'settings': showToast('Settings — coming soon'); break;
        }
      });
    });

    // Quick action buttons
    document.getElementById('bookmarks-btn').addEventListener('click', renderBookmarks);
    document.getElementById('history-btn').addEventListener('click', renderHistory);
    document.getElementById('downloads-btn').addEventListener('click', () => {
      hideAllPanels();
      $downloadsPanel.classList.remove('hidden');
    });
    document.getElementById('incognito-btn').addEventListener('click', () => {
      isIncognito = !isIncognito;
      showToast(isIncognito ? '🔒 Private mode on' : 'Private mode off');
    });

    // Panel close buttons
    document.getElementById('close-bookmarks').addEventListener('click', () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab && tab.isHome) showHome(); else if (tab) showBrowse(tab);
    });
    document.getElementById('close-history').addEventListener('click', () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab && tab.isHome) showHome(); else if (tab) showBrowse(tab);
    });
    document.getElementById('close-downloads').addEventListener('click', () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab && tab.isHome) showHome(); else if (tab) showBrowse(tab);
    });
    document.getElementById('clear-history').addEventListener('click', () => {
      history = [];
      renderHistory();
      showToast('History cleared');
    });

    // Autofill modal handlers
    document.getElementById('close-autofill').addEventListener('click', () => {
      document.getElementById('autofill-modal').classList.add('hidden');
    });
    document.getElementById('cancel-autofill').addEventListener('click', () => {
      document.getElementById('autofill-modal').classList.add('hidden');
    });
    document.getElementById('save-autofill').addEventListener('click', () => {
      autoFillCredentials.username = document.getElementById('autofill-username').value;
      autoFillCredentials.password = document.getElementById('autofill-password').value;
      autoFillCredentials.enabled = document.getElementById('autofill-toggle').checked;
      document.getElementById('autofill-modal').classList.add('hidden');
      showToast(autoFillCredentials.enabled ? '✓ Autofill enabled for GST' : '✓ Credentials saved');
    });

    // ===== ELEMENT SDK =====
    // Light mode colors (off-white)
    const lightModeConfig = {
      background_color: '#f8f7f4',
      surface_color: '#ffffff',
      text_color: '#1a1a1a',
      accent_color: '#d97706',
      secondary_action_color: '#9ca3af'
    };

    // Dark mode colors (goldish-brown)
    const darkModeConfig = {
      background_color: '#1a1410',
      surface_color: '#2a201a',
      text_color: '#f5f1ed',
      accent_color: '#d97706',
      secondary_action_color: '#9a8875'
    };

    const defaultConfig = {
      home_url: 'https://www.gst.gov.in',
      search_engine_label: 'Google',
      ...lightModeConfig,
      font_family: 'Outfit',
      font_size: 14,
      theme: 'light' // 'light' or 'dark'
    };

    function applyConfig(config) {
      const root = document.getElementById('app');
      
      // Determine theme and apply colors
      const themeConfig = config.theme === 'dark' ? darkModeConfig : lightModeConfig;
      const bg = config.background_color || themeConfig.background_color;
      const surface = config.surface_color || themeConfig.surface_color;
      const text = config.text_color || themeConfig.text_color;
      const accent = config.accent_color || themeConfig.accent_color;
      const secondary = config.secondary_action_color || themeConfig.secondary_action_color;
      const font = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      root.style.setProperty('--bg-color', bg);
      root.style.setProperty('--surface-color', surface);
      root.style.setProperty('--text-color', text);
      root.style.setProperty('--accent-color', accent);
      root.style.setProperty('--secondary-action-color', secondary);

      document.body.style.fontFamily = `${font}, Outfit, sans-serif`;
      document.body.style.fontSize = `${fontSize}px`;

      // Update specific styled elements
      document.querySelectorAll('.browser-tab.active').forEach(el => el.style.background = surface);
      document.querySelectorAll('.url-bar').forEach(el => el.style.background = surface);
      document.querySelectorAll('.speed-dial-card').forEach(el => el.style.background = surface);

      // Bottom nav
      const nav = document.querySelector('nav');
      if (nav) { nav.style.background = bg; nav.style.borderColor = surface; }

      // Tab bar
      const tabBar = document.getElementById('tab-bar');
      if (tabBar) tabBar.style.background = bg;

      // Update home_url title
      const title = document.getElementById('app-title');
      if (title) title.style.color = text;

      // Search engine label
      const searchLabel = config.search_engine_label || defaultConfig.search_engine_label;
      if ($homeSearch) $homeSearch.placeholder = `Search with ${searchLabel}...`;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => { applyConfig(config); },
        mapToCapabilities: (config) => ({
          recolorables: [
