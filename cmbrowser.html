<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Browser | Portal Dashboard</title>
    <style>
        :root {
            --brand-gold: #B8860B; /* Goldish brown */
            --brand-gold-hover: #996B09;
            --bg-offwhite: #FAF9F6; /* Off-white */
            --text-dark: #333333;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-offwhite);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--brand-gold);
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Bookmarks Section */
        .bookmarks-section {
            flex: 2;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--brand-gold);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .bookmark-btn {
            display: block;
            background-color: var(--bg-offwhite);
            color: var(--text-dark);
            text-decoration: none;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #ddd;
            transition: all 0.3s;
            font-weight: bold;
        }

        .bookmark-btn:hover {
            background-color: var(--brand-gold);
            color: white;
            border-color: var(--brand-gold);
        }

        /* Credentials Section */
        .vault-section {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--brand-gold);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--brand-gold);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--brand-gold-hover);
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CM Browser</h1>
        <p>Quick-Access Portal & Client Vault</p>
    </div>

    <div class="container">
        <div class="bookmarks-section">
            <h2>Government Portals</h2>
            <div class="grid">
                <a href="https://services.gst.gov.in/services/login" target="_blank" class="bookmark-btn">GST Portal</a>
                <a href="https://eportal.incometax.gov.in/iec/foservices/#/login" target="_blank" class="bookmark-btn">Income Tax</a>
                <a href="https://unifiedportal-emp.epfindia.gov.in/epfo/" target="_blank" class="bookmark-btn">EPF (Employer)</a>
                <a href="https://www.esic.in/ESICInsurance1/ESICInsurancePortal/PortalLogin.aspx" target="_blank" class="bookmark-btn">ESI Portal</a>
                <a href="https://udyamregistration.gov.in/" target="_blank" class="bookmark-btn">Udyam Registration</a>
                <a href="https://ipindiaonline.gov.in/eregister/eregister.aspx" target="_blank" class="bookmark-btn">Trademark Search</a>
                <a href="https://kswift.kerala.gov.in/" target="_blank" class="bookmark-btn">K-SWIFT (Kerala)</a>
            </div>
        </div>

        <div class="vault-section">
            <h2>Client Vault</h2>
            
            <div class="form-group">
                <label for="client-select">Select Client Profile:</label>
                <select id="client-select" onchange="loadProfile()">
                    <option value="">-- Select a Client --</option>
                </select>
            </div>

            <hr>

            <div class="form-group">
                <label for="profile-name">Client / Profile Name</label>
                <input type="text" id="profile-name" placeholder="e.g., Client A - GST">
            </div>
            
            <div class="form-group">
                <label for="username">Username / ID</label>
                <input type="text" id="username">
                <div class="action-row">
                    <button onclick="copyToClipboard('username')">Copy ID</button>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password">
                <div class="action-row">
                    <button onclick="copyToClipboard('password')">Copy Pass</button>
                </div>
            </div>

            <button onclick="saveProfile()" style="margin-top: 15px;">Save / Update Profile</button>
        </div>
    </div>

    <script>
        // Initialize local storage array
        let profiles = JSON.parse(localStorage.getItem('cm_profiles')) || [];

        function updateDropdown() {
            const select = document.getElementById('client-select');
            select.innerHTML = '<option value="">-- Select a Client --</option>';
            profiles.forEach((profile, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = profile.name;
                select.appendChild(option);
            });
        }

        function saveProfile() {
            const name = document.getElementById('profile-name').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!name || !user || !pass) {
                alert("Please fill in all fields.");
                return;
            }

            // Check if updating existing or adding new
            const select = document.getElementById('client-select');
            if (select.value !== "") {
                profiles[select.value] = { name, user, pass };
            } else {
                profiles.push({ name, user, pass });
            }

            localStorage.setItem('cm_profiles', JSON.stringify(profiles));
            updateDropdown();
            alert("Profile saved locally!");
        }

        function loadProfile() {
            const select = document.getElementById('client-select');
            if (select.value === "") {
                document.getElementById('profile-name').value = "";
                document.getElementById('username').value = "";
                document.getElementById('password').value = "";
                return;
            }
            const profile = profiles[select.value];
            document.getElementById('profile-name').value = profile.name;
            document.getElementById('username').value = profile.user;
            document.getElementById('password').value = profile.pass;
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied to clipboard!");
            });
        }

        // Run on load
        updateDropdown();
    </script>
</body>
</html>
