<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Calc | Light Edition</title>
    <style>
        :root {
            --bg-color: #F1F5F9;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --brand-accent: #00D1FF; /* CM Biz Blue */
            --btn-num: #F8FAFC;
            --btn-op: #F1F5F9;
            --btn-text: #475569;
            --border: #E2E8F0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .calc-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 380px;
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .brand-header {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--brand-accent);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .display {
            background: #F8FAFC;
            padding: 20px;
            border-radius: 16px;
            text-align: right;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        #prev-op {
            font-size: 0.9rem;
            color: #94A3B8;
            height: 1.2em;
            margin-bottom: 4px;
        }

        #result {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: 1px solid var(--border);
            outline: none;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s ease;
            color: var(--btn-text);
            background: var(--btn-num);
        }

        button:active, button.active {
            transform: scale(0.92);
            background: #E2E8F0;
        }

        .btn-op {
            background: var(--btn-op);
            color: var(--brand-accent);
        }

        .btn-equals {
            background: var(--brand-accent);
            color: #FFFFFF;
            grid-column: span 2;
            border: none;
        }

        .btn-clear {
            color: #EF4444;
        }

        @media (hover: hover) {
            button:hover {
                border-color: var(--brand-accent);
            }
        }
    </style>
</head>
<body>

<div class="calc-card">
    <div class="brand-header">CM CALC</div>
    
    <div class="display">
        <div id="prev-op"></div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="btn-clear" id="key-Escape" onclick="clearDisplay()">C</button>
        <button class="btn-op" id="key-/" onclick="appendOp('/')">÷</button>
        <button class="btn-op" id="key-*" onclick="appendOp('*')">×</button>
        <button class="btn-op" id="key-Backspace" onclick="deleteLast()">⌫</button>
        
        <button id="key-7" onclick="appendNum('7')">7</button>
        <button id="key-8" onclick="appendNum('8')">8</button>
        <button id="key-9" onclick="appendNum('9')">9</button>
        <button class="btn-op" id="key--" onclick="appendOp('-')">−</button>
        
        <button id="key-4" onclick="appendNum('4')">4</button>
        <button id="key-5" onclick="appendNum('5')">5</button>
        <button id="key-6" onclick="appendNum('6')">6</button>
        <button class="btn-op" id="key-+" onclick="appendOp('+')">+</button>
        
        <button id="key-1" onclick="appendNum('1')">1</button>
        <button id="key-2" onclick="appendNum('2')">2</button>
        <button id="key-3" onclick="appendNum('3')">3</button>
        <button id="key-." onclick="appendNum('.')">.</button>
        
        <button id="key-0" onclick="appendNum('0')">0</button>
        <button class="btn-equals" id="key-Enter" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = '';
    const resultDisplay = document.getElementById('result');
    const prevDisplay = document.getElementById('prev-op');

    function updateDisplay() {
        resultDisplay.innerText = currentInput;
        prevDisplay.innerText = previousInput;
    }

    function appendNum(num) {
        if (currentInput === '0' && num !== '.') currentInput = num;
        else {
            if (num === '.' && currentInput.includes('.')) return;
            currentInput += num;
        }
        updateDisplay();
    }

    function appendOp(op) {
        if (currentInput === '') return;
        previousInput = currentInput + " " + op;
        currentInput = '0';
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = '';
        updateDisplay();
    }

    function deleteLast() {
        if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
        else currentInput = '0';
        updateDisplay();
    }

    function calculate() {
        try {
            let res = eval(previousInput + currentInput);
            currentInput = Number.isInteger(res) ? res.toString() : res.toFixed(4).replace(/\.?0+$/, "");
            previousInput = '';
            updateDisplay();
        } catch (e) {
            currentInput = "Error";
            updateDisplay();
        }
    }

    // Keyboard Support logic
    window.addEventListener('keydown', (e) => {
        let key = e.key;
        if (key === 'Enter') calculate();
        if (key === 'Backspace') deleteLast();
        if (key === 'Escape') clearDisplay();
        if (/[0-9.]/.test(key)) appendNum(key);
        if (['+', '-', '*', '/'].test(key)) appendOp(key);

        // Visual feedback for keys
        const btn = document.getElementById(`key-${key}`);
        if (btn) {
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        }
    });
</script>

</body>
</html>
