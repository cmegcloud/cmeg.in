<!doctype html>
<html lang="en" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CM BIZ - Enterprise Resource Planning</title>
  
  <meta name="theme-color" content="#5453EC">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { max-width: 100vw; overflow-x: hidden; }
    .sidebar-transition { transition: transform 0.3s ease-in-out; }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    input:focus, select:focus { border-color: #5453EC !important; outline: none; box-shadow: 0 0 0 2px rgba(84, 83, 236, 0.2); }
    .nav-active { background: linear-gradient(135deg, #5453EC, #6B63FF); color: white !important; box-shadow: 0 8px 16px rgba(84, 83, 236, 0.3); }
    .nav-inactive { color: #94a3b8; }
    .nav-inactive:hover { background: rgba(255, 255, 255, 0.05); color: white; }
    .loader { border: 3px solid rgba(84, 83, 236, 0.2); border-top: 3px solid #5453EC; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="h-full bg-slate-50 overflow-hidden w-full relative">
  <div id="app" class="h-full flex w-full relative overflow-hidden">
    
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden lg:hidden opacity-0 transition-opacity" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="sidebar-transition bg-slate-900 h-full w-72 flex flex-col shadow-2xl fixed lg:relative z-50 transform -translate-x-full lg:translate-x-0 shrink-0">
      <div class="p-6 border-b border-slate-700/50 flex items-center gap-3 shrink-0">
        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center font-bold text-[#5453EC] text-xl shadow-lg">CM</div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight leading-tight">CM BIZ</h1>
          <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Enterprise ERP</p>
        </div>
      </div>
      
      <nav class="flex-1 px-4 py-6 overflow-y-auto w-full">
        <ul class="space-y-2 w-full">
            <li><button onclick="switchTab('Dashboard')" class="nav-btn nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">Dashboard</span></button></li>
            <li><button onclick="switchTab('CLIENTS')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">CLIENTS</span></button></li>
            <li><button onclick="switchTab('TASKS')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">TASKS</span></button></li>
            <li><button onclick="switchTab('USER CREDENTIALS')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">CREDENTIALS</span></button></li>
            <li><button onclick="switchTab('TRANSACTIONS')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">TRANSACTIONS</span></button></li>
            <li><button onclick="switchTab('LEDGERS')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">LEDGERS</span></button></li>
            <li><button onclick="switchTab('INVOICE')" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">INVOICE</span></button></li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 h-full flex flex-col relative min-w-0 bg-slate-50">
      
      <header class="bg-white shadow-sm border-b border-slate-200 px-4 py-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-600 lg:hidden"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg></button>
          <h2 id="page-title" class="text-xl font-bold text-slate-800 truncate">Dashboard</h2>
        </div>
        
        <button onclick="syncAllData()" class="px-4 py-2 rounded-xl bg-indigo-50 text-[#5453EC] font-bold flex items-center gap-2 shadow-sm hover:bg-indigo-100">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <span class="text-sm hidden sm:block">Sync Cloud</span>
        </button>
      </header>

      <div class="flex-1 overflow-y-auto p-4 sm:p-6 w-full relative">
        
        <div id="loader" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-50/80 backdrop-blur-sm">
            <div class="flex flex-col items-center gap-3">
                <div class="loader"></div><p class="text-sm font-bold text-[#5453EC]">Syncing Database...</p>
            </div>
        </div>

        <div id="view-dashboard" class="fade-in w-full max-w-7xl mx-auto block">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h3 id="stat-clients" class="text-2xl font-bold text-slate-800">0</h3>
              <p class="text-sm text-slate-500 mt-1">Total Clients</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h3 id="stat-tasks" class="text-2xl font-bold text-slate-800">0</h3>
              <p class="text-sm text-slate-500 mt-1">Total Tasks</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h3 id="stat-transactions" class="text-2xl font-bold text-slate-800">0</h3>
              <p class="text-sm text-slate-500 mt-1">Total Transactions</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h3 id="stat-invoices" class="text-2xl font-bold text-slate-800">0</h3>
              <p class="text-sm text-slate-500 mt-1">Invoices Issued</p>
            </div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
  
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col">
    <h3 class="font-bold mb-4">Task Status</h3>
    <div class="relative w-full h-64">
      <canvas id="chart1"></canvas>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col">
    <h3 class="font-bold mb-4">Transactions Record</h3>
    <div class="relative w-full h-64">
      <canvas id="chart2"></canvas>
    </div>
  </div>

</div>

        </div>

        <div id="view-data" class="fade-in w-full max-w-7xl mx-auto hidden">
          
          <div class="flex gap-2 mb-6 p-1 bg-slate-200 rounded-xl w-fit">
              <button onclick="toggleDataView('table')" id="tab-table" class="px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#5453EC]">View Database</button>
              <button onclick="toggleDataView('form')" id="tab-form" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-600 hover:text-slate-800">Add/Edit Record</button>
          </div>

          <div id="section-form" class="hidden bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-6 pb-4 border-b">Record Editor</h2>
            
            <input type="hidden" id="editRowIndex" value="">
            <div id="dynamicForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            
            <div class="mt-8 pt-6 border-t flex justify-end gap-3">
                <button onclick="toggleDataView('table')" class="px-6 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">Cancel</button>
                <button id="submitBtn" onclick="submitData()" class="px-8 py-3 rounded-xl bg-[#5453EC] text-white font-bold text-sm shadow-lg">Save Record</button>
            </div>
          </div>

          <div id="section-table" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
             <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                 <input type="text" id="searchInput" onkeyup="searchTable()" class="w-full sm:w-72 p-2.5 text-sm border border-slate-300 rounded-xl" placeholder="Search records...">
             </div>
             <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead id="tableHead" class="bg-slate-100"></thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
             </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script>
    // ==========================================
    // NEW WEB APP URL ADDED HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCNIezXu1lNTb43z-ZZd2-l9wGrlaf2yxpUMiQUZIM_mKnCZ-Xcc9ATefs-vpyI3n2/exec"; 
    // ==========================================

    let cachedDatabase = {}; 
    let currentSheet = "Dashboard";
    let chartInstance1, chartInstance2;

    // Fetch all data on startup
    async function syncAllData() {
        document.getElementById('loader').style.display = "flex";
        try {
            const response = await fetch(WEB_APP_URL);
            cachedDatabase = await response.json();
            
            // Check if there was an error connecting to the script properly
            if(cachedDatabase.error) {
                 alert("Apps Script Error: " + cachedDatabase.error);
                 return;
            }
            
            updateDashboardStats();
            if(currentSheet !== "Dashboard") renderDataTab(currentSheet);
        } catch (e) {
            console.error(e);
            alert("Error connecting to Google Sheets. Make sure the new script (doGet for all sheets) is deployed correctly.");
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }

    // Switch between left menu tabs instantly
    function switchTab(tabName) {
        currentSheet = tabName;
        document.getElementById('page-title').innerText = tabName;
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.replace('nav-active', 'nav-inactive');
            if(btn.innerText.includes(tabName)) btn.classList.replace('nav-inactive', 'nav-active');
        });
        if (window.innerWidth < 1024) toggleSidebar();

        if (tabName === 'Dashboard') {
            document.getElementById('view-dashboard').classList.replace('hidden', 'block');
            document.getElementById('view-data').classList.replace('block', 'hidden');
            updateDashboardStats();
        } else {
            document.getElementById('view-dashboard').classList.replace('block', 'hidden');
            document.getElementById('view-data').classList.replace('hidden', 'block');
            toggleDataView('table'); // Always show table when switching tabs
            renderDataTab(tabName);
        }
    }

    // Switch between Table and Form view
    function toggleDataView(view) {
        const btnTable = document.getElementById('tab-table');
        const btnForm = document.getElementById('tab-form');
        const secTable = document.getElementById('section-table');
        const secForm = document.getElementById('section-form');

        if(view === 'table') {
            btnTable.className = "px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#5453EC]";
            btnForm.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-600 hover:text-slate-800";
            secTable.classList.remove('hidden');
            secForm.classList.add('hidden');
            document.getElementById('editRowIndex').value = ""; // Clear edit mode
            document.getElementById('submitBtn').innerText = "Save New Record";
        } else {
            btnForm.className = "px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-[#5453EC]";
            btnTable.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-600 hover:text-slate-800";
            secForm.classList.remove('hidden');
            secTable.classList.add('hidden');
        }
    }

    // Render Data Table & Form Inputs from Cache
    function renderDataTab(sheetName) {
        const sheetData = cachedDatabase[sheetName];
        
        // Handle case where sheet doesn't exist yet or is empty
        if(!sheetData || !sheetData.headers || sheetData.headers.length === 0) {
            document.getElementById('dynamicForm').innerHTML = "<p class='text-slate-500'>No columns found in this tab.</p>";
            document.getElementById('tableHead').innerHTML = "";
            document.getElementById('tableBody').innerHTML = "<tr><td class='p-8 text-center'>No data or sheet not found.</td></tr>";
            return;
        }

        // Build Form
        const formDiv = document.getElementById('dynamicForm');
        formDiv.innerHTML = "";
        sheetData.headers.forEach((header, index) => {
            if(!header) return;
            formDiv.innerHTML += `
                <div>
                    <label class="block text-[10px] font-extrabold uppercase text-slate-600 mb-2">${header}</label>
                    <input type="text" id="input_${index}" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm" ${header === "_RowNumber" ? "disabled" : ""}>
                </div>`;
        });

        // Build Table
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        let trHead = '<tr>';
        sheetData.headers.forEach(h => { if(h) trHead += `<th class="p-4 text-[10px] uppercase font-extrabold text-slate-500 whitespace-nowrap">${h}</th>` });
        trHead += `<th class="p-4 text-[10px] uppercase font-extrabold text-slate-500 sticky right-0 bg-slate-100 shadow-[-5px_0_10px_rgba(0,0,0,0.05)]">Actions</th></tr>`;
        thead.innerHTML = trHead;

        tbody.innerHTML = "";
        if(sheetData.data && sheetData.data.length > 0) {
            sheetData.data.forEach(row => {
                let trBody = '<tr class="searchable-row hover:bg-slate-50 transition-colors">';
                
                // Usually ID is in Column B (index 1) or Column A (index 0). We will pass the whole row to the delete function.
                let rowId = row[sheetData.headers[1]] || row[sheetData.headers[0]]; 
                let escapedRow = JSON.stringify(row).replace(/"/g, '&quot;'); 

                sheetData.headers.forEach(h => { if(h) trBody += `<td class="p-4 text-sm text-slate-700 whitespace-nowrap">${row[h] || "-"}</td>` });
                
                trBody += `<td class="p-4 flex gap-2 sticky right-0 bg-white shadow-[-5px_0_10px_rgba(0,0,0,0.05)]">
                    <button onclick="editRecord('${escapedRow}')" class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-200">Edit</button>
                    <button onclick="deleteRecord('${rowId}')" class="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-xs font-bold hover:bg-red-200">Del</button>
                </td></tr>`;
                tbody.innerHTML += trBody;
            });
        } else {
             tbody.innerHTML = `<tr><td colspan="${sheetData.headers.length + 1}" class="p-8 text-center text-slate-500">No records found.</td></tr>`;
        }
    }

    // Handle Edit Button Click
    function editRecord(rowJson) {
        const rowData = JSON.parse(rowJson);
        const headers = cachedDatabase[currentSheet].headers;
        
        headers.forEach((h, index) => {
            if(h && document.getElementById('input_' + index)) {
                document.getElementById('input_' + index).value = rowData[h] || "";
            }
        });
        
        document.getElementById('editRowIndex').value = rowData[headers[1]] || rowData[headers[0]]; // Set ID to update
        document.getElementById('submitBtn').innerText = "Update Record";
        toggleDataView('form');
    }

    // Handle Submit (Add or Edit)
    async function submitData() {
        const btn = document.getElementById('submitBtn');
        const isEdit = document.getElementById('editRowIndex').value !== "";
        const action = isEdit ? "edit" : "add";
        const id = document.getElementById('editRowIndex').value;
        
        btn.innerText = "Saving..."; btn.disabled = true;

        let dataArr = [];
        cachedDatabase[currentSheet].headers.forEach((h, i) => {
            if(h) {
                // If it's a new record, leave _RowNumber blank so AppSheet/Sheets can fill it if needed.
                if(h === "_RowNumber" && !isEdit) {
                    dataArr.push("");
                } else {
                    dataArr.push(document.getElementById('input_' + i).value);
                }
            }
        });

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ sheet: currentSheet, action: action, id: id, data: dataArr })
            });
            
            await syncAllData(); // Refresh local cache with new data
            toggleDataView('table'); // Go back to table view
        } catch(e) {
            alert("Error saving data.");
        } finally {
            btn.innerText = isEdit ? "Update Record" : "Save Record";
            btn.disabled = false;
        }
    }

    // Handle Delete
    async function deleteRecord(id) {
        if(!confirm(`Are you sure you want to delete record ${id}?`)) return;
        
        document.getElementById('loader').style.display = "flex";
        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ sheet: currentSheet, action: "delete", id: id })
            });
            await syncAllData(); // Refresh local cache
        } catch(e) {
            alert("Error deleting record.");
            document.getElementById('loader').style.display = "none";
        }
    }

    // Calculate real data for dashboard
    function updateDashboardStats() {
        if(!cachedDatabase['CLIENTS'] || !cachedDatabase['CLIENTS'].data) return;

        // Update Numbers
        document.getElementById('stat-clients').innerText = cachedDatabase['CLIENTS'] ? cachedDatabase['CLIENTS'].data.length : 0;
        document.getElementById('stat-tasks').innerText = cachedDatabase['TASKS'] ? cachedDatabase['TASKS'].data.length : 0;
        document.getElementById('stat-transactions').innerText = cachedDatabase['TRANSACTIONS'] ? cachedDatabase['TRANSACTIONS'].data.length : 0;
        document.getElementById('stat-invoices').innerText = cachedDatabase['INVOICE'] ? cachedDatabase['INVOICE'].data.length : 0;

        // Chart 1: Tasks (Count status)
        let tasks = cachedDatabase['TASKS'] ? cachedDatabase['TASKS'].data : [];
        let taskStatus = {};
        tasks.forEach(t => { 
            let status = t['Status of Task'] || t['Status'] || 'Other';
            taskStatus[status] = (taskStatus[status] || 0) + 1; 
        });

        if(chartInstance1) chartInstance1.destroy();
        chartInstance1 = new Chart(document.getElementById('chart1'), {
            type: 'doughnut',
            data: { 
                labels: Object.keys(taskStatus).length > 0 ? Object.keys(taskStatus) : ['No Data'], 
                datasets: [{ 
                    data: Object.values(taskStatus).length > 0 ? Object.values(taskStatus) : [1], 
                    backgroundColor: ['#5453EC', '#10b981', '#f59e0b', '#cbd5e1'] 
                }] 
            },
            options: { maintainAspectRatio: false }
        });

        // Chart 2: Transactions
        let trans = cachedDatabase['TRANSACTIONS'] ? cachedDatabase['TRANSACTIONS'].data : [];
        let transCounts = { "Receipt": 0, "Payment": 0, "Other": 0 };
        trans.forEach(t => {
            let type = t['Voucher Type'] || t['Type'] || 'Other';
            if(type.toLowerCase().includes('receipt')) transCounts["Receipt"]++;
            else if(type.toLowerCase().includes('payment')) transCounts["Payment"]++;
            else transCounts["Other"]++;
        });

        if(chartInstance2) chartInstance2.destroy();
        chartInstance2 = new Chart(document.getElementById('chart2'), {
            type: 'bar',
            data: { 
                labels: Object.keys(transCounts), 
                datasets: [{ 
                    label: 'Voucher Count', 
                    data: Object.values(transCounts), 
                    backgroundColor: '#5453EC' 
                }] 
            },
            options: { maintainAspectRatio: false }
        });
    }

    // Table Search Filter
    function searchTable() {
        const filter = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < rows.length; i++) {
            let text = rows[i].textContent.toLowerCase();
            rows[i].style.display = text.includes(filter) ? "" : "none";
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    }

    // Start App
    window.onload = syncAllData;
  </script>
</body>
</html>
