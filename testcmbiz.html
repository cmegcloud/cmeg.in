<!doctype html>

<html lang="en" class="h-full w-full">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>CM BIZ - Enterprise Resource Planning</title>

  

  <meta name="theme-color" content="#5453EC">

  

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <script>

    tailwind.config = {

      darkMode: 'class',

      theme: { extend: { colors: { primary: '#5453EC' } } }

    }

  </script>

  

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  

  <style>

    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body { max-width: 100vw; overflow-x: hidden; }

    .sidebar-transition { transition: transform 0.3s ease-in-out; }

    .fade-in { animation: fadeIn 0.4s ease forwards; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 6px; height: 6px; }

    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .dark ::-webkit-scrollbar-thumb { background: #475569; }

    input:focus, select:focus { border-color: #5453EC !important; outline: none; box-shadow: 0 0 0 2px rgba(84, 83, 236, 0.2); }

    .nav-active { background: linear-gradient(135deg, #5453EC, #6B63FF); color: white !important; box-shadow: 0 8px 16px rgba(84, 83, 236, 0.3); }

    .nav-inactive { color: #94a3b8; }

    .nav-inactive:hover { background: rgba(255, 255, 255, 0.05); color: white; }

    .dark .nav-inactive { color: #64748b; }

    .dark .nav-inactive:hover { background: rgba(255, 255, 255, 0.1); color: white; }

    .loader { border: 3px solid rgba(84, 83, 236, 0.2); border-top: 3px solid #5453EC; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  </style>

</head>

<body class="h-full bg-slate-50 dark:bg-slate-900 overflow-hidden w-full relative transition-colors duration-200">

  <div id="app" class="h-full flex w-full relative overflow-hidden">

    

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden lg:hidden opacity-0 transition-opacity" onclick="toggleSidebar()"></div>



    <aside id="sidebar" class="sidebar-transition bg-slate-900 dark:bg-slate-950 h-full w-72 flex flex-col shadow-2xl fixed lg:relative z-50 transform -translate-x-full lg:translate-x-0 shrink-0">

      <div class="p-6 border-b border-slate-700/50 flex items-center gap-3 shrink-0">

        <img src="logocmbiz.png" alt="CM Biz Logo" class="w-12 h-12 rounded-xl bg-white shadow-lg object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

        <div class="w-12 h-12 rounded-xl bg-white hidden items-center justify-center font-bold text-[#5453EC] text-xl shadow-lg">CM</div>

        <div>

          <h1 class="text-xl font-bold text-white tracking-tight leading-tight">CM BIZ</h1>

          <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Enterprise ERP</p>

        </div>

      </div>

      

      <nav class="flex-1 px-4 py-6 overflow-y-auto w-full">

        <ul id="nav-list" class="space-y-2 w-full">

            </ul>

      </nav>

    </aside>



    <main class="flex-1 h-full flex flex-col relative min-w-0 bg-slate-50 dark:bg-slate-900 transition-colors duration-200">

      

      <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 px-4 py-4 flex items-center justify-between z-10 shrink-0">

        <div class="flex items-center gap-3">

          <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 lg:hidden hover:bg-slate-100 dark:hover:bg-slate-700">

            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>

          </button>

          <h2 id="page-title" class="text-xl font-bold text-slate-800 dark:text-white truncate uppercase">Dashboard</h2>

        </div>

        

        <div class="flex items-center gap-3">

          <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-yellow-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">

            <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />

            </svg>

          </button>



          <button onclick="syncAllData()" class="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-[#5453EC] dark:text-indigo-400 font-bold flex items-center gap-2 shadow-sm hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors">

              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>

              <span class="text-sm hidden sm:block">Sync Cloud</span>

          </button>

        </div>

      </header>



      <div class="flex-1 overflow-y-auto p-4 sm:p-6 w-full relative">

        

        <div id="loader" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-sm">

            <div class="flex flex-col items-center gap-3">

                <div class="loader"></div><p class="text-sm font-bold text-[#5453EC] dark:text-indigo-400">Syncing Database...</p>

            </div>

        </div>



        <div id="view-dashboard" class="fade-in w-full max-w-7xl mx-auto block">

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">

              <h3 id="stat-clients" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>

              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Total Clients</p>

            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">

              <h3 id="stat-tasks" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>

              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Total Tasks</p>

            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">

              <h3 id="stat-transactions" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>

              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Total Transactions</p>

            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">

              <h3 id="stat-invoices" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>

              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Invoices Issued</p>

            </div>

          </div>

          

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col">

              <h3 class="font-bold mb-4 dark:text-white">Task Status</h3>

              <div class="relative w-full h-64">

                <canvas id="chart1"></canvas>

              </div>

            </div>



            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col">

              <h3 class="font-bold mb-4 dark:text-white">Transactions Record</h3>

              <div class="relative w-full h-64">

                <canvas id="chart2"></canvas>

              </div>

            </div>

          </div>

        </div>



        <div id="view-data" class="fade-in w-full max-w-7xl mx-auto hidden">

          

          <div class="flex gap-2 mb-6 p-1 bg-slate-200 dark:bg-slate-800 rounded-xl w-fit">

              <button onclick="toggleDataView('table')" id="tab-table" class="px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-700 shadow-sm text-[#5453EC] dark:text-indigo-400">View Database</button>

              <button onclick="toggleDataView('form')" id="tab-form" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white">Add/Edit Record</button>

          </div>



          <div id="section-form" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 dark:border-slate-700">

            <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-6 pb-4 border-b dark:border-slate-700">Record Editor</h2>

            

            <input type="hidden" id="editRowIndex" value="">

            <div id="dynamicForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

            

            <div class="mt-8 pt-6 border-t dark:border-slate-700 flex justify-end gap-3">

                <button onclick="toggleDataView('table')" class="px-6 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-600">Cancel</button>

                <button id="submitBtn" onclick="submitData()" class="px-8 py-3 rounded-xl bg-[#5453EC] text-white font-bold text-sm shadow-lg hover:bg-indigo-600">Save Record</button>

            </div>

          </div>



          <div id="section-table" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">

             <div class="p-4 border-b dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex justify-between items-center">

                 <input type="text" id="searchInput" onkeyup="searchGlobalTable()" class="w-full sm:w-72 p-2.5 text-sm border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-xl" placeholder="Global search records...">

             </div>

             

             <div class="overflow-x-auto w-full">

                <table class="w-full text-left border-collapse min-w-[600px]">

                    <thead id="tableHead" class="bg-slate-100 dark:bg-slate-900"></thead>

                    <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>

                </table>

             </div>



             <div id="pagination-controls" class="p-4 border-t dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex justify-between items-center text-sm">

                 <button onclick="prevPage()" id="btn-prev" class="px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-600 dark:text-slate-300 font-bold disabled:opacity-50 disabled:cursor-not-allowed shadow-sm hover:bg-slate-100 dark:hover:bg-slate-600">Previous</button>

                 <span id="page-indicator" class="text-slate-600 dark:text-slate-400 font-medium">Page 1 of 1</span>

                 <button onclick="nextPage()" id="btn-next" class="px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-600 dark:text-slate-300 font-bold disabled:opacity-50 disabled:cursor-not-allowed shadow-sm hover:bg-slate-100 dark:hover:bg-slate-600">Next</button>

             </div>

          </div>



        </div>

      </div>

    </main>

  </div>



  <script>

    // ==========================================

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzG9J3_w8SaTkwi-mOgaPtJd-HEf40wZ-eWl_cO635ZjxErmi35qSkgte9XGwd-uHoW/exec"; 

    // ==========================================



    let cachedDatabase = {}; 

    let currentSheet = "Dashboard";

    let chartInstance1, chartInstance2;

    let dropdownOptions = {}; 



    // Pagination Variables

    let currentPage = 1;

    let rowsPerPage = 50;

    let currentFilteredData = []; // Holds the active dataset (filtered or unfiltered)



    // Load Theme Preference on startup

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {

        document.documentElement.classList.add('dark');

        updateThemeIcon(true);

    } else {

        document.documentElement.classList.remove('dark');

        updateThemeIcon(false);

    }



    function toggleTheme() {

        const isDark = document.documentElement.classList.toggle('dark');

        localStorage.setItem('theme', isDark ? 'dark' : 'light');

        updateThemeIcon(isDark);

        updateDashboardStats(); 

    }



    function updateThemeIcon(isDark) {

        const icon = document.getElementById('theme-icon');

        if (isDark) {

            icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;

        } else {

            icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;

        }

    }



    async function syncAllData() {

        document.getElementById('loader').style.display = "flex";

        try {

            const response = await fetch(WEB_APP_URL);

            cachedDatabase = await response.json();

            

            if(cachedDatabase.error) {

                 alert("Apps Script Error: " + cachedDatabase.error);

                 return;

            }

            

            parseDropdowns();

            buildSidebar();

            updateDashboardStats();

            

            if(currentSheet !== "Dashboard") renderDataTab(currentSheet);

        } catch (e) {

            console.error(e);

            alert("Error connecting to Google Sheets. Check connection or web app URL.");

        } finally {

            document.getElementById('loader').style.display = "none";

        }

    }



    function parseDropdowns() {

        dropdownOptions = {};

        if (cachedDatabase['DROPDOWN']) {

            const dropData = cachedDatabase['DROPDOWN'];

            dropData.headers.forEach(header => {

                if(!header) return;

                dropdownOptions[header] = [];

                dropData.data.forEach(row => {

                    if(row[header] && String(row[header]).trim() !== "") {

                        dropdownOptions[header].push(row[header]);

                    }

                });

            });

        }

    }



    function buildSidebar() {

        const navList = document.getElementById('nav-list');

        navList.innerHTML = `<li><button onclick="switchTab('Dashboard')" id="nav-btn-Dashboard" class="nav-btn nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"><span class="font-bold text-sm tracking-wide">DASHBOARD</span></button></li>`;

        

        Object.keys(cachedDatabase).forEach(sheetName => {

            if (sheetName.toUpperCase() === 'DROPDOWN' || sheetName === 'error') return; 

            

            navList.innerHTML += `

            <li>

                <button onclick="switchTab('${sheetName}')" id="nav-btn-${sheetName}" class="nav-btn nav-inactive w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">

                    <span class="font-bold text-sm tracking-wide uppercase">${sheetName}</span>

                </button>

            </li>`;

        });

        

        highlightNavTab(currentSheet);

    }



    function switchTab(tabName) {

        currentSheet = tabName;

        document.getElementById('page-title').innerText = tabName;

        document.getElementById('searchInput').value = ""; // Clear global search on switch

        

        highlightNavTab(tabName);

        if (window.innerWidth < 1024) toggleSidebar();



        if (tabName === 'Dashboard') {

            document.getElementById('view-dashboard').classList.replace('hidden', 'block');

            document.getElementById('view-data').classList.replace('block', 'hidden');

            updateDashboardStats();

        } else {

            document.getElementById('view-dashboard').classList.replace('block', 'hidden');

            document.getElementById('view-data').classList.replace('hidden', 'block');

            toggleDataView('table');

            

            // Set initial data and page

            currentFilteredData = cachedDatabase[tabName] ? [...cachedDatabase[tabName].data] : [];

            currentPage = 1;

            

            renderDataTab(tabName);

        }

    }



    function highlightNavTab(tabName) {

        document.querySelectorAll('.nav-btn').forEach(btn => {

            btn.classList.replace('nav-active', 'nav-inactive');

        });

        const activeBtn = document.getElementById('nav-btn-' + tabName);

        if(activeBtn) activeBtn.classList.replace('nav-inactive', 'nav-active');

    }



    function toggleDataView(view) {

        const btnTable = document.getElementById('tab-table');

        const btnForm = document.getElementById('tab-form');

        const secTable = document.getElementById('section-table');

        const secForm = document.getElementById('section-form');



        if(view === 'table') {

            btnTable.className = "px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-700 shadow-sm text-[#5453EC] dark:text-indigo-400";

            btnForm.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white";

            secTable.classList.remove('hidden');

            secForm.classList.add('hidden');

            document.getElementById('editRowIndex').value = ""; 

            document.getElementById('submitBtn').innerText = "Save New Record";

        } else {

            btnForm.className = "px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-700 shadow-sm text-[#5453EC] dark:text-indigo-400";

            btnTable.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white";

            secForm.classList.remove('hidden');

            secTable.classList.add('hidden');

        }

    }



    // Handles the setup of Headers and Form. Calls renderTableBody for actual data.

    function renderDataTab(sheetName) {

        const sheetData = cachedDatabase[sheetName];

        

        if(!sheetData || !sheetData.headers || sheetData.headers.length === 0) {

            document.getElementById('dynamicForm').innerHTML = "<p class='text-slate-500 dark:text-slate-400'>No columns found.</p>";

            document.getElementById('tableHead').innerHTML = "";

            document.getElementById('tableBody').innerHTML = "<tr><td class='p-8 text-center dark:text-slate-400'>No data found.</td></tr>";

            return;

        }



        // Build Form

        const formDiv = document.getElementById('dynamicForm');

        formDiv.innerHTML = "";

        sheetData.headers.forEach((header, index) => {

            if(!header) return;

            if (dropdownOptions[header]) {

                let optsHTML = `<option value="">Select ${header}</option>`;

                dropdownOptions[header].forEach(opt => { optsHTML += `<option value="${opt}">${opt}</option>`; });

                formDiv.innerHTML += `

                    <div>

                        <label class="block text-[10px] font-extrabold uppercase text-slate-600 dark:text-slate-400 mb-2">${header}</label>

                        <select id="input_${index}" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 dark:text-white text-sm">

                            ${optsHTML}

                        </select>

                    </div>`;

            } else {

                formDiv.innerHTML += `

                    <div>

                        <label class="block text-[10px] font-extrabold uppercase text-slate-600 dark:text-slate-400 mb-2">${header}</label>

                        <input type="text" id="input_${index}" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 dark:text-white text-sm" ${header === "_RowNumber" ? "disabled placeholder='Auto-generated'" : ""}>

                    </div>`;

            }

        });



        // Build Headers and Filters

        const thead = document.getElementById('tableHead');

        let trHead = '<tr>';

        let trFilter = '<tr class="bg-slate-50 dark:bg-slate-900 border-b dark:border-slate-700">'; 

        

        sheetData.headers.forEach((h, idx) => { 

            if(h) {

                trHead += `<th class="p-4 text-[10px] uppercase font-extrabold text-slate-500 dark:text-slate-400 whitespace-nowrap">${h}</th>`;

                trFilter += `<th class="p-2"><input type="text" placeholder="Filter..." class="col-filter w-full p-1.5 text-xs border border-slate-200 dark:border-slate-600 rounded bg-white dark:bg-slate-800 dark:text-white font-normal" data-col="${idx}" oninput="applyFilters()"></th>`;

            } 

        });

        

        trHead += `<th class="p-4 text-[10px] uppercase font-extrabold text-slate-500 dark:text-slate-400 sticky right-0 bg-slate-100 dark:bg-slate-900 shadow-[-5px_0_10px_rgba(0,0,0,0.05)]">Actions</th></tr>`;

        trFilter += `<th class="sticky right-0 bg-slate-50 dark:bg-slate-900 border-b dark:border-slate-700"></th></tr>`;

        

        thead.innerHTML = trHead + trFilter;



        // Render the paginated rows

        renderTableBody();

    }



    // High Performance Rendering with Pagination

    function renderTableBody() {

        const tbody = document.getElementById('tableBody');

        const sheetData = cachedDatabase[currentSheet];

        

        if(!currentFilteredData || currentFilteredData.length === 0) {

             tbody.innerHTML = `<tr><td colspan="${sheetData.headers.length + 1}" class="p-8 text-center text-slate-500 dark:text-slate-400">No records found.</td></tr>`;

             updatePaginationUI();

             return;

        }



        // Calculate Pagination

        const totalPages = Math.ceil(currentFilteredData.length / rowsPerPage);

        if (currentPage > totalPages) currentPage = totalPages;

        if (currentPage < 1) currentPage = 1;

        

        const startIndex = (currentPage - 1) * rowsPerPage;

        const endIndex = startIndex + rowsPerPage;

        const pageData = currentFilteredData.slice(startIndex, endIndex);



        // Build HTML String (String concatenation is 100x faster than innerHTML inside a loop)

        let htmlString = "";

        

        pageData.forEach(row => {

            let trBody = '<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">';

            let rowId = row[sheetData.headers[1]] || row[sheetData.headers[0]]; 

            let escapedRow = JSON.stringify(row).replace(/"/g, '&quot;'); 



            sheetData.headers.forEach(h => { 

                if(h) {

                    let cellValue = row[h] || "-";

                    let valLower = String(cellValue).toLowerCase();

                    

                    if (valLower === 'pending' || valLower === 'false') {

                        cellValue = `<span class="bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400 px-2.5 py-1 rounded-md font-bold text-xs inline-block">${valLower === 'false' ? 'Incomplete' : 'Pending'}</span>`;

                    } else if (valLower === 'completed' || valLower === 'true') {

                        cellValue = `<span class="bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400 px-2.5 py-1 rounded-md font-bold text-xs inline-block">${valLower === 'true' ? 'Completed' : 'Completed'}</span>`;

                    }

                    

                    htmlString += `<td class="p-4 text-sm text-slate-700 dark:text-slate-300 whitespace-nowrap">${cellValue}</td>`;

                }

            });

            

            htmlString += `<td class="p-4 flex gap-2 sticky right-0 bg-white dark:bg-slate-800 shadow-[-5px_0_10px_rgba(0,0,0,0.05)] dark:shadow-[-5px_0_10px_rgba(0,0,0,0.3)] border-l border-transparent dark:border-slate-700">

                <button onclick="editRecord('${escapedRow}')" class="px-3 py-1.5 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-bold hover:bg-blue-200 dark:hover:bg-blue-900/50">Edit</button>

                <button onclick="deleteRecord('${rowId}')" class="px-3 py-1.5 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg text-xs font-bold hover:bg-red-200 dark:hover:bg-red-900/50">Del</button>

            </td></tr>`;

        });



        // Write to DOM exactly once

        tbody.innerHTML = htmlString;

        updatePaginationUI(totalPages);

    }



    // Pagination Logic

    function updatePaginationUI(totalPages = 1) {

        document.getElementById('page-indicator').innerText = `Page ${currentPage} of ${totalPages || 1} (${currentFilteredData.length} records)`;

        document.getElementById('btn-prev').disabled = currentPage === 1;

        document.getElementById('btn-next').disabled = currentPage === totalPages || totalPages === 0;

    }



    function nextPage() { currentPage++; renderTableBody(); }

    function prevPage() { currentPage--; renderTableBody(); }



    // High Performance Array Filtering (instead of DOM hiding)

    function applyFilters() {

        const globalFilter = document.getElementById("searchInput").value.toLowerCase();

        const colInputs = document.querySelectorAll('.col-filter');

        const sheetData = cachedDatabase[currentSheet];

        const headers = sheetData.headers;

        

        // Reset to full array, then filter down

        currentFilteredData = sheetData.data.filter(row => {

            // 1. Global Search Check

            let passesGlobal = globalFilter === "";

            if (!passesGlobal) {

                // Combine all object values to string to search

                const rowString = Object.values(row).join(" ").toLowerCase();

                passesGlobal = rowString.includes(globalFilter);

            }

            if (!passesGlobal) return false;



            // 2. Column Filters Check

            for (let input of colInputs) {

                const searchVal = input.value.toLowerCase();

                if (searchVal !== "") {

                    const colIndex = parseInt(input.getAttribute('data-col'));

                    const headerName = headers[colIndex];

                    const cellVal = String(row[headerName] || "").toLowerCase();

                    if (!cellVal.includes(searchVal)) {

                        return false; // Failed this column filter

                    }

                }

            }

            return true; 

        });



        currentPage = 1;

        renderTableBody();

    }



    // Proxy for Global search to reuse same fast filter logic

    function searchGlobalTable() {

        applyFilters();

    }



    function editRecord(rowJson) {

        const rowData = JSON.parse(rowJson);

        const headers = cachedDatabase[currentSheet].headers;

        

        headers.forEach((h, index) => {

            if(h && document.getElementById('input_' + index)) {

                document.getElementById('input_' + index).value = rowData[h] || "";

            }

        });

        

        document.getElementById('editRowIndex').value = rowData[headers[1]] || rowData[headers[0]]; 

        document.getElementById('submitBtn').innerText = "Update Record";

        toggleDataView('form');

    }



    async function submitData() {

        const btn = document.getElementById('submitBtn');

        const isEdit = document.getElementById('editRowIndex').value !== "";

        const action = isEdit ? "edit" : "add";

        const id = document.getElementById('editRowIndex').value;

        

        btn.innerText = "Saving..."; btn.disabled = true;



        let dataArr = [];

        cachedDatabase[currentSheet].headers.forEach((h, i) => {

            if(h) {

                if(h === "_RowNumber" && !isEdit) {

                    dataArr.push("");

                } else {

                    dataArr.push(document.getElementById('input_' + i).value);

                }

            }

        });



        try {

            await fetch(WEB_APP_URL, {

                method: "POST",

                body: JSON.stringify({ sheet: currentSheet, action: action, id: id, data: dataArr })

            });

            await syncAllData(); 

            toggleDataView('table'); 

        } catch(e) {

            alert("Error saving data.");

        } finally {

            btn.innerText = isEdit ? "Update Record" : "Save Record";

            btn.disabled = false;

        }

    }



    async function deleteRecord(id) {

        if(!confirm(`Are you sure you want to delete record ${id}?`)) return;

        

        document.getElementById('loader').style.display = "flex";

        try {

            await fetch(WEB_APP_URL, {

                method: "POST",

                body: JSON.stringify({ sheet: currentSheet, action: "delete", id: id })

            });

            await syncAllData(); 

        } catch(e) {

            alert("Error deleting record.");

            document.getElementById('loader').style.display = "none";

        }

    }



    function updateDashboardStats() {

        const isDark = document.documentElement.classList.contains('dark');

        const textColor = isDark ? '#cbd5e1' : '#64748b'; 

        const gridColor = isDark ? '#334155' : '#e2e8f0'; 



        const findSheet = (name) => {

            let key = Object.keys(cachedDatabase).find(k => k.toUpperCase() === name.toUpperCase());

            return cachedDatabase[key] ? cachedDatabase[key].data : [];

        };



        const clientData = findSheet('CLIENTS');

        const taskData = findSheet('TASKS');

        const transData = findSheet('TRANSACTIONS');

        const invoiceData = findSheet('INVOICE');



        document.getElementById('stat-clients').innerText = clientData.length;

        document.getElementById('stat-tasks').innerText = taskData.length;

        document.getElementById('stat-transactions').innerText = transData.length;

        document.getElementById('stat-invoices').innerText = invoiceData.length;



        let taskStatus = {};

        taskData.forEach(t => { 

            let status = t['Status of Task'] || t['Status'] || 'Other';

            taskStatus[status] = (taskStatus[status] || 0) + 1; 

        });



        if(chartInstance1) chartInstance1.destroy();

        chartInstance1 = new Chart(document.getElementById('chart1'), {

            type: 'doughnut',

            data: { 

                labels: Object.keys(taskStatus).length > 0 ? Object.keys(taskStatus) : ['No Data'], 

                datasets: [{ 

                    data: Object.values(taskStatus).length > 0 ? Object.values(taskStatus) : [1], 

                    backgroundColor: ['#5453EC', '#10b981', '#ef4444', '#cbd5e1'],

                    borderColor: isDark ? '#1e293b' : '#ffffff',

                    borderWidth: 2

                }] 

            },

            options: { 

                maintainAspectRatio: false,

                plugins: { legend: { labels: { color: textColor } } }

            }

        });



        let transCounts = { "Receipt": 0, "Payment": 0, "Other": 0 };

        transData.forEach(t => {

            let type = t['Voucher Type'] || t['Type'] || 'Other';

            if(type.toLowerCase().includes('receipt')) transCounts["Receipt"]++;

            else if(type.toLowerCase().includes('payment')) transCounts["Payment"]++;

            else transCounts["Other"]++;

        });



        if(chartInstance2) chartInstance2.destroy();

        chartInstance2 = new Chart(document.getElementById('chart2'), {

            type: 'bar',

            data: { 

                labels: Object.keys(transCounts), 

                datasets: [{ 

                    label: 'Voucher Count', 

                    data: Object.values(transCounts), 

                    backgroundColor: '#5453EC',

                    borderRadius: 4

                }] 

            },

            options: { 

                maintainAspectRatio: false,

                plugins: { legend: { labels: { color: textColor } } },

                scales: {

                    x: { ticks: { color: textColor }, grid: { display: false } },

                    y: { ticks: { color: textColor, precision: 0 }, grid: { color: gridColor } }

                }

            }

        });

    }



    function toggleSidebar() {

        const sidebar = document.getElementById('sidebar');

        const overlay = document.getElementById('sidebar-overlay');

        sidebar.classList.toggle('-translate-x-full');

        overlay.classList.toggle('hidden');

    }



    window.onload = syncAllData;

  </script>
