<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CM Experts Group - Proforma Invoice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #8B6F47;
            --primary-dark: #705836;
            --bg-color: #f4f5f7;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --border-focus: #d4a574;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); }
        body { display: flex; justify-content: center; align-items: flex-start; padding: 20px 16px; overflow-y: auto; }
        .container { background: var(--surface); border-radius: 20px; padding: 36px 28px; max-width: 500px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo-img { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 10px; display: block; }
        h1 { font-size: 22px; color: var(--text-main); margin-bottom: 4px; font-weight: 700; }
        .subtitle { font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .detail-group { display: flex; flex-direction: column; }
        .detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        .detail-value { width: 100%; border: none; border-bottom: 1px dashed var(--border-focus); background: transparent; padding: 6px 0; font-size: 14px; font-weight: 600; color: var(--text-main); }
        select.detail-value { appearance: none; -webkit-appearance: none; cursor: pointer; }
        .detail-value:focus { outline: none; border-bottom: 1px solid var(--primary); }
        textarea.detail-value { border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 13px; min-height: 50px; }
        .services-section { background: #fafafa; border-radius: 12px; padding: 16px; margin-bottom: 24px; border: 1px solid var(--border); }
        .service-item { padding: 12px 0; border-bottom: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }
        .service-item:last-child { border-bottom: none; }
        .service-row { display: flex; gap: 8px; align-items: center; }
        .service-input { font-size: 13px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; width: 100%; }
        .doc-toggle { font-size: 11px; background: #eee; padding: 6px; border-radius: 6px; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .btn-add-service { width: 100%; margin-top: 12px; background: transparent; color: var(--primary); border: 1px dashed var(--primary); padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        /* ADJUSTED SUMMARY STYLES for tighter gaps */
        .summary-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; margin-bottom: 24px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; font-weight: 600; align-items: center; }
        .summary-input { width: 80px; text-align: right; border: 1px solid var(--border); border-radius: 4px; padding: 4px; }
        .total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--primary); font-size: 18px; font-weight: 700; color: var(--primary); }
        
        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: var(--text-main); border: 1px solid var(--border); }
        body.client-mode .admin-only { display: none !important; }
        .client-only { display: none; }
        body.client-mode .client-only { display: flex !important; }
        body.client-mode .detail-value, body.client-mode .summary-input, body.client-mode .service-input { pointer-events: none; border: none !important; background: transparent !important; }
    </style>
</head>
<body>

<div class="container" id="loginContainer" style="display: none;">
    <div class="header">
        <img src="logocmeg.png" alt="CM Experts Group" class="logo-img">
        <h1>CM Experts Group</h1>
        <p class="subtitle">Secure PIN Entry</p>
    </div>
    <div class="detail-group">
        <input type="password" inputmode="numeric" id="passwordInput" class="detail-value" placeholder="••••" style="text-align: center; font-size: 28px; letter-spacing: 12px;" onkeypress="handleLoginKeyPress(event)">
    </div>
    <div id="loginError" style="color:red; text-align:center; display:none; margin:10px;">Invalid PIN</div>
    <button class="action-btn btn-primary" onclick="processLogin()">Unlock</button>
</div>

<div class="container" id="appContainer" style="display: none;">
    <div class="header">
        <img src="logocmeg.png" alt="CM Experts Group" class="logo-img">
        <h1>CM Experts Group</h1>
        </div>

    <div class="details-grid">
        <div class="detail-group">
            <span class="detail-label">Client Name</span>
            <input type="text" id="client" list="clientList" class="detail-value" placeholder="Type or select..." onchange="updateClientId()">
            <datalist id="clientList"></datalist>
        </div>
        <div class="detail-group">
            <span class="detail-label">Client ID</span>
            <input type="text" id="clientId" class="detail-value" placeholder="Auto-fills...">
        </div>
        <div class="detail-group">
            <span class="detail-label">Invoice ID</span>
            <input type="text" id="invoiceId" class="detail-value">
        </div>
        <div class="detail-group admin-only">
            <span class="detail-label">Client Mobile</span>
            <input type="tel" id="clientMobile" value="9895470148" class="detail-value">
        </div>
        <div class="detail-group">
            <span class="detail-label">Invoice Date</span>
            <input type="date" id="invoiceDate" class="detail-value">
        </div>
        <div class="detail-group">
            <span class="detail-label">Due Date</span>
            <input type="date" id="dueDate" class="detail-value">
        </div>
    </div>

    <div class="services-section">
        <div class="detail-label" style="font-size:13px; margin-bottom:10px;">Service Details</div>
        <div id="servicesList"></div>
        <button class="btn-add-service admin-only" onclick="addService()">+ Add Service Item</button>
    </div>

    <div class="summary-section">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotalDisplay">₹0.00</span>
        </div>
        <div class="summary-row">
            <span>Adjustments (₹):</span>
            <input type="number" id="adjustments" class="summary-input" value="0" onchange="calculateTotals()">
        </div>
        <div class="summary-row">
            <span>Advance Received (₹):</span>
            <input type="number" id="advance" class="summary-input" value="0" onchange="calculateTotals()">
        </div>
        <div class="total-row">
            <span>Grand Total:</span>
            <span id="grandTotalDisplay">₹0.00</span>
        </div>
        <div id="totalWords" style="font-size:11px; text-align:right; margin-top:4px; color:var(--text-muted);"></div>
    </div>

    <div class="button-group">
        <button class="action-btn btn-primary admin-only" onclick="sendPaymentLink()">Send WhatsApp Link</button>
        <button class="action-btn btn-primary client-only" onclick="payViaUPI()">Pay Now via UPI</button>
        <button class="action-btn btn-secondary" onclick="downloadInvoice()">Download PDF Invoice</button>
    </div>
</div>

<script>
    // ==========================================
    const HOSTED_PORTAL_URL = "https://cmeg.in/invoice"; 
    
    // LIVE GITHUB JSON PATH IS ALREADY SET HERE:
    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/clients.json"; 
    // ==========================================

    const urlParams = new URLSearchParams(window.location.search);
    const isClientMode = urlParams.get("mode") === "client";
    
    const serviceCatalog = {
        "GST Return": { type: "ret", docs: "" },
        "GST Registration": { type: "reg", docs: "PAN, Aadhaar, Photo, Electricity Bill, Cancelled Cheque" },
        "Income Tax Return": { type: "ret", docs: "" },
        "MSME Registration": { type: "reg", docs: "Aadhaar Card, PAN Card, Bank Details" },
        "Company Incorporation": { type: "reg", docs: "PAN, Aadhaar, DIN, Digital Signature, Address Proof" },
        "PAN/TAN Application": { type: "reg", docs: "ID Proof, Address Proof, Photo" },
        "Other Consultancy": { type: "other", docs: "" }
    };

    let services = [];
    let clientDatabase = {};
    
    // Safe parameter loading with fallbacks
    try {
        const sNamesParam = urlParams.get("snames");
        if (sNamesParam) {
            const names = sNamesParam.split('|');
            const ids = (urlParams.get("sids") || "").split('|');
            const periods = (urlParams.get("spers") || "").split('|');
            const amts = (urlParams.get("samts") || "").split('|');
            const docs = (urlParams.get("sdocs") || "").split('|');
            
            names.forEach((n, i) => services.push({ 
                id: i+1, name: n, sId: ids[i]||'', period: periods[i]||'', amount: parseFloat(amts[i])||0, showDocs: docs[i]||'no' 
            }));
        } else {
            services.push({ id: 1, name: "GST Return", sId: "—", period: "Dec-2025", amount: 1500, showDocs: 'no' });
        }

        if (isClientMode) {
            document.body.classList.add('client-mode');
            document.getElementById("client").value = urlParams.get("client") || "";
            document.getElementById("clientId").value = urlParams.get("clientId") || "";
            document.getElementById("invoiceId").value = urlParams.get("id") || "";
            document.getElementById("invoiceDate").value = urlParams.get("date") || "";
            document.getElementById("dueDate").value = urlParams.get("due") || "";
            document.getElementById("adjustments").value = urlParams.get("adj") || 0;
            document.getElementById("advance").value = urlParams.get("adv") || 0;
            document.getElementById('appContainer').style.display = 'block';
        } else {
            document.getElementById('loginContainer').style.display = 'block';
            fetchClients();
            document.getElementById("invoiceId").value = `PI${String(new Date().getFullYear()).slice(-2)}4${String(new Date().getDate()).padStart(2,'0')}${String(new Date().getMonth()+1).padStart(2,'0')}`;
            document.getElementById("invoiceDate").value = new Date().toISOString().split('T')[0];
        }
    } catch (e) {
        console.error("Link malformed. Forcing app display.", e);
        document.getElementById('appContainer').style.display = 'block';
    }

    async function fetchClients() {
        try {
            const res = await fetch(GITHUB_JSON_URL);
            const data = await res.json();
            const list = document.getElementById("clientList");
            
            data.forEach(client => {
                let cName = client["Client Name"] || client["clientName"] || client["name"];
                let cId = client["Client ID"] || client["clientId"] || client["id"] || "—";
                if (cName) {
                    clientDatabase[cName] = cId;
                    list.appendChild(new Option(cName, cName));
                }
            });
        } catch(e) { console.warn("Failed to load clients.json from GitHub."); }
    }

    function updateClientId() {
        const val = document.getElementById("client").value;
        if(clientDatabase[val]) document.getElementById("clientId").value = clientDatabase[val];
    }

    function processLogin() {
        if (document.getElementById('passwordInput').value === '3655') {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }
    function handleLoginKeyPress(e) { if (e.key === 'Enter') processLogin(); }

    function renderServices() {
        const list = document.getElementById("servicesList");
        list.innerHTML = '';
        
        services.forEach(s => {
            const item = document.createElement('div');
            item.className = 'service-item';
            const catData = serviceCatalog[s.name] || { type: 'other', docs: '' };
            const isReg = catData.type === 'reg';
            
            let options = Object.keys(serviceCatalog).map(n => `<option value="${n}" ${s.name===n ? 'selected':''}>${n}</option>`).join('');
            
            item.innerHTML = `
                <div class="service-row">
                    <select class="service-input" style="flex:2;" onchange="updateSrv(${s.id}, 'name', this.value)" ${isClientMode ? 'disabled' : ''}>${options}</select>
                    ${!isClientMode ? `<button class="service-remove" onclick="removeService(${s.id})">✕</button>` : ''}
                </div>
                <div class="service-row">
                    <input type="text" class="service-input" placeholder="Service ID (e.g. —)" value="${s.sId}" onchange="updateSrv(${s.id}, 'sId', this.value)">
                    <input type="text" class="service-input" placeholder="Period (e.g. Dec-2025)" value="${s.period}" onchange="updateSrv(${s.id}, 'period', this.value)">
                    <input type="number" class="service-input" style="width:100px; text-align:right;" placeholder="Amount" value="${s.amount}" onchange="updateSrv(${s.id}, 'amount', this.value)">
                </div>
                ${isReg ? `
                    <div class="doc-toggle">
                        <span style="color:#555; font-weight:600;">Show Required Documents?</span>
                        <select onchange="updateSrv(${s.id}, 'showDocs', this.value)" style="border:1px solid #ccc; padding:2px; border-radius:4px; background:#fff;" ${isClientMode ? 'disabled' : ''}>
                            <option value="no" ${s.showDocs === 'no' ? 'selected' : ''}>No</option>
                            <option value="yes" ${s.showDocs === 'yes' ? 'selected' : ''}>Yes</option>
                        </select>
                        ${s.showDocs === 'yes' ? `<span style="color:#8B6F47; font-size:10px;">(Included in PDF)</span>` : ''}
                    </div>
                ` : ''}
            `;
            list.appendChild(item);
        });
        calculateTotals();
    }

    function updateSrv(id, field, val) { 
        const s = services.find(x => x.id === id); 
        if(s) { s[field] = field === 'amount' ? parseFloat(val)||0 : val; renderServices(); } 
    }
    
    function addService() {
        services.push({ id: Date.now(), name: "Others", sId: "—", period: "", amount: 0, showDocs: 'no' });
        renderServices();
    }
    function removeService(id) { services = services.filter(s => s.id !== id); renderServices(); }

    function calculateTotals() {
        const subtotal = services.reduce((sum, s) => sum + s.amount, 0);
        const adj = parseFloat(document.getElementById("adjustments").value) || 0;
        const adv = parseFloat(document.getElementById("advance").value) || 0;
        const grandTotal = subtotal + adj - adv;

        document.getElementById("subtotalDisplay").innerText = `₹${subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById("grandTotalDisplay").innerText = `₹${grandTotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById("totalWords").innerText = numberToWords(Math.max(0, grandTotal));
    }

    function numberToWords(num) {
        if (num === 0) return 'Rupees zero only';
        const ones = ['','one','two','three','four','five','six','seven','eight','nine'];
        const teens = ['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
        const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
        function convert(n) {
            let res = "";
            if (n >= 100) { res += ones[Math.floor(n/100)] + " hundred "; n %= 100; }
            if (n >= 20) { res += tens[Math.floor(n/10)] + " "; n %= 10; }
            if (n >= 10) { res += teens[n-10] + " "; n = 0; }
            if (n > 0) res += ones[n] + " ";
            return res.trim();
        }
        let result = "";
        let intPart = Math.floor(num);
        if (Math.floor(intPart / 10000000) > 0) { result += convert(Math.floor(intPart/10000000)) + " crore "; intPart %= 10000000; }
        if (Math.floor(intPart / 100000) > 0) { result += convert(Math.floor(intPart/100000)) + " lakh "; intPart %= 100000; }
        if (Math.floor(intPart / 1000) > 0) { result += convert(Math.floor(intPart/1000)) + " thousand "; intPart %= 1000; }
        result += convert(intPart);
        return "Rupees " + result.trim() + " only";
    }

    renderServices();

    function formatPD(dateStr) {
        if(!dateStr) return "—";
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}).replace(/ /g, '-');
    }

    function downloadInvoice() {
        window.scrollTo(0, 0);
        const invId = document.getElementById("invoiceId").value || "—";
        const cName = document.getElementById("client").value || "—";
        const cId = document.getElementById("clientId").value || "—";
        const invDate = formatPD(document.getElementById("invoiceDate").value);
        const dueDate = document.getElementById("dueDate").value ? formatPD(document.getElementById("dueDate").value) : "—";
        
        const subtotal = services.reduce((sum, s) => sum + s.amount, 0);
        const adj = parseFloat(document.getElementById("adjustments").value) || 0;
        const adv = parseFloat(document.getElementById("advance").value) || 0;
        const grandTotal = subtotal + adj - adv;

        let rows = services.map(s => `
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding:10px; font-size:12px;">
                    <strong>${s.name}</strong>
                    ${s.showDocs === 'yes' && serviceCatalog[s.name] ? `<br><span style="font-size:10px; color:#8B6F47; font-style:italic;">Required Documents: ${serviceCatalog[s.name].docs}</span>` : ''}
                </td>
                <td style="padding:10px; font-size:12px; text-align:center;">${s.sId || "—"}</td>
                <td style="padding:10px; font-size:12px; text-align:center;">${s.period || "—"}</td>
                <td style="padding:10px; font-size:12px; text-align:right;">₹${s.amount.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
            </tr>
        `).join('');

        const content = document.createElement('div');
        content.innerHTML = `
            <div style="width:210mm; padding:20mm; font-family: 'Helvetica Neue', Arial, sans-serif; background:white; color:#1a1a1a; box-sizing:border-box;">
                
                <table style="width: 100%; border-bottom: 2px solid #8B6F47; padding-bottom: 10px; margin-bottom: 25px;">
                    <tr>
                        <td style="width: 40%; vertical-align: bottom;">
                            <img src="logocmeg.png" crossorigin="anonymous" onerror="this.style.display='none'" style="width: 130px; height: auto; display: block;">
                        </td>
                        <td style="width: 60%; text-align: right; vertical-align: bottom;">
                            <h1 style="margin: 0 0 5px 0; color: #8B6F47; font-size: 24px; text-transform: uppercase;">CM Experts Group</h1>
                            <p style="margin: 0 0 6px 0; font-size: 13px; font-weight: 600;">Experts in Tax, Accounting, & Modern Tech for Business</p>
                            <p style="margin: 0; font-size: 11px; color: #555;">Email: support@cmeg.in &nbsp;|&nbsp; Phone: (91) 9946151111</p>
                            <p style="margin: 3px 0 0 0; font-size: 11px; color: #555;">Website: www.cmeg.in</p>
                        </td>
                    </tr>
                </table>

                <table style="width: 100%; margin-bottom: 30px;">
                    <tr>
                        <td style="width: 50%; vertical-align: top;">
                            <h2 style="margin:0 0 10px 0; font-size:18px; text-transform:uppercase; color:#333;">Proforma Invoice</h2>
                            <table style="font-size:12px; line-height:1.6;">
                                <tr><td style="font-weight:600; padding-right:15px;">Invoice No:</td><td>${invId}</td></tr>
                                <tr><td style="font-weight:600; padding-right:15px;">Invoice Date:</td><td>${invDate}</td></tr>
                                <tr><td style="font-weight:600; padding-right:15px;">Due Date:</td><td>${dueDate}</td></tr>
                            </table>
                        </td>
                        <td style="width: 50%; vertical-align: top; text-align: right;">
                            <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #eee; display: inline-block; text-align: left; min-width: 220px;">
                                <h3 style="margin:0 0 8px 0; font-size:13px; color:#8B6F47; text-transform:uppercase;">Client Details</h3>
                                <p style="margin:0 0 4px 0; font-size:14px; font-weight:700;">${cName}</p>
                                <p style="margin:0; font-size:12px; color:#555;">Client ID: ${cId}</p>
                            </div>
                        </td>
                    </tr>
                </table>

                <h3 style="margin:0 0 10px 0; font-size:14px; color:#333; border-bottom:1px solid #ddd; padding-bottom:5px;">Service Details</h3>
                <table style="width:100%; border-collapse:collapse; margin-bottom:25px;">
                    <thead>
                        <tr style="background:#f4f5f7;">
                            <th style="text-align:left; padding:10px; font-size:11px; text-transform:uppercase; border-bottom:2px solid #8B6F47;">Service Description</th>
                            <th style="text-align:center; padding:10px; font-size:11px; text-transform:uppercase; border-bottom:2px solid #8B6F47;">Service ID</th>
                            <th style="text-align:center; padding:10px; font-size:11px; text-transform:uppercase; border-bottom:2px solid #8B6F47;">Period</th>
                            <th style="text-align:right; padding:10px; font-size:11px; text-transform:uppercase; border-bottom:2px solid #8B6F47;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>

                <table style="width: 100%; margin-bottom: 30px;">
                    <tr>
                        <td style="width: 55%; vertical-align: top; padding-right: 30px;">
                            <h3 style="margin:0 0 10px 0; font-size:13px; color:#8B6F47; text-transform:uppercase;">Amount in Words</h3>
                            <p style="margin:0; font-size:12px; font-weight:600; font-style:italic; background:#f9f9f9; padding:10px; border-left:3px solid #8B6F47;">${numberToWords(Math.max(0, grandTotal)).charAt(0).toUpperCase() + numberToWords(Math.max(0, grandTotal)).slice(1)}</p>
                        </td>
                        <td style="width: 45%; vertical-align: top;">
                            <h3 style="margin:0 0 10px 0; font-size:13px; color:#8B6F47; text-transform:uppercase;">Amount Summary</h3>
                            <table style="width:100%; font-size:12px; line-height:1.8;">
                                <tr><td style="padding-right:15px;">Subtotal:</td><td style="text-align:right;">₹${subtotal.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
                                <tr><td style="padding-right:15px; color:#555;">Adjustments:</td><td style="text-align:right; color:#555;">₹${adj.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
                                <tr><td style="padding-right:15px; color:#555; border-bottom:1px solid #ddd; padding-bottom:5px;">Advance Received:</td><td style="text-align:right; color:#555; border-bottom:1px solid #ddd; padding-bottom:5px;">₹${adv.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
                                <tr><td style="padding-top:8px; font-weight:700; font-size:14px;">Grand Total:</td><td style="padding-top:8px; text-align:right; font-weight:700; font-size:14px; color:#8B6F47;">₹${grandTotal.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
                            </table>
                        </td>
                    </tr>
                </table>

                <table style="width: 100%; border-top: 1px solid #ddd; padding-top: 15px;">
                    <tr>

    function sendPaymentLink() {
        const mob = document.getElementById("clientMobile").value;
        const subtotal = services.reduce((sum, s) => sum + s.amount, 0);
        const adj = parseFloat(document.getElementById("adjustments").value) || 0;
        const adv = parseFloat(document.getElementById("advance").value) || 0;
        const total = subtotal + adj - adv;

        const params = new URLSearchParams();
        params.append('mode', 'client');
        params.append('client', document.getElementById("client").value);
        params.append('clientId', document.getElementById("clientId").value);
        params.append('id', document.getElementById("invoiceId").value);
        params.append('date', document.getElementById("invoiceDate").value);
        params.append('due', document.getElementById("dueDate").value);
        params.append('adj', document.getElementById("adjustments").value);
        params.append('adv', document.getElementById("advance").value);
        
        params.append('snames', services.map(s => s.name).join('|'));
        params.append('sids', services.map(s => s.sId).join('|'));
        params.append('spers', services.map(s => s.period).join('|'));
        params.append('samts', services.map(s => s.amount).join('|'));
        params.append('sdocs', services.map(s => s.showDocs).join('|'));

        const url = `${HOSTED_PORTAL_URL}?${params.toString()}`;
        
        const msg = `Hi ${document.getElementById("client").value},\nYour Invoice ${document.getElementById("invoiceId").value} is ready.\nGrand Total: ₹${total.toLocaleString('en-IN')}\n\nView & Pay: ${url}`;
        window.open(`https://api.whatsapp.com/send?phone=91${mob}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function payViaUPI() {
        const subtotal = services.reduce((sum, s) => sum + s.amount, 0);
        const adj = parseFloat(document.getElementById("adjustments").value) || 0;
        const adv = parseFloat(document.getElementById("advance").value) || 0;
        const total = subtotal + adj - adv;
        window.location.href = `upi://pay?pa=cmtaxexperts@ybl&pn=CMEG&am=${total}&cu=INR`;
    }
