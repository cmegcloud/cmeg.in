<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CM Tax Experts Payment</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:#FFF5F5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#5a1a1a;
}

.card{
width:92%;
max-width:420px;
background:white;
border-radius:20px;
padding:30px;
text-align:center;

border-top:4px solid #C8102E;

box-shadow:
0 15px 40px rgba(200,16,46,0.15);
}

.logo{
width:90px;
margin-bottom:10px;
}

.title{
font-size:20px;
font-weight:600;
color:#C8102E;
}

.subtitle{
font-size:13px;
color:#a94444;
margin-bottom:20px;
}

.amountbox{
background:linear-gradient(145deg,#C8102E,#8B0000);
border-radius:12px;
padding:18px;
color:white;
margin-bottom:20px;
}

.amount{
font-size:38px;
font-weight:700;
}

.info{
background:#ffeaea;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.info b{
color:#C8102E;
}

.qr{
background:white;
padding:12px;
border-radius:12px;
display:inline-block;
margin:20px 0;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.paybtn{
display:block;
text-decoration:none;
background:linear-gradient(145deg,#C8102E,#8B0000);
color:white;
font-weight:600;
padding:14px;
border-radius:10px;
transition:0.2s;
}

.paybtn:hover{
opacity:0.9;
transform:scale(1.02);
}

.footer{
font-size:11px;
margin-top:20px;
color:#a94444;
}

</style>
</head>

<body>

<div class="card">

<img src="logo-cmte.png" class="logo">

<div class="title">CM Tax Experts</div>
<div class="subtitle">Compliance Payment Portal</div>

<div class="amountbox">
TOTAL PAYABLE
<div class="amount" id="amt">₹0</div>
</div>

<div class="info">
Invoice For<br>
<b id="client"></b>
</div>

<div class="info">
Paying To<br>
<b id="upi">cmtaxexperts@ybl</b>
</div>

<div class="qr">
<canvas id="qrcode"></canvas>
</div>

<a id="paybtn" class="paybtn">Tap to Pay via UPI</a>

<div class="footer">
CM Tax Experts<br>
Experts in Compliance<br>
www.cmtaxexperts.cmeg.in
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search)

const client = params.get("client") || "Client"
const amount = params.get("amt") || "0"
const upi = params.get("upi") || "cmtaxexperts@ybl"

document.getElementById("client").innerText = client
document.getElementById("amt").innerText = "₹ " + amount
document.getElementById("upi").innerText = upi

const upilink =
`upi://pay?pa=${upi}&pn=CMTE&am=${amount}&cu=INR&tn=${client}`

document.getElementById("paybtn").href = upilink

QRCode.toCanvas(document.getElementById("qrcode"), upilink,{width:200})

</script>

</body>
</html>
