<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CM Experts Group - Proforma Invoice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #8B6F47;
            --primary-dark: #705836;
            --bg-color: #f4f5f7;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --border-focus: #d4a574;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); }
        body { display: flex; justify-content: center; align-items: flex-start; padding: 20px 16px; overflow-y: auto; }
        .container { background: var(--surface); border-radius: 20px; padding: 36px 28px; max-width: 460px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 40px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .header { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .logo-img { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 16px; display: block; }
        h1 { font-size: 22px; color: var(--text-main); margin-bottom: 4px; font-weight: 700; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 16px; margin-bottom: 32px; }
        .detail-group { display: flex; flex-direction: column; }
        .detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; font-weight: 600; }
        .detail-value { width: 100%; border: none; border-bottom: 1px dashed var(--border-focus); background: transparent; padding: 6px 0; font-size: 15px; font-weight: 600; color: var(--text-main); border-radius: 0; }
        .detail-value:focus { outline: none; border-bottom: 1px solid var(--primary); background: rgba(139, 111, 71, 0.03); }
        textarea.detail-value { border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 500; resize: vertical; min-height: 60px; }
        .services-section { background: #fafafa; border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px solid var(--border); }
        .service-item { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .service-item:last-child { border-bottom: none; }
        .service-amount-input { font-size: 14px; color: var(--text-main); font-weight: 500; padding: 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
        .amount-field { width: 90px; text-align: right; font-weight: 600; color: var(--primary); }
        .service-remove { background: none; border: none; color: #d1d5db; cursor: pointer; font-size: 16px; padding: 4px; }
        .btn-add-service { width: 100%; margin-top: 16px; background: transparent; color: var(--primary); border: 1px dashed var(--primary); padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .total-section { background: linear-gradient(145deg, var(--primary), var(--primary-dark)); border-radius: 16px; padding: 24px; margin-bottom: 32px; color: white; box-shadow: 0 8px 20px rgba(139, 111, 71, 0.25); }
        .total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
        .total-value { font-size: 32px; font-weight: 700; line-height: 1; }
        .qr-section { margin-bottom: 32px; padding: 20px; background: #fafafa; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .division-item { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4; }
        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: var(--text-main); border: 1px solid var(--border); }
        body.client-mode .admin-only { display: none !important; }
        .client-only { display: none; }
        body.client-mode .client-only { display: flex !important; }
        body.client-mode .detail-value { pointer-events: none; border: none !important; }
        footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container" id="loginContainer" style="display: none;">
    <div class="header">
        <img src="logocmeg.png" alt="CM Experts Group" class="logo-img">
        <h1>CM Experts Group</h1>
        <p class="subtitle">Secure PIN Entry</p>
    </div>
    <div class="detail-group">
        <input type="password" inputmode="numeric" id="passwordInput" class="detail-value" placeholder="••••" style="text-align: center; font-size: 28px; letter-spacing: 12px;" onkeypress="handleLoginKeyPress(event)">
    </div>
    <div id="loginError" style="color:red; text-align:center; display:none; margin:10px;">Invalid PIN</div>
    <button class="action-btn btn-primary" onclick="processLogin()">Unlock</button>
</div>

<div class="container" id="appContainer" style="display: none;">
    <div class="header">
        <img src="logocmeg.png" alt="CM Experts Group" class="logo-img">
        <h1>CM Experts Group</h1>
        <p class="subtitle" id="portalSubtitle">Count • Connect • Grow</p>
    </div>

    <div class="details-grid">
        <div class="detail-group">
            <span class="detail-label">Client Name</span>
            <input type="text" id="client" list="clientList" class="detail-value" placeholder="Type or select..." onchange="updateClientId()">
            <datalist id="clientList"></datalist>
        </div>
        <div class="detail-group">
            <span class="detail-label">Client ID</span>
            <input type="text" id="clientId" value="" class="detail-value" placeholder="Auto-fills...">
        </div>
        <div class="detail-group">
            <span class="detail-label">Invoice ID</span>
            <input type="text" id="invoiceId" value="" class="detail-value">
        </div>
        <div class="detail-group">
            <span class="detail-label">Date</span>
            <input type="date" id="invoiceDate" class="detail-value">
        </div>
        <div class="detail-group admin-only">
            <span class="detail-label">Client Mobile</span>
            <input type="tel" id="clientMobile" value="9895470148" class="detail-value">
        </div>
        <div class="detail-group" style="grid-column: 1 / -1;">
            <span class="detail-label">Notes</span>
            <textarea id="invoiceNotes" class="detail-value" placeholder="Terms or specific notes..."></textarea>
        </div>
    </div>

    <div class="services-section">
        <div class="section-title" style="font-weight:700; margin-bottom:10px;">Billing Items</div>
        <div id="servicesList"></div>
        <button class="btn-add-service admin-only" onclick="addService()">+ Add Item</button>
    </div>

    <div class="total-section">
        <div class="total-row">
            <span class="total-label">Total Amount</span>
            <span class="total-value" id="totalAmount">₹0</span>
        </div>
        <div class="total-words" id="totalWords" style="font-size:11px; opacity:0.8;">Zero Rupees Only</div>
    </div>

    <div class="qr-section">
        <div class="divisions-text">
            <div class="division-item"><strong>1. CM Tax Experts</strong></div>
            <div class="division-item"><strong>2. Accountree</strong></div>
            <div class="division-item"><strong>3. CMB ERP</strong></div>
        </div>
        <div style="text-align:right;">
            <img src="qrcmeg.png" style="width:60px; height:60px; border:1px solid #ddd;">
            <div style="font-size:10px; font-weight:700; color:var(--primary);">www.cmeg.in</div>
        </div>
    </div>

    <div class="button-group">
        <button class="action-btn btn-primary admin-only" onclick="sendPaymentLink()">Send WhatsApp Link</button>
        <button class="action-btn btn-primary client-only" onclick="payViaUPI()">Pay Now via UPI</button>
        <button class="action-btn btn-secondary" onclick="downloadInvoice()">Download PDF</button>
    </div>

    <footer>
        <div class="footer-brand">CM Experts Group</div>
        <div>Support@cmeg.in | 9946151111</div>
    </footer>
</div>

<script>
    // ==========================================
    const HOSTED_PORTAL_URL = "https://cmeg.in/invoice.html"; 
    
    // UPDATED: Now pointing to your JSON file
    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/clients.json"; 
    // ==========================================

    const params = new URLSearchParams(window.location.search);
    const isClientMode = params.get("mode") === "client";
    
    // Crash Protection: Safe URL Decoder
    const safeGetParam = (key) => {
        try {
            const val = params.get(key);
            return val ? decodeURIComponent(val) : "";
        } catch (e) {
            return "";
        }
    };

    // Service Database
    const serviceCatalog = {
        "GST Registration": { type: "reg", docs: "PAN, Aadhaar, Photo, Electricity Bill, Cancelled Cheque" },
        "GST Return Filing": { type: "ret", docs: "" },
        "Income Tax Return": { type: "ret", docs: "" },
        "MSME (Udyam) Registration": { type: "reg", docs: "Aadhaar Card, PAN Card, Bank Details" },
        "Company Incorporation": { type: "reg", docs: "PAN, Aadhaar, DIN, Digital Signature, Address Proof" },
        "PAN/TAN Application": { type: "reg", docs: "ID Proof, Address Proof, Photo" },
        "TDS Return Filing": { type: "ret", docs: "" },
        "Other Consultancy": { type: "other", docs: "" }
    };

    let services = [];
    let clientDatabase = {}; // Stores mapping of Name to ID
    
    // Load initial services
    const sNamesParam = safeGetParam("snames");
    const sAmtsParam = safeGetParam("samts");
    if (sNamesParam && sAmtsParam) {
        const namesArr = sNamesParam.split('|');
        const amtsArr = sAmtsParam.split('|');
        namesArr.forEach((n, i) => services.push({ id: i+1, name: n, amount: parseInt(amtsArr[i]) || 0, showDocs: 'no' }));
    } else {
        services.push({ id: 1, name: "GST Registration", amount: 5000, showDocs: 'no' });
    }

    function generateInvoiceId() {
        const d = new Date();
        const yy = String(d.getFullYear()).slice(-2);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        return `PI${yy}4${dd}${mm}`;
    }

    // UPDATED: Fetch Clients from JSON file instead of CSV
    async function fetchClients() {
        try {
            const response = await fetch(GITHUB_JSON_URL);
            if (!response.ok) throw new Error("Network error fetching JSON");
            
            const clients = await response.json(); 
            const clientList = document.getElementById("clientList");
            
            clients.forEach(client => {
                // Tries a few common key names just in case they are formatted differently in JSON
                const cName = client["Client Name"] || client.client_name || client.name || client.ClientName; 
                const cId = client["Client ID"] || client.client_id || client.id || client.ClientID;
                
                if (cName && cId) {
                    clientDatabase[cName] = cId;
                    
                    const opt = document.createElement('option');
                    opt.value = cName;
                    clientList.appendChild(opt);
                }
            });
        } catch(e) {
            console.warn("Could not load clients. You can manually type the client name.", e);
        }
    }

    function updateClientId() {
        const clientInput = document.getElementById("client").value;
        if(clientDatabase[clientInput]) {
            document.getElementById("clientId").value = clientDatabase[clientInput];
        } else {
            document.getElementById("clientId").value = ""; // Clear if not found
        }
    }

    // Initialize Mode
    if (isClientMode) {
        document.body.classList.add('client-mode');
        document.getElementById('appContainer').style.display = 'block';
        
        document.getElementById("client").value = safeGetParam("client");
        document.getElementById("invoiceId").value = safeGetParam("id");
        document.getElementById("clientId").value = safeGetParam("clientId");
        document.getElementById("invoiceDate").value = safeGetParam("date");
        document.getElementById("invoiceNotes").value = safeGetParam("notes");
    } else {
        document.getElementById('loginContainer').style.display = 'block';
        fetchClients();
        document.getElementById("invoiceId").value = generateInvoiceId();
        document.getElementById("invoiceDate").value = new Date().toISOString().split('T')[0];
    }

    function processLogin() {
        if (document.getElementById('passwordInput').value === '3655') {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }
    function handleLoginKeyPress(e) { if (e.key === 'Enter') processLogin(); }

    function renderServices() {
        const list = document.getElementById("servicesList");
        list.innerHTML = '';
        let total = 0;

        services.forEach(s => {
            total += s.amount;
            const data = serviceCatalog[s.name] || { type: 'other', docs: '' };
            const isReg = data.type === 'reg';

            const item = document.createElement('div');
            item.className = 'service-item';
            
            let options = Object.keys(serviceCatalog).map(name => 
                `<option value="${name}" ${s.name === name ? 'selected' : ''}>${name}</option>`
            ).join('');

            item.innerHTML = `
                <div style="display:flex; gap:10px; align-items:center;">
                    <select class="service-amount-input" style="flex:1;" onchange="updateServiceName(${s.id}, this.value)" ${isClientMode ? 'disabled' : ''}>
                        ${options}
                    </select>
                    <input type="number" class="service-amount-input amount-field" value="${s.amount}" onchange="updateServiceAmount(${s.id}, this.value)" ${isClientMode ? 'readonly' : ''}>
                    ${!isClientMode ? `<button class="service-remove" onclick="removeService(${s.id})">✕</button>` : ''}
                </div>
                ${isReg ? `
                    <div style="margin-top:5px; background:#f0f0f0; padding:8px; border-radius:6px; font-size:11px;">
                        <span>Require Documents?</span>
                        <select onchange="toggleDocs(${s.id}, this.value)" style="margin-left:10px;" ${isClientMode ? 'disabled' : ''}>
                            <option value="no" ${s.showDocs === 'no' ? 'selected' : ''}>No</option>
                            <option value="yes" ${s.showDocs === 'yes' ? 'selected' : ''}>Yes</option>
                        </select>
                        ${s.showDocs === 'yes' ? `<div style="color:var(--primary); margin-top:5px;"><strong>Docs:</strong> ${data.docs}</div>` : ''}
                    </div>
                ` : ''}
            `;
            list.appendChild(item);
        });

        document.getElementById("totalAmount").innerText = '₹' + total.toLocaleString('en-IN');
        document.getElementById("totalWords").innerText = numberToWords(total);
    }

    function updateServiceName(id, name) { const s = services.find(x => x.id === id); if(s) { s.name = name; s.showDocs = 'no'; renderServices(); } }
    function updateServiceAmount(id, amt) { const s = services.find(x => x.id === id); if(s) { s.amount = parseInt(amt) || 0; renderServices(); } }
    function toggleDocs(id, val) { const s = services.find(x => x.id === id); if(s) { s.showDocs = val; renderServices(); } }
    
    function addService() {
        const id = services.length ? Math.max(...services.map(s => s.id)) + 1 : 1;
        services.push({ id, name: "Other Consultancy", amount: 0, showDocs: 'no' });
        renderServices();
    }
    
    function removeService(id) { services = services.filter(s => s.id !== id); renderServices(); }

    function numberToWords(num) {
        if (num === 0) return 'Zero Rupees Only';
        const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
        const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        function convert(n) {
            let res = "";
            if (n >= 100) { res += ones[Math.floor(n/100)] + " Hundred "; n %= 100; }
            if (n >= 20) { res += tens[Math.floor(n/10)] + " "; n %= 10; }
            if (n >= 10) { res += teens[n-10] + " "; n = 0; }
            if (n > 0) res += ones[n] + " ";
            return res.trim();
        }
        let result = "";
        if (Math.floor(num / 10000000) > 0) { result += convert(Math.floor(num/10000000)) + " Crore "; num %= 10000000; }
        if (Math.floor(num / 100000) > 0) { result += convert(Math.floor(num/100000)) + " Lakh "; num %= 100000; }
        if (Math.floor(num / 1000) > 0) { result += convert(Math.floor(num/1000)) + " Thousand "; num %= 1000; }
        result += convert(num);
        return result.trim() + " Rupees Only";
    }

    renderServices();

    function downloadInvoice() {
        window.scrollTo(0, 0);
        const total = services.reduce((sum, s) => sum + s.amount, 0);
        const invId = document.getElementById("invoiceId").value;
        const clientName = document.getElementById("client").value || "Client Name";
        const clientId = document.getElementById("clientId").value;
        const noteTxt = document.getElementById("invoiceNotes").value;
        
        let rows = services.map(s => `
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding:10px;">
                    ${s.name}
                    ${s.showDocs === 'yes' ? `<br><small style="color:#8B6F47;">Required: ${serviceCatalog[s.name].docs}</small>` : ''}
                </td>
                <td style="text-align:right; padding:10px;">₹${s.amount.toLocaleString('en-IN')}</td>
            </tr>
        `).join('');

        const content = document.createElement('div');
        content.innerHTML = `
            <div style="width:210mm; padding:20mm; font-family:sans-serif; background:white;">
                <div style="border-bottom:3px solid #8B6F47; padding-bottom:10px; display:flex; justify-content:space-between;">
                    <img src="logocmeg.png" style="width:80px;">
                    <div style="text-align:right;">
                        <h1 style="color:#8B6F47; margin:0;">CM EXPERTS GROUP</h1>
                        <p style="font-size:12px; color:#666;">Count • Connect • Grow</p>
                    </div>
                </div>
                <div style="margin-top:20px; display:flex; justify-content:space-between;">
                    <div>
                        <h3>PROFORMA INVOICE</h3>
                        <p>Invoice ID: ${invId}</p>
                        <p>Client ID: ${clientId}</p>
                    </div>
                    <div style="text-align:right;">
                        <p>Date: ${document.getElementById("invoiceDate").value}</p>
                    </div>
                </div>
                <div style="margin:20px 0; padding:15px; background:#f9f9f9; border-left:5px solid #8B6F47;">
                    <strong>Bill To:</strong><br>${clientName}
                </div>
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="background:#eee;"><th style="text-align:left; padding:10px;">Description</th><th style="text-align:right; padding:10px;">Amount</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="text-align:right; margin-top:20px; padding:15px; background:#f9f9f9;">
                    <p style="font-size:20px; color:#8B6F47;">Total: ₹${total.toLocaleString('en-IN')}</p>
                    <small>${numberToWords(total)}</small>
                </div>
                ${noteTxt ? `<div style="margin-top:20px; font-size:12px;"><strong>Notes:</strong><br>${noteTxt}</div>` : ''}
                <div style="margin-top:40px; border-top:1px solid #ddd; padding-top:20px; text-align:center; font-size:10px; color:#999;">
                    This is a computer-generated document.
                </div>
            </div>
        `;
        
        html2pdf().from(content).set({ margin: 0, filename: `Invoice_${invId}.pdf`, jsPDF: { unit: 'mm', format: 'a4' } }).save();
    }

    function sendPaymentLink() {
        const mob = document.getElementById("clientMobile").value;
        const total = services.reduce((sum, s) => sum + s.amount, 0);
        const sNames = encodeURIComponent(services.map(s => s.name).join('|'));
        const sAmts = encodeURIComponent(services.map(s => s.amount).join('|'));
        const client = encodeURIComponent(document.getElementById("client").value || "Client Name");
        const clientId = encodeURIComponent(document.getElementById("clientId").value);
        const id = encodeURIComponent(document.getElementById("invoiceId").value);
        const date = document.getElementById("invoiceDate").value;
        const notes = encodeURIComponent(document.getElementById("invoiceNotes").value);
        
        const url = `${HOSTED_PORTAL_URL}?mode=client&client=${client}&clientId=${clientId}&id=${id}&date=${date}&snames=${sNames}&samts=${sAmts}&notes=${notes}`;
        const msg = `Hi ${decodeURIComponent(client)},\nYour Invoice ${decodeURIComponent(id)} is ready.\nTotal: ₹${total.toLocaleString('en-IN')}\nView & Pay: ${url}`;
        window.open(`https://api.whatsapp.com/send?phone=91${mob}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function payViaUPI() {
        const total = services.reduce((sum, s) => sum + s.amount, 0);
        const upi = "cmtaxexperts@ybl";
        window.location.href = `upi://pay?pa=${upi}&pn=CMEG&am=${total}&cu=INR`;
    }
</script>
</body>
</html>
