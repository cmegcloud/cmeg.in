<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_MSG_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.initiatePayment = async function () {
  const name = document.getElementById('patientName').value.trim();
  const phone = document.getElementById('patientPhone').value.trim();
  const branch = document.getElementById('branchSelect').value;
  const doctor = document.getElementById('doctorSelect').value;
  const date = document.getElementById('appointDate').value;
  const time = document.getElementById('appointTime').value;

  if (!name || !phone || !date || !time) {
    alert("Please fill all required fields.");
    return;
  }

  try {
    const ref = await addDoc(collection(db, "appointments"), {
      patientName: name,
      phone: phone,
      branch: branch,
      doctor: doctor,
      appointmentDate: date,
      appointmentTime: time,
      amount: 500,
      status: "Pending Payment",
      createdAt: serverTimestamp()
    });

    const bookingId = ref.id;

    window.location.href =
      `upi://pay?pa=stracare@upi&pn=STRA%20CARE&tr=${bookingId}&am=500.00&cu=INR&tn=Consultation`;

    const msg = document.getElementById("statusMsg");
    msg.textContent = "Booking
