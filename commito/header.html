<header class="h-16 md:h-20 m-4 mb-2 md:mt-4 md:mr-4 bg-theme-primary rounded-full shadow-floating px-4 md:px-6 flex items-center justify-between shrink-0 border-none z-10 text-white">  
    
    <!-- Mobile Dashboard Left Context Branding Block -->
    <div class="flex items-center gap-3">  
        <!-- Mobile Sidebar Toggle -->
        <button onclick="toggleMobileSidebar()" class="lg:hidden w-10 h-10 bg-white/10 text-slate-300 rounded-full flex items-center justify-center hover:bg-white/20 transition-colors shrink-0">
            <i data-lucide="menu" class="w-[18px] h-[18px]"></i>
        </button>

        <div class="flex items-center gap-2 lg:hidden pr-2">  
            <img src="assets/logo-light.png" alt="Bito Logo" class="w-8 h-8 object-contain" onerror="this.outerHTML='<div class=\'w-8 h-8 bg-white/10 text-white flex items-center justify-center font-bold rounded-xl\'>B</div>'">
            <img src="assets/name-light.png" alt="Bito Navigation" class="h-4.5 object-contain" onerror="this.outerHTML='<span class=\'font-bold text-xl brand-logo-text text-white\'>B<span class=\'text-theme-accent\'>I</span>TO</span>'">
        </div> 

        <!-- Desktop Sidebar Toggle -->
        <button onclick="toggleDesktopSidebar()" class="hidden lg:flex w-10 h-10 bg-white/10 rounded-full items-center justify-center text-slate-300 hover:bg-white/20 hover:text-white transition-colors shrink-0">  
            <i data-lucide="menu" class="w-[18px] h-[18px]"></i>
        </button> 
    </div>  

    <!-- Desktop Master Search Bar -->
    <div class="hidden md:flex flex-1 max-w-xl relative items-center mx-6">
        <i data-lucide="search" class="absolute left-4 w-4 h-4 text-slate-400"></i>
        <input type="text" placeholder="Search invoices, clients, tasks..." class="w-full bg-white/10 border border-white/5 rounded-full py-2.5 pl-10 pr-10 text-[13.5px] text-white placeholder-slate-400 focus:outline-none focus:bg-white/20 focus:border-white/20 transition-colors">
        <button class="absolute right-4 text-slate-400 hover:text-white" title="Clear Field" onclick="this.previousElementSibling.value=''">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
    </div>

    <!-- Top Right Utility Actions -->
    <div class="flex items-center gap-2 md:gap-3 ml-auto">  
        <button class="md:hidden w-10 h-10 bg-white/10 text-slate-300 rounded-full flex items-center justify-center hover:bg-white/20 transition-colors">
            <i data-lucide="search" class="w-[18px] h-[18px]"></i>
        </button>
        <button class="hidden md:flex w-10 h-10 bg-white/10 text-slate-300 rounded-full items-center justify-center hover:bg-white/20 hover:text-white transition-colors" title="Toggle Theme mode">
            <i data-lucide="moon" class="w-[18px] h-[18px]"></i>
        </button>
        <button class="w-10 h-10 bg-white/10 text-slate-300 rounded-full flex items-center justify-center hover:bg-white/20 hover:text-white transition-colors" onclick="syncData()" title="Sync Workspace Data Pool">  
            <i data-lucide="refresh-cw" class="w-[18px] h-[18px]" id="sync-icon"></i>  
        </button>  

        <div class="flex items-center gap-3 pl-2 md:pl-4 md:border-l border-slate-700">
            <div class="hidden md:flex flex-col justify-center text-right mr-1">
                <p class="text-[13.5px] leading-tight font-bold text-white">M/s Alfa</p>
                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Admin</p>
            </div>
            <div class="w-9 h-9 md:w-10 md:h-10 bg-theme-accent text-white rounded-full flex items-center justify-center font-bold text-sm shadow-md cursor-pointer">  
                AL
            </div>
        </div>
    </div>  
</header>
