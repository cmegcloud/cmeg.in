  <script>
    // Default configuration
    const defaultConfig = {
      app_title: 'CMEG Html Viewer',
      preview_title: 'Live Preview',
      primary_color: '#A67C52',
      dark_color: '#856341',
      background_color: '#FEFBED',
      text_color: '#0F172A',
      secondary_text_color: '#475569'
    };

    let currentTab = 'editor';

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
          document.getElementById('preview-title').textContent = config.preview_title || defaultConfig.preview_title;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => window.elementSdk.setConfig({ primary_color: value })
            },
            {
              get: () => config.dark_color || defaultConfig.dark_color,
              set: (value) => window.elementSdk.setConfig({ dark_color: value })
            },
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => window.elementSdk.setConfig({ background_color: value })
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => window.elementSdk.setConfig({ text_color: value })
            },
            {
              get: () => config.secondary_text_color || defaultConfig.secondary_text_color,
              set: (value) => window.elementSdk.setConfig({ secondary_text_color: value })
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['app_title', config.app_title || defaultConfig.app_title],
          ['preview_title', config.preview_title || defaultConfig.preview_title]
        ])
      });
    }

    const codeEditor = document.getElementById('code-editor');
    const previewFrame = document.getElementById('preview-frame');
    const lineNumbers = document.getElementById('line-numbers');
    const charCount = document.getElementById('char-count');
    const lineCount = document.getElementById('line-count');

    // Update line numbers
    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n').length;
      let html = '';
      for (let i = 1; i <= lines; i++) {
        html += '<span></span>';
      }
      lineNumbers.innerHTML = html;
      
      // Update counts
      charCount.textContent = `${codeEditor.value.length} chars`;
      lineCount.textContent = `${lines} line${lines !== 1 ? 's' : ''}`;
    }

    // Sync scroll between editor and line numbers
    codeEditor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    codeEditor.addEventListener('input', updateLineNumbers);

    // Tab switching
    function switchTab(tab) {
      currentTab = tab;
      const editorPanel = document.getElementById('editor-panel');
      const previewPanel = document.getElementById('preview-panel');
      const tabEditor = document.getElementById('tab-editor');
      const tabPreview = document.getElementById('tab-preview');
      const tabSplit = document.getElementById('tab-split');

      // Reset all tabs
      [tabEditor, tabPreview, tabSplit].forEach(t => {
        t.classList.remove('tab-active');
        t.classList.add('tab-inactive');
      });

      if (tab === 'editor') {
        editorPanel.classList.remove('hidden');
        previewPanel.classList.add('hidden');
        tabEditor.classList.remove('tab-inactive');
        tabEditor.classList.add('tab-active');
      } else if (tab === 'preview') {
        editorPanel.classList.add('hidden');
        previewPanel.classList.remove('hidden');
        tabPreview.classList.remove('tab-inactive');
        tabPreview.classList.add('tab-active');
        runCode();
      } else if (tab === 'split') {
        editorPanel.classList.remove('hidden');
        previewPanel.classList.remove('hidden');
        tabSplit.classList.remove('tab-inactive');
        tabSplit.classList.add('tab-active');
        runCode();
      }
    }

    // Run code in preview
    function runCode() {
      const code = codeEditor.value;
      const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      previewDoc.open();
      previewDoc.write(code);
      previewDoc.close();
      
      // Auto-switch to preview on mobile
      if (window.innerWidth < 640 && currentTab === 'editor') {
        switchTab('preview');
      }
      
      showToast('Code executed successfully!', 'success');
    }

    // Refresh preview
    function refreshPreview() {
      runCode();
    }

    // Toggle menu
    function toggleMenu() {
      const menu = document.getElementById('dropdown-menu');
      menu.classList.toggle('hidden');
    }

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('dropdown-menu');
      const menuBtn = e.target.closest('button[onclick="toggleMenu()"]');
      if (!menuBtn && !menu.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    // Clear editor
    function clearEditor() {
      codeEditor.value = '';
      updateLineNumbers();
      const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      previewDoc.open();
      previewDoc.write('');
      previewDoc.close();
      showToast('Editor cleared', 'info');
    }

    // Load sample code
    function loadSample() {
      const sampleCode = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM Experts Group</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #FEFBED 0%, #fff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: #A67C52;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      color: white;
      font-weight: 800;
    }
    
    h1 {
      color: #0F172A;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    p {
      color: #475569;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .btn {
      background: #A67C52;
      color: white;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .btn:hover {
      background: #856341;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #E2E8F0;
    }
    
    .feature {
      text-align: center;
    }
    
    .feature-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .feature-text {
      color: #64748B;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CM</div>
    <h1>CM Experts Group</h1>
    <p>Professional consulting services with premium quality and expert guidance for your business needs.</p>
    <button class="btn" onclick="alert('Welcome to CM Experts!')">Get Started</button>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <div class="feature-text">Strategy</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💼</div>
        <div class="feature-text">Consulting</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📊</div>
        <div class="feature-text">Analytics</div>
      </div>
    </div>
  </div>
</body>
</html>`;
      
      codeEditor.value = sampleCode;
      updateLineNumbers();
      showToast('Sample code loaded!', 'success');
    }

    // Copy code to clipboard
    function copyCode() {
      if (codeEditor.value.trim() === '') {
        showToast('Nothing to copy', 'warning');
        return;
      }
      
      navigator.clipboard.writeText(codeEditor.value).then(() => {
        showToast('Code copied to clipboard!', 'success');
      }).catch(() => {
        showToast('Failed to copy code', 'error');
      });
    }

    // Download HTML file
    function downloadHtml() {
      if (codeEditor.value.trim() === '') {
        showToast('Nothing to download', 'warning');
        return;
      }
      
      const blob = new Blob([codeEditor.value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cmeg-code.html';
      document.body.appendChild(a);

    // Show toast notification
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        warning: 'bg-amber-500',
        info: 'bg-brand-primary'
      };
      
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };
      
      toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-card shadow-lg flex items-center gap-3 mb-2`;
      toast.innerHTML = `
        <span class="font-bold">${icons[type]}</span>
        <span class="font-medium text-sm">${message}</span>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Handle tab key in editor
    codeEditor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        codeEditor.value = codeEditor.value.substring(0, start) + '  ' + codeEditor.value.substring(end);
        codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
        updateLineNumbers();
      }
    });

    // Auto-run on Ctrl/Cmd + Enter
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runCode();
      }
    });

    // Initialize
    updateLineNumbers();
