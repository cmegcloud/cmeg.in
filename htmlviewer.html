<!doctype html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMEG HTML Viewer</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#A67C52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<script>

tailwind.config = {

darkMode: 'class',

theme: {
extend: {
colors: {
brand: {
primary: '#A67C52',
dark: '#856341'
}
}
}
}

}

</script>

<style>

*{
font-family:'Plus Jakarta Sans',sans-serif
}

textarea{
font-family:monospace;
line-height:1.6;
}

</style>

</head>

<body class="bg-slate-900 text-gray-200 h-screen flex flex-col">

<!-- BRAND BAR -->

<div class="h-1 bg-[#A67C52]"></div>

<!-- HEADER -->

<header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between">

<div class="flex items-center gap-3">

<img
src="https://raw.githubusercontent.com/cmegcloud/cmeg.in/main/logocmeg.png"
class="w-9 h-9 object-contain">

<div>

<h1 class="text-sm font-bold">
CMEG HTML Viewer
</h1>

<p class="text-xs text-slate-400">
CM Experts Group
</p>

</div>

</div>

<button onclick="toggleTheme()" class="p-2 rounded hover:bg-slate-700">

🌙

</button>

</header>

<!-- MAIN -->

<div class="flex-1 flex flex-col md:flex-row overflow-hidden">

<!-- EDITOR -->

<div class="flex-1 flex flex-col border-r border-slate-700">

<div class="text-xs px-4 py-2 bg-slate-800 border-b border-slate-700">

HTML CODE

</div>

<textarea
id="editor"
class="flex-1 bg-slate-900 text-gray-200 p-4 text-sm resize-none outline-none"
placeholder="Write HTML code here...">

</textarea>

</div>

<!-- PREVIEW -->

<div class="flex-1 flex flex-col">

<div class="text-xs px-4 py-2 bg-slate-800 border-b border-slate-700 flex justify-between">

LIVE PREVIEW

<button onclick="runCode()" class="text-xs text-amber-400">

Refresh

</button>

</div>

<iframe
id="preview"
class="flex-1 bg-white">

</iframe>

</div>

</div>

<!-- RUN BUTTON -->

<button
onclick="runCode()"
class="fixed bottom-6 right-6 bg-[#A67C52] hover:bg-[#856341] text-white px-6 py-3 rounded-xl shadow-lg">

Run Code

</button>

<script>

const editor = document.getElementById("editor")
const preview = document.getElementById("preview")

function runCode(){

const code = editor.value

const doc = preview.contentDocument || preview.contentWindow.document

doc.open()
doc.write(code)
doc.close()

}

function toggleTheme(){

document.documentElement.classList.toggle("dark")

if(document.documentElement.classList.contains("dark")){

localStorage.setItem("theme","dark")

}else{

localStorage.setItem("theme","light")

}

}

if(localStorage.getItem("theme") !== "light"){

document.documentElement.classList.add("dark")

}

</script>

</body>
</html>
